<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3c8772"/></marker><style>.t{font:700 24px sans-serif;fill:#173b32}.h{font:600 15px sans-serif;fill:#173b32}.s{font:13px sans-serif;fill:#31584e}.b{stroke:#3c8772;stroke-width:2;rx:10}.a{stroke:#3c8772;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="430" fill="#f7fbf9"/><text x="550" y="36" text-anchor="middle" class="t">工具请求的审批与沙箱决策</text><rect x="45" y="110" width="180" height="90" class="b" fill="#dff2eb"/><text x="135" y="146" text-anchor="middle" class="h">Tool call</text><text x="135" y="172" text-anchor="middle" class="s">命令 / 文件 / 网络</text><path d="M225 155h80" class="a"/><rect x="305" y="110" width="200" height="90" class="b" fill="#fff4d6"/><text x="405" y="146" text-anchor="middle" class="h">策略分类</text><text x="405" y="172" text-anchor="middle" class="s">目标、风险、权限</text><path d="M505 155h80" class="a"/><rect x="585" y="60" width="200" height="90" class="b" fill="#ffe6df"/><text x="685" y="96" text-anchor="middle" class="h">需要审批</text><text x="685" y="122" text-anchor="middle" class="s">用户允许 / 拒绝</text><path d="M505 155h80v150" class="a"/><rect x="585" y="260" width="200" height="90" class="b" fill="#e8e5f8"/><text x="685" y="296" text-anchor="middle" class="h">可自动执行</text><text x="685" y="322" text-anchor="middle" class="s">profile 已覆盖</text><path d="M785 105h90v100" class="a"/><path d="M785 305h90v-100" class="a"/><rect x="875" y="160" width="180" height="90" class="b" fill="#e8f4ef"/><text x="965" y="196" text-anchor="middle" class="h">平台沙箱</text><text x="965" y="222" text-anchor="middle" class="s">文件 / 网络 / 进程</text><text x="550" y="398" text-anchor="middle" class="s">无法可靠表达策略时拒绝执行，而不是回退到更宽权限</text></svg>
