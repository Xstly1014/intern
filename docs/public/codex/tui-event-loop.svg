<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3c8772"/></marker><style>.t{font:700 24px sans-serif;fill:#173b32}.h{font:600 15px sans-serif;fill:#173b32}.s{font:13px sans-serif;fill:#31584e}.b{stroke:#3c8772;stroke-width:2;rx:10}.a{stroke:#3c8772;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="520" fill="#f7fbf9"/><text x="600" y="38" text-anchor="middle" class="t">TUI 事件循环：输入、Agent 事件与渲染协同</text>
<rect x="50" y="92" width="200" height="112" class="b" fill="#dff2eb"/><text x="150" y="128" text-anchor="middle" class="h">终端输入</text><text x="150" y="155" text-anchor="middle" class="s">键盘 / 粘贴 / 调整窗口</text><text x="150" y="178" text-anchor="middle" class="s">crossterm event stream</text>
<path d="M250 148h75" class="a"/>
<rect x="325" y="92" width="200" height="112" class="b" fill="#fff4d6"/><text x="425" y="128" text-anchor="middle" class="h">App 状态机</text><text x="425" y="155" text-anchor="middle" class="s">ChatWidget / 草稿 / 光标</text><text x="425" y="178" text-anchor="middle" class="s">快捷键和 slash command</text>
<path d="M525 148h75" class="a"/>
<rect x="600" y="92" width="200" height="112" class="b" fill="#e8f4ef"/><text x="700" y="128" text-anchor="middle" class="h">请求路由</text><text x="700" y="155" text-anchor="middle" class="s">启动 turn / 回答审批</text><text x="700" y="178" text-anchor="middle" class="s">连接 App Server / core</text>
<path d="M800 148h75" class="a"/>
<rect x="875" y="92" width="275" height="112" class="b" fill="#ffe6df"/><text x="1012" y="128" text-anchor="middle" class="h">Agent 事件回流</text><text x="1012" y="155" text-anchor="middle" class="s">文本增量、工具调用、审批</text><text x="1012" y="178" text-anchor="middle" class="s">完成、错误和文件变更</text>
<path d="M1012 204v95H425v-95" class="a"/>
<rect x="325" y="300" width="200" height="100" class="b" fill="#e8e5f8"/><text x="425" y="337" text-anchor="middle" class="h">Transcript</text><text x="425" y="364" text-anchor="middle" class="s">消息、Markdown、diff</text>
<path d="M525 350h75" class="a"/>
<rect x="600" y="300" width="200" height="100" class="b" fill="#eef4f3"/><text x="700" y="337" text-anchor="middle" class="h">布局与渲染</text><text x="700" y="364" text-anchor="middle" class="s">ratatui widgets / reflow</text>
<path d="M800 350h75" class="a"/>
<rect x="875" y="300" width="275" height="100" class="b" fill="#eef4f3"/><text x="1012" y="337" text-anchor="middle" class="h">终端输出</text><text x="1012" y="364" text-anchor="middle" class="s">状态栏、提示、审批面板</text>
<text x="600" y="462" text-anchor="middle" class="s">事件循环必须保持输入响应；模型流和工具执行在后台推进，UI 只消费事件并更新可见状态</text>
</svg>
