<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3c8772"/></marker><style>.t{font:700 24px sans-serif;fill:#173b32}.h{font:600 15px sans-serif;fill:#173b32}.s{font:13px sans-serif;fill:#31584e}.b{stroke:#3c8772;stroke-width:2;rx:10}.a{stroke:#3c8772;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="430" fill="#f7fbf9"/><text x="550" y="36" text-anchor="middle" class="t">codex-core Agent 状态循环</text><g transform="translate(45,90)"><rect width="170" height="90" class="b" fill="#dff2eb"/><text x="85" y="36" text-anchor="middle" class="h">准备上下文</text><text x="85" y="62" text-anchor="middle" class="s">规则 / 历史 / 工具</text><path d="M170 45h50" class="a"/><rect x="220" width="170" height="90" class="b" fill="#fff4d6"/><text x="305" y="36" text-anchor="middle" class="h">等待模型</text><text x="305" y="62" text-anchor="middle" class="s">文本或 tool call</text><path d="M390 45h50" class="a"/><rect x="440" width="170" height="90" class="b" fill="#ffe6df"/><text x="525" y="36" text-anchor="middle" class="h">执行与审批</text><text x="525" y="62" text-anchor="middle" class="s">策略 / 沙箱 / 用户</text><path d="M610 45h50" class="a"/><rect x="660" width="170" height="90" class="b" fill="#e8e5f8"/><text x="745" y="36" text-anchor="middle" class="h">回传结果</text><text x="745" y="62" text-anchor="middle" class="s">输出 / diff / 错误</text><path d="M830 45h50" class="a"/><rect x="880" width="130" height="90" class="b" fill="#dff2eb"/><text x="945" y="36" text-anchor="middle" class="h">完成</text><text x="945" y="62" text-anchor="middle" class="s">保存状态</text></g><path d="M745 180v110H305V180" class="a"/><text x="550" y="326" text-anchor="middle" class="s">工具结果会重新进入模型上下文；只有满足完成条件时才结束循环</text></svg>
