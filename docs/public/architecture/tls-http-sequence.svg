<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="t d">
  <title id="t">DNS、TCP、TLS 1.3 与 HTTP 首次请求时序</title><desc id="d">客户端、DNS 与边缘节点之间从域名解析到返回 HTTP 响应的消息时序</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#607d8b"/></marker></defs>
  <rect width="960" height="680" rx="22" fill="#f7faf9"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">首次 HTTPS 请求时序</text>
    <g text-anchor="middle"><rect x="90" y="75" width="180" height="60" rx="12" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="180" y="112" font-size="17" font-weight="700">Client</text><rect x="390" y="75" width="180" height="60" rx="12" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="480" y="112" font-size="17" font-weight="700">DNS</text><rect x="690" y="75" width="180" height="60" rx="12" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="780" y="112" font-size="17" font-weight="700">Edge</text></g>
    <g stroke="#90a4ae" stroke-dasharray="5 5"><path d="M180 135V625"/><path d="M480 135V625"/><path d="M780 135V625"/></g>
    <g stroke="#607d8b" stroke-width="2" fill="none">
      <path d="M180 180H470" marker-end="url(#a)"/><path d="M480 220H190" marker-end="url(#a)"/>
      <path d="M180 285H770" marker-end="url(#a)"/><path d="M780 330H190" marker-end="url(#a)"/>
      <path d="M180 385H770" marker-end="url(#a)"/><path d="M780 430H190" marker-end="url(#a)"/>
      <path d="M180 485H770" marker-end="url(#a)"/><path d="M780 540H190" marker-end="url(#a)"/>
    </g>
    <g font-size="13" fill="#263238"><text x="330" y="172" text-anchor="middle">1. 查询 api.example.com</text><text x="330" y="212" text-anchor="middle">2. 返回边缘 IP</text><text x="480" y="277" text-anchor="middle">3. TCP SYN</text><text x="480" y="322" text-anchor="middle">4. SYN-ACK（TCP 约 1 RTT）</text><text x="480" y="377" text-anchor="middle">5. ACK + TLS ClientHello</text><text x="480" y="422" text-anchor="middle">6. ServerHello + Certificate + Finished</text><text x="480" y="477" text-anchor="middle">7. Client Finished + HTTP Request</text><text x="480" y="532" text-anchor="middle">8. HTTP Response</text></g>
    <rect x="230" y="575" width="500" height="58" rx="11" fill="#fff8e6" stroke="#cc9a2e"/>
    <text x="480" y="599" text-anchor="middle" font-size="13" font-weight="700" fill="#9b7118">连接复用会跳过大部分建连成本</text><text x="480" y="620" text-anchor="middle" font-size="11" fill="#607d8b">TLS 会话恢复、HTTP/2 多路复用和 QUIC 可进一步降低后续请求延迟</text>
  </g>
</svg>
