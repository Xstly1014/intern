<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">事件端到端生命周期</title><desc id="d">业务事务经 Outbox、Relay、Broker、Consumer、Inbox 到业务效果与确认。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="430" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">事件端到端生命周期</text><rect x="30" y="120" width="171" height="120" rx="8" fill="#edf3fa" stroke="#607d8b"/><text x="115.5" y="158" text-anchor="middle" font-size="14" font-weight="700">DB + Outbox</text><rect x="219" y="120" width="171" height="120" rx="8" fill="#e8f5f0" stroke="#607d8b"/><text x="304.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Relay / Confirm</text><rect x="408" y="120" width="171" height="120" rx="8" fill="#fff8e6" stroke="#607d8b"/><text x="493.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Broker / Replica</text><rect x="597" y="120" width="171" height="120" rx="8" fill="#f3eff8" stroke="#607d8b"/><text x="682.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Consumer</text><rect x="786" y="120" width="171" height="120" rx="8" fill="#fbecef" stroke="#607d8b"/><text x="871.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Inbox + Effect</text><rect x="975" y="120" width="171" height="120" rx="8" fill="#fff" stroke="#607d8b"/><text x="1060.5" y="158" text-anchor="middle" font-size="14" font-weight="700">ACK / Offset</text><path d="M201 180H212" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M390 180H401" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M579 180H590" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M768 180H779" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M957 180H968" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="310" width="980" height="62" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="348" text-anchor="middle" font-size="12" font-weight="700">任何确认丢失都可能重复；端到端按至少一次设计</text></g></svg>
