<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">本地事务与事务外工作边界</title><desc id="d">数据库事务原子保存业务数据、幂等、Outbox 和审计，远程调用与发布位于提交之外。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="480" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">本地事务只包含可原子提交的数据库事实</text><rect x="100" y="95" width="980" height="180" rx="12" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="590" y="128" font-size="16" font-weight="700">BEGIN ... COMMIT</text><g><rect x="145" y="160" width="180" height="70" rx="7" fill="#fff" stroke="#607d8b"/><text x="235" y="190" font-size="13" font-weight="700">业务状态</text><text x="235" y="213" font-size="11">聚合 + version</text><rect x="370" y="160" width="180" height="70" rx="7" fill="#fff" stroke="#607d8b"/><text x="460" y="190" font-size="13" font-weight="700">幂等结果</text><text x="460" y="213" font-size="11">key + fingerprint</text><rect x="595" y="160" width="180" height="70" rx="7" fill="#fff" stroke="#607d8b"/><text x="685" y="190" font-size="13" font-weight="700">Outbox</text><text x="685" y="213" font-size="11">event + schema</text><rect x="820" y="160" width="180" height="70" rx="7" fill="#fff" stroke="#607d8b"/><text x="910" y="190" font-size="13" font-weight="700">业务审计事实</text><text x="910" y="213" font-size="11">actor + transition</text></g><rect x="125" y="340" width="250" height="70" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="250" y="372" font-size="13" font-weight="700">远程 HTTP / 支付</text><text x="250" y="395" font-size="11">超时不可控</text><rect x="465" y="340" width="250" height="70" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="590" y="372" font-size="13" font-weight="700">Broker 发布确认</text><text x="590" y="395" font-size="11">由 Relay 重试</text><rect x="805" y="340" width="250" height="70" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="930" y="372" font-size="13" font-weight="700">邮件 / 文件 / 大计算</text><text x="930" y="395" font-size="11">提交后异步执行</text><path d="M590 275V325" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><text x="650" y="307" font-size="11">提交成功后</text></g></svg>
