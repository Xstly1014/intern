<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t d">
  <title id="t">从网络攻击到业务滥用的分层防护体系</title><desc id="d">展示不同攻击层级和对应的 Anti-DDoS、边缘代理、WAF、Bot 风控与业务规则</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78909c"/></marker><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter></defs>
  <rect width="1000" height="720" rx="22" fill="#f7faf9"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">入口攻击面与分层防护</text>
    <text x="500" y="68" text-anchor="middle" font-size="12" fill="#607d8b">越廉价、越确定的恶意流量越靠外阻断；越依赖业务上下文的判断越靠近业务</text>
    <g filter="url(#s)">
      <g transform="translate(70 100)"><rect width="860" height="90" rx="14" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><rect width="240" height="90" rx="14" fill="#b44c5b"/><text x="120" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">L3 / L4 网络攻击</text><text x="120" y="62" text-anchor="middle" font-size="12" fill="#fff">Flood · SYN · 反射放大</text><text x="275" y="38" font-size="16" font-weight="700" fill="#913744">Anti-DDoS · Anycast · 清洗中心</text><text x="275" y="65" font-size="12" fill="#607d8b">在带宽和连接状态被耗尽之前丢弃攻击流量</text></g>
      <g transform="translate(70 210)"><rect width="860" height="90" rx="14" fill="#fff4e8" stroke="#c07a3d" stroke-width="2"/><rect width="240" height="90" rx="14" fill="#c07a3d"/><text x="120" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">TLS / 连接攻击</text><text x="120" y="62" text-anchor="middle" font-size="12" fill="#fff">握手洪泛 · 慢连接</text><text x="275" y="38" font-size="16" font-weight="700" fill="#8c5a2d">边缘代理 · 握手与连接限制</text><text x="275" y="65" font-size="12" fill="#607d8b">会话复用 · Header/Body 超时 · 并发上限</text></g>
      <g transform="translate(70 320)"><rect width="860" height="90" rx="14" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><rect width="240" height="90" rx="14" fill="#cc9a2e"/><text x="120" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">HTTP 请求攻击</text><text x="120" y="62" text-anchor="middle" font-size="12" fill="#fff">大 Body · 洪泛 · 恶意路径</text><text x="275" y="38" font-size="16" font-weight="700" fill="#9b7118">CDN · WAF · Rate Limit</text><text x="275" y="65" font-size="12" fill="#607d8b">请求规范化 · Schema · 大小与速率控制</text></g>
      <g transform="translate(70 430)"><rect width="860" height="90" rx="14" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><rect width="240" height="90" rx="14" fill="#8b6fb3"/><text x="120" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">应用漏洞攻击</text><text x="120" y="62" text-anchor="middle" font-size="12" fill="#fff">SQLi · XSS · SSRF · 穿越</text><text x="275" y="38" font-size="16" font-weight="700" fill="#6c528f">WAF + 安全编码 + 服务端校验</text><text x="275" y="65" font-size="12" fill="#607d8b">虚拟补丁只是补充，最终正确性仍由应用保证</text></g>
      <g transform="translate(70 540)"><rect width="860" height="100" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><rect width="240" height="100" rx="14" fill="#3c8772"/><text x="120" y="39" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">业务自动化滥用</text><text x="120" y="67" text-anchor="middle" font-size="12" fill="#fff">撞库 · 刷短信 · 抢券 · 爬虫</text><text x="275" y="41" font-size="16" font-weight="700" fill="#2d6b59">Bot 识别 · 风控评分 · 业务规则</text><text x="275" y="69" font-size="12" fill="#607d8b">组合 IP、账号、设备、行为和业务结果进行决策</text></g>
    </g>
    <path d="M950 140V590" stroke="#78909c" stroke-width="2" marker-end="url(#a)"/>
    <text x="964" y="365" font-size="11" fill="#607d8b" transform="rotate(90 964 365)">需要的业务上下文逐层增加</text>
    <text x="500" y="681" text-anchor="middle" font-size="12" fill="#607d8b">任何单一设备都不能覆盖全部攻击面，且每层都必须定义误报、回滚和 Fail-open / Fail-closed 策略</text>
  </g>
</svg>
