<g aria-label="治理与反馈"><rect x="505" y="350" width="430" height="78" rx="8" fill="#fff0ef" stroke="#b94b45" stroke-width="2"/><text x="720" y="378" class="node-title" text-anchor="middle">治理与反馈</text><text x="720" y="402" class="node-sub" text-anchor="middle">Metrics · Logs · Traces · SLO 门禁 · 审计 · 成本 · 漏洞</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 基础设施与交付层</text>
