<g aria-label="交付控制面"><rect x="25" y="55" width="210" height="150" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="130" y="83" class="node-title" text-anchor="middle">交付控制面</text><text x="130" y="107" class="node-sub" text-anchor="middle">Git / PR</text><text x="130" y="126" class="node-sub" text-anchor="middle">隔离 CI Runner</text><text x="130" y="145" class="node-sub" text-anchor="middle">测试 · 扫描 · 签名</text><text x="130" y="164" class="node-sub" text-anchor="middle">GitOps / CD</text></g>
<g aria-label="制品与配置面"><rect x="270" y="55" width="200" height="150" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="370" y="83" class="node-title" text-anchor="middle">制品与配置面</text><text x="370" y="107" class="node-sub" text-anchor="middle">Immutable Registry</text><text x="370" y="126" class="node-sub" text-anchor="middle">SBOM / Provenance</text><text x="370" y="145" class="node-sub" text-anchor="middle">Config Repository</text><text x="370" y="164" class="node-sub" text-anchor="middle">Secret Manager</text></g>
<g aria-label="Kubernetes 运行面"><rect x="505" y="55" width="430" height="260" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="720" y="83" class="node-title" text-anchor="middle">Kubernetes 运行面</text><text x="720" y="107" class="node-sub" text-anchor="middle">Ingress / Gateway · NetworkPolicy · Workload Identity</text></g>
<g aria-label="AZ 1"><rect x="535" y="125" width="170" height="135" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="620" y="153" class="node-title" text-anchor="middle">AZ 1</text><text x="620" y="177" class="node-sub" text-anchor="middle">Java Pod × N</text><text x="620" y="196" class="node-sub" text-anchor="middle">requests/limits</text><text x="620" y="215" class="node-sub" text-anchor="middle">PDB · readiness</text></g>
<g aria-label="AZ 2"><rect x="735" y="125" width="170" height="135" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="820" y="153" class="node-title" text-anchor="middle">AZ 2</text><text x="820" y="177" class="node-sub" text-anchor="middle">Java Pod × N</text><text x="820" y="196" class="node-sub" text-anchor="middle">Topology Spread</text><text x="820" y="215" class="node-sub" text-anchor="middle">HPA · graceful stop</text></g>
