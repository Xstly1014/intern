<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">写后读一致性策略</title><desc id="d">写响应携带版本或复制位点，后续读取可读主、粘主、等待副本追平或显示处理中。</desc><rect width="1180" height="480" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">写后读策略由业务新鲜度决定</text><rect x="380" y="85" width="420" height="90" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="590" y="120" font-size="15" font-weight="700">写主成功 → 返回 resourceVersion / LSN 842</text><text x="590" y="148" font-size="11">客户端紧接 GET</text><g><rect x="30" y="280" width="250" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="155" y="315" font-size="14" font-weight="700">关键决策：读主</text><text x="155" y="345" font-size="11">最强、增加主库负载</text><rect x="320" y="280" width="250" height="105" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="445" y="315" font-size="14" font-weight="700">会话粘主</text><text x="445" y="345" font-size="11">短窗口内同用户读主</text><rect x="610" y="280" width="250" height="105" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="735" y="315" font-size="14" font-weight="700">等待位点 / 版本</text><text x="735" y="345" font-size="11">副本 ≥ 842 后读取</text><rect x="900" y="280" width="250" height="105" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1025" y="315" font-size="14" font-weight="700">异步 UX</text><text x="1025" y="345" font-size="11">显示处理中，事件更新</text></g><g stroke="#607d8b" stroke-width="2"><path d="M470 175L155 273"/><path d="M550 175L445 273"/><path d="M630 175L735 273"/><path d="M710 175L1025 273"/></g><text x="590" y="438" font-size="12" font-weight="700">不能把所有 GET 自动路由副本；同一 API 的不同用例可能有不同一致性需求</text></g></svg>
