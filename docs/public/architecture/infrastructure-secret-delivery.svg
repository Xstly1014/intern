<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Workload Identity 获取短期 Secret</title>
<desc id="desc">展示 Pod 使用工作负载身份向令牌服务换取短期凭证，再按策略从密钥系统获取秘密并进行轮换。</desc>
<defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.heading{font-size:25px;font-weight:700;fill:#1f2d33}.caption{font-size:14px;fill:#607078}.node-title{font-size:16px;font-weight:700;fill:#1f2d33}.node-sub{font-size:13px;fill:#45565e}.edge{fill:none;stroke:#607078;stroke-width:2}.note{font-size:12px;fill:#6a777d}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607078"/></marker>
</defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="38" class="heading">Workload Identity 获取短期 Secret</text>
<text x="30" y="63" class="caption">展示 Pod 使用工作负载身份向令牌服务换取短期凭证，再按策略从密钥系统获取秘密并进行轮换。</text>
<path d="M 190 165 L 225 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 380 165 L 415 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 570 165 L 605 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 760 165 L 795 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 675 210 L 675 310" class="edge" marker-end="url(#arrow)"/>
<path d="M 300 310 L 115 210" class="edge" marker-end="url(#arrow)"/>
<g aria-label="Java Pod"><rect x="35" y="120" width="155" height="90" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="112.5" y="148" class="node-title" text-anchor="middle">Java Pod</text><text x="112.5" y="172" class="node-sub" text-anchor="middle">ServiceAccount</text><text x="112.5" y="191" class="node-sub" text-anchor="middle">无长期云密钥</text></g>
<g aria-label="身份令牌"><rect x="225" y="120" width="155" height="90" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="302.5" y="148" class="node-title" text-anchor="middle">身份令牌</text><text x="302.5" y="172" class="node-sub" text-anchor="middle">受众 · Namespace</text><text x="302.5" y="191" class="node-sub" text-anchor="middle">短有效期</text></g>
<g aria-label="STS / IAM"><rect x="415" y="120" width="155" height="90" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="492.5" y="148" class="node-title" text-anchor="middle">STS / IAM</text><text x="492.5" y="172" class="node-sub" text-anchor="middle">验证集群签名</text><text x="492.5" y="191" class="node-sub" text-anchor="middle">映射工作负载角色</text></g>
<g aria-label="Secret Manager"><rect x="605" y="120" width="155" height="90" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="682.5" y="148" class="node-title" text-anchor="middle">Secret Manager</text><text x="682.5" y="172" class="node-sub" text-anchor="middle">按策略授权</text><text x="682.5" y="191" class="node-sub" text-anchor="middle">审计每次读取</text></g>
<g aria-label="目标依赖"><rect x="795" y="120" width="130" height="90" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="860" y="148" class="node-title" text-anchor="middle">目标依赖</text><text x="860" y="172" class="node-sub" text-anchor="middle">DB / MQ / API</text><text x="860" y="191" class="node-sub" text-anchor="middle">短期凭证</text></g>
<g aria-label="轮换与失效"><rect x="225" y="310" width="535" height="78" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="492.5" y="338" class="node-title" text-anchor="middle">轮换与失效</text><text x="492.5" y="362" class="node-sub" text-anchor="middle">应用支持热加载或双凭证窗口；泄漏后撤销身份/策略而非重建镜像</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 基础设施与交付层</text>
</svg>
