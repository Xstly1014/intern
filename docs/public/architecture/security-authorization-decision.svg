<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="t d"><title id="t">授权 PDP PEP 与资源事实协作</title><desc id="d">执行点收集主体、动作和资源，策略决策点结合属性与策略版本作出允许、拒绝或附带义务的决策。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="560" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">授权是 subject × action × resource × context 的决策</text><g text-anchor="middle"><rect x="40" y="100" width="230" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="155" y="135" font-size="15" font-weight="700">PEP 执行点</text><text x="155" y="163" font-size="12">Controller / Use Case / Query</text><text x="155" y="188" font-size="11">收集动作、资源、tenant</text><rect x="390" y="85" width="300" height="155" rx="9" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="540" y="122" font-size="17" font-weight="700">PDP 策略决策点</text><text x="540" y="153" font-size="12">RBAC + ABAC + ReBAC / ACL</text><text x="540" y="180" font-size="12">策略版本 · 默认拒绝 · 可解释原因</text><text x="540" y="207" font-size="11">allow / deny + obligations</text><rect x="810" y="80" width="320" height="165" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="970" y="117" font-size="16" font-weight="700">PIP 可信属性</text><text x="970" y="147" font-size="12">主体：角色 / 认证强度 / 风险</text><text x="970" y="174" font-size="12">资源：owner / 状态 / 组织关系</text><text x="970" y="201" font-size="12">环境：时间 / 地域 / 设备</text><text x="970" y="225" font-size="11">定义来源、新鲜度与缺失语义</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M270 155H383"/><path d="M810 155H697"/></g><rect x="170" y="320" width="840" height="125" rx="9" fill="#fff" stroke="#a5b8b2"/><text x="590" y="352" text-anchor="middle" font-size="15" font-weight="700">PEP 执行决策与义务</text><text x="590" y="383" text-anchor="middle" font-size="12">允许 · 拒绝/隐藏资源存在性 · 字段遮蔽 · 数量限制 · Step-up · 水印 · 强审计</text><text x="590" y="415" text-anchor="middle" font-size="11" fill="#9a3345">未知义务、属性缺失、策略超时或版本冲突不能静默放行</text><path d="M540 240V313" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><text x="590" y="505" text-anchor="middle" font-size="12" font-weight="700">最终对象授权靠资源服务的最新事实；前端隐藏按钮和网关 Scope 只能提前拒绝</text></g></svg>
