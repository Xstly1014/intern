<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" role="img" aria-labelledby="t d"><title id="t">身份与安全层纵深防御边界</title><desc id="d">安全控制从客户端、边缘、网关、BFF、业务服务延伸到数据平台，每层根据自己掌握的事实执行不同控制。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="540" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">纵深防御：每层控制不同风险</text><g text-anchor="middle"><rect x="25" y="100" width="160" height="125" rx="8" fill="#fff" stroke="#607d8b"/><text x="105" y="134" font-size="15" font-weight="700">客户端</text><text x="105" y="162" font-size="11">PKCE · 安全存储</text><text x="105" y="185" font-size="11">输入最少化</text><rect x="215" y="100" width="160" height="125" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="295" y="134" font-size="15" font-weight="700">边缘 / WAF</text><text x="295" y="162" font-size="11">DDoS · Bot · TLS</text><text x="295" y="185" font-size="11">攻击流量缓冲</text><rect x="405" y="100" width="160" height="125" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="485" y="134" font-size="15" font-weight="700">API 网关</text><text x="485" y="162" font-size="11">Token 初检 · Scope</text><text x="485" y="185" font-size="11">消费者配额</text><rect x="595" y="100" width="160" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="675" y="134" font-size="15" font-weight="700">BFF</text><text x="675" y="162" font-size="11">会话 · CSRF · 上下文</text><text x="675" y="185" font-size="11">展示裁剪</text><rect x="785" y="100" width="160" height="125" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="865" y="134" font-size="15" font-weight="700">业务服务</text><text x="865" y="162" font-size="11">对象授权 · 不变量</text><text x="865" y="185" font-size="11">业务审计</text><rect x="975" y="100" width="160" height="125" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1055" y="134" font-size="15" font-weight="700">数据 / 平台</text><text x="1055" y="162" font-size="11">隔离 · 加密 · 密钥</text><text x="1055" y="185" font-size="11">备份 · 制品</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M185 162H208"/><path d="M375 162H398"/><path d="M565 162H588"/><path d="M755 162H778"/><path d="M945 162H968"/></g><rect x="70" y="290" width="1040" height="155" rx="9" fill="#fff" stroke="#a5b8b2"/><text x="590" y="325" text-anchor="middle" font-size="16" font-weight="700">贯穿所有边界的控制面</text><text x="590" y="360" text-anchor="middle" font-size="13">用户与工作负载身份 · 授权策略 · tenant 上下文 · KMS / Secret · 审计与检测</text><text x="590" y="394" text-anchor="middle" font-size="13">安全开发生命周期 · SBOM / 制品签名 · 漏洞响应 · 事件恢复</text><text x="590" y="425" text-anchor="middle" font-size="11" fill="#9a3345">任何单层被绕过，都不应直接获得跨资源、跨租户或平台级权限</text><text x="590" y="493" text-anchor="middle" font-size="12" font-weight="700">网络位置不是身份 · 登录成功不是授权 · 加密传输不等于数据用途合法</text></g></svg>
