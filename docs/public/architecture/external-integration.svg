<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d"><title id="t">外部支付集成防腐层与回调链路</title><desc id="d">业务服务通过内部端口和供应商适配器调用第三方，回调经过验签、防重放和 Inbox</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1000" height="590" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="500" y="42" font-size="23" font-weight="700" fill="#17342c">外部系统通过防腐层隔离</text><g><rect x="55" y="110" width="180" height="76" rx="12" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="145" y="155" font-size="16" font-weight="700">支付业务服务</text><rect x="300" y="95" width="190" height="106" rx="13" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="395" y="132" font-size="16" font-weight="700">PaymentGateway</text><text x="395" y="158" font-size="11" fill="#607d8b">内部稳定端口</text><rect x="555" y="80" width="210" height="136" rx="13" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="660" y="115" font-size="16" font-weight="700">供应商 Adapter</text><text x="660" y="145" font-size="11" fill="#607d8b">模型转换 · 签名 · 超时</text><text x="660" y="168" font-size="11" fill="#607d8b">限流 · 错误分类 · 幂等</text><rect x="830" y="110" width="135" height="76" rx="12" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="897" y="140" font-size="15" font-weight="700">第三方 API</text><text x="897" y="163" font-size="10" fill="#607d8b">微信 / Stripe</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M235 148H294"/><path d="M490 148H549"/><path d="M765 148H824"/></g><rect x="80" y="315" width="840" height="200" rx="15" fill="#fff" stroke="#3c8772" stroke-width="2"/><text x="500" y="347" font-size="17" font-weight="700">第三方回调入口</text><g><rect x="110" y="380" width="135" height="66" rx="10" fill="#fff8e6" stroke="#cc9a2e"/><text x="177" y="419" font-size="13">第三方回调</text><rect x="280" y="380" width="135" height="66" rx="10" fill="#f3eff8" stroke="#8b6fb3"/><text x="347" y="407" font-size="13">验签</text><text x="347" y="427" font-size="10" fill="#607d8b">时间戳 / nonce</text><rect x="450" y="380" width="135" height="66" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="517" y="407" font-size="13">Inbox</text><text x="517" y="427" font-size="10" fill="#607d8b">快速持久化</text><rect x="620" y="380" width="135" height="66" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="687" y="407" font-size="13">幂等消费</text><text x="687" y="427" font-size="10" fill="#607d8b">乱序 / 重试</text><rect x="790" y="380" width="100" height="66" rx="10" fill="#fbecef" stroke="#b44c5b"/><text x="840" y="419" font-size="13">业务处理</text></g><g stroke="#607d8b" marker-end="url(#a)"><path d="M245 413H274"/><path d="M415 413H444"/><path d="M585 413H614"/><path d="M755 413H784"/></g></g></svg>
