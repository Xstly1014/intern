<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" role="img" aria-labelledby="title desc">
  <title id="title">完整系统运行时架构全景图</title>
  <desc id="desc">从用户终端、边缘、网关、接入、业务服务到数据、中间件、外部集成以及横切平台能力的系统全景图</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17342c" flood-opacity=".12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78909c"/></marker>
  </defs>
  <rect width="1080" height="980" rx="24" fill="#f7faf9"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <text x="540" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#17342c">完整系统运行时架构全景</text>
    <text x="540" y="70" text-anchor="middle" font-size="13" fill="#607d8b">请求链路、数据链路与平台能力共同组成可运行的生产系统</text>

    <g filter="url(#s)">
      <rect x="110" y="94" width="860" height="72" rx="14" fill="#fff" stroke="#90a4ae" stroke-width="2"/>
      <text x="190" y="124" font-size="17" font-weight="700" fill="#263238">用户与终端</text>
      <text x="190" y="148" font-size="13" fill="#607d8b">Web · App · 小程序 · 第三方系统 · 内部运营台</text>
      <g transform="translate(790 112)" fill="#e8f5f0" stroke="#3c8772"><circle cx="20" cy="18" r="18"/><circle cx="68" cy="18" r="18"/><circle cx="116" cy="18" r="18"/></g>

      <rect x="110" y="206" width="860" height="86" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/>
      <text x="190" y="239" font-size="18" font-weight="700" fill="#2d6b59">客户端与边缘入口</text>
      <text x="190" y="266" font-size="13" fill="#3c8772">DNS / GSLB · CDN · Anti-DDoS · WAF / Bot · L4/L7 负载均衡 · TLS</text>

      <rect x="110" y="332" width="860" height="86" rx="14" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/>
      <text x="190" y="365" font-size="18" font-weight="700" fill="#365f8d">API 网关层</text>
      <text x="190" y="392" font-size="13" fill="#4f7cac">路由 · 限流 · Token 初检 · 灰度 · 协议转换 · 请求上下文</text>

      <rect x="110" y="458" width="860" height="86" rx="14" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/>
      <text x="190" y="491" font-size="18" font-weight="700" fill="#6c528f">接入层 / BFF</text>
      <text x="190" y="518" font-size="13" fill="#8b6fb3">参数校验 · DTO 转换 · 终端适配 · 接口聚合 · 用例编排</text>

      <rect x="110" y="584" width="860" height="96" rx="14" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/>
      <text x="190" y="617" font-size="18" font-weight="700" fill="#913744">业务服务层</text>
      <text x="190" y="646" font-size="13" fill="#b44c5b">订单 · 商品 · 库存 · 营销 · 支付 · 用户 · 履约 · 风控</text>
      <text x="834" y="634" text-anchor="middle" font-size="12" fill="#607d8b">领域规则与状态</text>

      <rect x="70" y="748" width="286" height="106" rx="14" fill="#e9f7f4" stroke="#358f80" stroke-width="2"/>
      <text x="213" y="781" text-anchor="middle" font-size="17" font-weight="700" fill="#27766a">数据与存储</text>
      <text x="213" y="809" text-anchor="middle" font-size="12" fill="#358f80">MySQL · Redis · 搜索</text>
      <text x="213" y="831" text-anchor="middle" font-size="12" fill="#358f80">对象存储 · 数仓</text>

      <rect x="397" y="748" width="286" height="106" rx="14" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/>
      <text x="540" y="781" text-anchor="middle" font-size="17" font-weight="700" fill="#9b7118">异步与中间件</text>
      <text x="540" y="809" text-anchor="middle" font-size="12" fill="#a77b20">Kafka · RabbitMQ · RocketMQ</text>
      <text x="540" y="831" text-anchor="middle" font-size="12" fill="#a77b20">调度 · 配置 · 注册发现</text>

      <rect x="724" y="748" width="286" height="106" rx="14" fill="#f3f0ed" stroke="#7c6f64" stroke-width="2"/>
      <text x="867" y="781" text-anchor="middle" font-size="17" font-weight="700" fill="#62564c">外部集成</text>
      <text x="867" y="809" text-anchor="middle" font-size="12" fill="#7c6f64">支付 · 短信 · 地图 · ERP</text>
      <text x="867" y="831" text-anchor="middle" font-size="12" fill="#7c6f64">防腐层 · 回调入口 · 对账</text>

      <rect x="70" y="890" width="940" height="62" rx="12" fill="#eef1f3" stroke="#59636e" stroke-width="2"/>
      <text x="100" y="916" font-size="14" font-weight="700" fill="#37424c">横切与运行底座</text>
      <text x="100" y="938" font-size="12" fill="#59636e">身份安全 · 日志 · 指标 · Trace · 告警 · Kubernetes · CI/CD · 发布 · 备份 · 容灾 · 成本</text>
    </g>

    <g stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M540 166V200"/><path d="M540 292V326"/><path d="M540 418V452"/><path d="M540 544V578"/>
      <path d="M540 680V714H213V742"/><path d="M540 680V742"/><path d="M540 714H867V742"/>
    </g>
    <g font-size="11" fill="#607d8b">
      <text x="553" y="188">HTTPS / WebSocket / gRPC</text>
      <text x="553" y="316">清洗后的可信入口流量</text>
      <text x="553" y="442">统一请求上下文</text>
      <text x="553" y="568">业务命令与查询</text>
      <text x="224" y="728">同步读写</text><text x="550" y="728">领域事件</text><text x="877" y="728">外部调用</text>
    </g>
  </g>
</svg>
