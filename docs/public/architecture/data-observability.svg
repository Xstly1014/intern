<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 510" role="img" aria-labelledby="t d"><title id="t">从连接池到存储引擎的数据观测链</title><desc id="d">以同一用例和查询指纹关联连接池等待、SQL 执行、数据库资源、复制延迟与派生存储新鲜度。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="510" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">从用户用例追到连接、计划、锁、IO 与副本</text><g><rect x="35" y="105" width="190" height="125" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="130" y="140" font-size="15" font-weight="700">应用 / 用例</text><text x="130" y="170" font-size="11">query ID · transaction</text><text x="130" y="195" font-size="11">rows / bytes / conflict</text><rect x="285" y="105" width="190" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="380" y="140" font-size="15" font-weight="700">连接池</text><text x="380" y="170" font-size="11">active / pending</text><text x="380" y="195" font-size="11">acquire / usage time</text><rect x="535" y="90" width="250" height="155" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="660" y="125" font-size="15" font-weight="700">数据库引擎</text><text x="660" y="155" font-size="11">plan / scan / lock / deadlock</text><text x="660" y="180" font-size="11">CPU / IO / cache / temp</text><text x="660" y="205" font-size="11">oldest tx / WAL / disk</text><rect x="845" y="105" width="290" height="125" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="990" y="140" font-size="15" font-weight="700">副本 / 派生系统</text><text x="990" y="170" font-size="11">replication lag / watermark</text><text x="990" y="195" font-size="11">cache age / search failure</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M225 167H278"/><path d="M475 167H528"/><path d="M785 167H838"/></g><rect x="120" y="315" width="940" height="90" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="345" font-size="13" font-weight="700">关联维度：service · use case · normalized query ID · datasource role · release</text><text x="590" y="372" font-size="11">用户 ID、完整 SQL 参数和敏感数据不做指标标签；受控放日志/Trace</text><text x="590" y="390" font-size="11" fill="#9a3345">HTTP 快但投影陈旧、SQL 快但池等待长，都不是完整成功</text><text x="590" y="465" font-size="12" font-weight="700">备份年龄与最近一次成功恢复的实际 RPO/RTO 同样属于生产观测</text></g></svg>
