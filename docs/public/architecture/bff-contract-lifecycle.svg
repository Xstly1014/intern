<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="t d"><title id="t">API 契约生命周期</title><desc id="d">展示 API 契约从用户意图、Schema 设计、兼容检查、消费者测试到发布观测和废弃淘汰的生命周期</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1160" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">API 契约是可独立发布的制品</text><g text-anchor="middle"><rect x="40" y="100" width="140" height="95" rx="8" fill="#fff" stroke="#607d8b"/><text x="110" y="134" font-size="14" font-weight="700">用户意图</text><text x="110" y="160" font-size="11">不从表结构倒推</text><rect x="215" y="100" width="150" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="290" y="134" font-size="14" font-weight="700">Schema 设计</text><text x="290" y="160" font-size="11">成功 / 错误 / Header</text><rect x="400" y="100" width="150" height="95" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="475" y="134" font-size="14" font-weight="700">CI 契约门禁</text><text x="475" y="160" font-size="11">lint / diff / 安全</text><rect x="585" y="100" width="150" height="95" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="660" y="134" font-size="14" font-weight="700">消费者测试</text><text x="660" y="160" font-size="11">老 SDK / mock / 反例</text><rect x="770" y="100" width="150" height="95" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="845" y="134" font-size="14" font-weight="700">发布与观测</text><text x="845" y="160" font-size="11">API / App 版本分布</text><rect x="955" y="100" width="165" height="95" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1037" y="134" font-size="14" font-weight="700">废弃与淘汰</text><text x="1037" y="160" font-size="11">通知 / 迁移 / 无流量</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M180 147H210"/><path d="M365 147H395"/><path d="M550 147H580"/><path d="M735 147H765"/><path d="M920 147H950"/></g><rect x="100" y="270" width="960" height="140" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="580" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#355c51">兼容性不只是 Schema diff</text><g fill="#455a64" font-size="12"><text x="140" y="340">• 新增枚举值：老客户端可无 fallback</text><text x="140" y="368">• 改默认值/排序/错误码：结构未变但语义破坏</text><text x="610" y="340">• 新增必填请求字段：旧客户端无法传递</text><text x="610" y="368">• 收紧校验：已在使用的合法输入可变非法</text></g></g></svg>
