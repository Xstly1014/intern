<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">API 网关控制面与数据面</title><desc id="d">管理者通过控制面发布配置，数据面使用最后有效配置处理请求并转发服务</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1000" height="520" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="500" y="42" font-size="23" font-weight="700" fill="#17342c">网关控制面与数据面分离</text><rect x="55" y="115" width="170" height="70" rx="12" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="140" y="157" font-size="16" font-weight="700">平台管理员</text><rect x="350" y="85" width="300" height="130" rx="15" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="500" y="124" font-size="18" font-weight="700">控制面</text><text x="500" y="154" font-size="12" fill="#607d8b">路由 · 证书 · 策略 · 插件 · 发布</text><text x="500" y="178" font-size="11" fill="#607d8b">校验 · 版本 · 灰度 · 回滚</text><rect x="300" y="310" width="400" height="130" rx="15" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="500" y="348" font-size="18" font-weight="700">数据面</text><text x="500" y="378" font-size="12" fill="#607d8b">匹配 → 过滤 → 限流 → 转发 → 指标</text><text x="500" y="403" font-size="11" fill="#607d8b">控制面故障时继续使用最后有效配置</text><rect x="45" y="340" width="160" height="70" rx="12" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="125" y="382" font-size="16" font-weight="700">客户端请求</text><rect x="795" y="340" width="160" height="70" rx="12" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="875" y="382" font-size="16" font-weight="700">后端服务</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M225 150H344"/><path d="M500 215V304"/><path d="M205 375H294"/><path d="M700 375H789"/></g><text x="525" y="268" font-size="11" fill="#607d8b">版本化配置分发</text></g></svg>
