<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">BFF 请求上下文的建立与传播</title><desc id="desc">展示外部凭证经过网关验证后形成可信身份，再由 BFF 建立强类型请求上下文并显式传播给并行下游，同时区分展示裁剪与资源级授权。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs>
  <rect width="1180" height="600" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c">
    <text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">身份只信任一次，上下文沿调用链显式传播</text>
    <g text-anchor="middle"><rect x="35" y="92" width="180" height="112" rx="8" fill="#fff" stroke="#607d8b"/><text x="125" y="126" font-size="15" font-weight="700">外部请求</text><text x="125" y="153" font-size="12">Cookie / OAuth Token</text><text x="125" y="177" font-size="12">可伪造 Header</text>
    <rect x="265" y="92" width="200" height="112" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="365" y="126" font-size="15" font-weight="700">API 网关信任边界</text><text x="365" y="153" font-size="12">验证凭证 · 删除外部身份头</text><text x="365" y="177" font-size="12">签发内部声明 / mTLS</text>
    <rect x="515" y="82" width="245" height="132" rx="8" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="638" y="116" font-size="16" font-weight="700">BFF RequestContext</text><text x="638" y="143" font-size="12">subject · actor · tenant · scopes</text><text x="638" y="166" font-size="12">trace · request ID · deadline</text><text x="638" y="189" font-size="12">channel · locale · app version</text>
    <rect x="810" y="92" width="190" height="112" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="905" y="126" font-size="15" font-weight="700">用例参数</text><text x="905" y="153" font-size="12">显式主体与租户</text><text x="905" y="177" font-size="12">不从 Body 决定所有者</text></g>
    <g stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"><path d="M215 148H258"/><path d="M465 148H508"/><path d="M760 148H803"/></g>
    <rect x="70" y="270" width="1040" height="255" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="590" y="303" text-anchor="middle" font-size="16" font-weight="700">异步与并行传播：每个分支获得同一请求事实，不共享可变状态</text>
    <g text-anchor="middle"><rect x="100" y="342" width="205" height="115" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="203" y="376" font-size="14" font-weight="700">传播载体</text><text x="203" y="402" font-size="12">MVC 参数 / Reactor Context</text><text x="203" y="426" font-size="12">受控 executor / 虚拟线程</text>
    <rect x="365" y="332" width="205" height="135" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="468" y="367" font-size="14" font-weight="700">查询分支 A</text><text x="468" y="393" font-size="12">传播 trace + deadline</text><text x="468" y="417" font-size="12">最小身份声明</text><text x="468" y="441" font-size="12">资源服务最终授权</text>
    <rect x="625" y="332" width="205" height="135" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="728" y="367" font-size="14" font-weight="700">查询分支 B</text><text x="728" y="393" font-size="12">传播 trace + deadline</text><text x="728" y="417" font-size="12">actor 与 subject 并存</text><text x="728" y="441" font-size="12">资源服务最终授权</text>
    <rect x="890" y="342" width="190" height="115" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="985" y="376" font-size="14" font-weight="700">禁止隐式假设</text><text x="985" y="402" font-size="12">MDC 自动跨线程</text><text x="985" y="426" font-size="12">BFF 裁剪等于授权</text></g>
    <g stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"><path d="M305 399H358"/><path d="M305 420C335 490 600 505 695 472"/><path d="M570 399H618"/><path d="M830 399H883"/></g>
    <text x="590" y="566" text-anchor="middle" font-size="12" font-weight="700" fill="#455a64">缓存与 DataLoader Key 必须包含租户及权限变体 · BFF 不可被绕过直连 · 下游只接收完成任务所需的最小声明</text>
  </g>
</svg>
