<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 450" role="img" aria-labelledby="t d"><title id="t">WAF 规则生命周期</title><desc id="d">从威胁需求、规则编写、离线回放、观察模式、灰度阻断、扩大范围、监控到到期复审</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1060" height="450" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="530" y="42" font-size="23" font-weight="700" fill="#17342c">WAF 规则先观察、再阻断、持续复审</text><g font-size="13"><g transform="translate(45 110)"><circle cx="60" cy="60" r="58" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="60" y="55">需求 / 威胁</text><text x="60" y="76" font-size="10" fill="#607d8b">定义范围</text></g><g transform="translate(190 110)"><circle cx="60" cy="60" r="58" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="60" y="55">编写规则</text><text x="60" y="76" font-size="10" fill="#607d8b">负责人 / 到期</text></g><g transform="translate(335 110)"><circle cx="60" cy="60" r="58" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="60" y="55">离线回放</text><text x="60" y="76" font-size="10" fill="#607d8b">历史流量测试</text></g><g transform="translate(480 110)"><circle cx="60" cy="60" r="58" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="60" y="55">Count / Log</text><text x="60" y="76" font-size="10" fill="#607d8b">只观察</text></g><g transform="translate(625 110)"><circle cx="60" cy="60" r="58" fill="#fff4e8" stroke="#c07a3d" stroke-width="2"/><text x="60" y="55">小流量阻断</text><text x="60" y="76" font-size="10" fill="#607d8b">检查误报</text></g><g transform="translate(770 110)"><circle cx="60" cy="60" r="58" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="60" y="55">扩大范围</text><text x="60" y="76" font-size="10" fill="#607d8b">分批启用</text></g><g transform="translate(915 110)"><circle cx="60" cy="60" r="58" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="60" y="50">持续监控</text><text x="60" y="71">到期复审</text></g></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M165 170H184"/><path d="M310 170H329"/><path d="M455 170H474"/><path d="M600 170H619"/><path d="M745 170H764"/><path d="M890 170H909"/></g><path d="M975 228V315H105V234" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><text x="540" y="340" font-size="12" fill="#607d8b">复审后删除、调整或进入下一轮；紧急白名单同样必须限定范围并设置到期时间</text><text x="530" y="400" font-size="12" fill="#913744">误报止损优先缩小具体规则，不创建无边界、无到期的全站 Allow</text></g></svg>
