<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc"><title id="title">API 网关超时、重试与取消关系</title><desc id="desc">展示客户端总超时、网关 deadline、排队、两次上游尝试和剩余预算之间的关系，以及超时不代表业务已取消</desc>
  <rect width="1160" height="610" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">重试必须共享一个总 deadline</text>
  <line x1="100" y1="150" x2="1060" y2="150" stroke="#607d8b" stroke-width="3"/><g fill="#607d8b"><circle cx="100" cy="150" r="7"/><circle cx="1060" cy="150" r="7"/></g><text x="100" y="125" text-anchor="middle" font-size="12">网关接收</text><text x="1060" y="125" text-anchor="middle" font-size="12">deadline</text>
  <g text-anchor="middle"><rect x="100" y="190" width="90" height="90" rx="7" fill="#edf3fa" stroke="#4f7cac"/><text x="145" y="225" font-size="14" font-weight="700">本地</text><text x="145" y="249" font-size="11">路由/鉴权</text><text x="145" y="268" font-size="11">20 ms</text>
  <rect x="200" y="190" width="100" height="90" rx="7" fill="#fff8e6" stroke="#c69a32"/><text x="250" y="225" font-size="14" font-weight="700">排队</text><text x="250" y="249" font-size="11">等连接</text><text x="250" y="268" font-size="11">最多 30 ms</text>
  <rect x="310" y="190" width="280" height="90" rx="7" fill="#fbecef" stroke="#b44c5b"/><text x="450" y="220" font-size="14" font-weight="700">尝试 1</text><text x="450" y="244" font-size="11">connect + response，最多 350 ms</text><text x="450" y="266" font-size="11">连接瞬时失败 / 可安全重放</text>
  <rect x="600" y="190" width="80" height="90" rx="7" fill="#fff8e6" stroke="#c69a32"/><text x="640" y="225" font-size="14" font-weight="700">退避</text><text x="640" y="249" font-size="11">抖动</text><text x="640" y="268" font-size="11">20 ms</text>
  <rect x="690" y="190" width="250" height="90" rx="7" fill="#f3eff8" stroke="#8064a2"/><text x="815" y="220" font-size="14" font-weight="700">尝试 2</text><text x="815" y="244" font-size="11">只能使用剩余 deadline</text><text x="815" y="266" font-size="11">不重置为新的 350 ms</text>
  <rect x="950" y="190" width="110" height="90" rx="7" fill="#e8f5f0" stroke="#2f7d68"/><text x="1005" y="225" font-size="14" font-weight="700">响应</text><text x="1005" y="249" font-size="11">留出传输</text><text x="1005" y="268" font-size="11">与本地开销</text></g>
  <g stroke="#90a4ae" stroke-dasharray="5 5"><line x1="100" y1="145" x2="100" y2="290"/><line x1="300" y1="145" x2="300" y2="290"/><line x1="590" y1="145" x2="590" y2="290"/><line x1="680" y1="145" x2="680" y2="290"/><line x1="940" y1="145" x2="940" y2="290"/><line x1="1060" y1="145" x2="1060" y2="290"/></g>
  <rect x="100" y="330" width="960" height="65" rx="7" fill="#e8f5f0" stroke="#2f7d68"/><text x="580" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6654">每次决策都检查：错误是否短暂 · 请求是否可重放 · Body 是否可重放 · 剩余时间是否足够</text><text x="580" y="380" text-anchor="middle" font-size="11" fill="#355c51">任一条不满足就不重试</text>
  <g><rect x="100" y="440" width="440" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="320" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#7a571d">网关超时的含义</text><text x="125" y="502" font-size="12" fill="#455a64">• 停止等待并尝试传播取消</text><text x="125" y="527" font-size="12" fill="#455a64">• 不能证明上游写操作没有提交</text>
  <rect x="620" y="440" width="440" height="110" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="840" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#8e3442">写操作的正确保障</text><text x="645" y="502" font-size="12" fill="#455a64">• 客户端使用稳定幂等键查询或重试</text><text x="645" y="527" font-size="12" fill="#455a64">• 业务服务用持久化事实保证幂等</text></g>
  </g></svg>
