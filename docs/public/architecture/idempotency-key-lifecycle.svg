<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="t d"><title id="t">客户端幂等键生命周期</title><desc id="d">业务意图生成幂等键，本地保存，失败后使用同一键重试或查询，最终完成</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1080" height="390" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="540" y="42" font-size="23" font-weight="700" fill="#17342c">一个业务意图始终使用同一个幂等键</text><g font-size="13"><g transform="translate(25 125)"><rect width="150" height="78" rx="11" fill="#fff" stroke="#607d8b"/><text x="75" y="32" font-weight="700">用户提交订单</text><text x="75" y="55" font-size="10" fill="#607d8b">创建业务意图</text></g><g transform="translate(205 125)"><rect width="155" height="78" rx="11" fill="#edf3fa" stroke="#4f7cac"/><text x="77" y="32" font-weight="700">生成 UUID</text><text x="77" y="55" font-size="10" fill="#607d8b">Idempotency-Key</text></g><g transform="translate(390 125)"><rect width="175" height="78" rx="11" fill="#f3eff8" stroke="#8b6fb3"/><text x="87" y="29" font-weight="700">本地保存 Pending</text><text x="87" y="52" font-size="10" fill="#607d8b">intent · key</text><text x="87" y="66" font-size="10" fill="#607d8b">payloadHash</text></g><g transform="translate(595 125)"><rect width="155" height="78" rx="11" fill="#fff4e8" stroke="#c07a3d"/><text x="77" y="32" font-weight="700">发送超时</text><text x="77" y="55" font-size="10" fill="#607d8b">结果未知</text></g><g transform="translate(780 125)"><rect width="155" height="78" rx="11" fill="#fff8e6" stroke="#cc9a2e"/><text x="77" y="29" font-weight="700">同一 Key</text><text x="77" y="52" font-size="10" fill="#607d8b">重试或查询结果</text></g><g transform="translate(965 125)"><rect width="90" height="78" rx="11" fill="#e8f5f0" stroke="#3c8772"/><text x="45" y="32" font-weight="700">完成</text><text x="45" y="55" font-size="10" fill="#607d8b">保存结果</text></g></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M175 164H199"/><path d="M360 164H384"/><path d="M565 164H589"/><path d="M750 164H774"/><path d="M935 164H959"/></g><path d="M858 203V270H672V209" fill="none" stroke="#c07a3d" stroke-width="2" marker-end="url(#a)"/><text x="765" y="292" font-size="11" fill="#8c5a2d">可重试失败仍复用同一个 Key，不生成新业务意图</text><text x="540" y="350" font-size="12" fill="#607d8b">请求载荷发生业务变化时才创建新意图和新 Key；同一 Key 不同载荷应返回冲突</text></g></svg>
