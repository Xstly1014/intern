<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">BFF 查询聚合与命令接入的不同路径</title><desc id="d">对比查询路径的并行聚合、读模型和部分结果，以及命令路径的单一用例、幂等、授权和事务</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1120" height="560" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">查询优化展示，命令保护业务意图</text><rect x="35" y="80" width="510" height="420" rx="12" fill="#edf3fa" stroke="#4f7cac"/><rect x="575" y="80" width="510" height="420" rx="12" fill="#fbecef" stroke="#b44c5b"/><text x="290" y="118" text-anchor="middle" font-size="19" font-weight="700" fill="#315f8c">查询 Query</text><text x="830" y="118" text-anchor="middle" font-size="19" font-weight="700" fill="#8e3442">命令 Command</text><g text-anchor="middle"><rect x="75" y="155" width="170" height="80" rx="8" fill="#fff" stroke="#4f7cac"/><text x="160" y="187" font-size="14" font-weight="700">页面 Query</text><text x="160" y="212" font-size="11">字段裁剪 + deadline</text><rect x="320" y="145" width="180" height="100" rx="8" fill="#fff" stroke="#2f7d68"/><text x="410" y="177" font-size="14" font-weight="700">有界并行聚合</text><text x="410" y="202" font-size="11">批量 / DataLoader</text><text x="410" y="225" font-size="11">必需与可选下游</text><rect x="75" y="310" width="170" height="85" rx="8" fill="#fff" stroke="#8064a2"/><text x="160" y="343" font-size="14" font-weight="700">专用读模型</text><text x="160" y="368" font-size="11">明确陈旧与权限</text><rect x="320" y="310" width="180" height="85" rx="8" fill="#fff" stroke="#c69a32"/><text x="410" y="343" font-size="14" font-weight="700">展示响应</text><text x="410" y="368" font-size="11">complete / partial / stale</text><rect x="615" y="155" width="180" height="80" rx="8" fill="#fff" stroke="#b44c5b"/><text x="705" y="187" font-size="14" font-weight="700">意图 Command</text><text x="705" y="212" font-size="11">可信主体 + 幂等键</text><rect x="870" y="145" width="170" height="100" rx="8" fill="#fff" stroke="#8064a2"/><text x="955" y="177" font-size="14" font-weight="700">单一用例</text><text x="955" y="202" font-size="11">资源授权</text><text x="955" y="225" font-size="11">状态机 / 事务</text><rect x="615" y="310" width="180" height="85" rx="8" fill="#fff" stroke="#2f7d68"/><text x="705" y="343" font-size="14" font-weight="700">业务结果</text><text x="705" y="368" font-size="11">持久化幂等事实</text><rect x="870" y="310" width="170" height="85" rx="8" fill="#fff" stroke="#c69a32"/><text x="955" y="343" font-size="14" font-weight="700">契约响应</text><text x="955" y="368" font-size="11">201 / 409 / 422 / 503</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M245 195H315"/><path d="M410 245V305"/><path d="M320 352H250"/><path d="M795 195H865"/><path d="M955 245V305"/><path d="M870 352H800"/></g><text x="290" y="455" text-anchor="middle" font-size="12" fill="#315f8c">可为读体验做专用投影，但不跨库破坏所有权</text><text x="830" y="455" text-anchor="middle" font-size="12" fill="#8e3442">BFF 不串行执行多个写操作并假装分布式事务</text></g></svg>
