<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="t d"><title id="t">边缘配置发布流程</title><desc id="d">边缘配置从 Git 变更、校验、测试、单 PoP 灰度、SLO 门禁、分批全量到回滚</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1120" height="390" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="560" y="42" font-size="23" font-weight="700" fill="#17342c">边缘配置也要渐进发布</text><g font-size="13"><g transform="translate(25 120)"><rect width="120" height="70" rx="10" fill="#fff" stroke="#607d8b"/><text x="60" y="42">Git 变更</text></g><g transform="translate(170 120)"><rect width="140" height="70" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="70" y="30">Schema / 语法</text><text x="70" y="50">校验</text></g><g transform="translate(335 120)"><rect width="140" height="70" rx="10" fill="#f3eff8" stroke="#8b6fb3"/><text x="70" y="30">静态策略测试</text><text x="70" y="50">测试域名</text></g><g transform="translate(500 120)"><rect width="140" height="70" rx="10" fill="#fff8e6" stroke="#cc9a2e"/><text x="70" y="30">单 PoP / 地域</text><text x="70" y="50">小权重灰度</text></g><g transform="translate(665 120)"><rect width="140" height="70" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="70" y="30">SLO 门禁</text><text x="70" y="50">错误与业务指标</text></g><g transform="translate(830 120)"><rect width="120" height="70" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="60" y="42">分批全量</text></g><g transform="translate(975 120)"><rect width="120" height="70" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="60" y="42">观察期</text></g></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M145 155H164"/><path d="M310 155H329"/><path d="M475 155H494"/><path d="M640 155H659"/><path d="M805 155H824"/><path d="M950 155H969"/></g><path d="M735 190V275H405V196" fill="none" stroke="#b44c5b" stroke-width="2" marker-end="url(#a)"/><text x="570" y="297" font-size="13" fill="#913744">门禁失败：停止扩大并自动 / 人工回滚</text><text x="560" y="350" font-size="12" fill="#607d8b">全站 Purge、删除域名、证书替换等高风险动作需要更严格审批和爆炸半径限制</text></g></svg>
