<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">BFF 聚合的部分失败决策</title><desc id="d">展示必需下游失败导致整体失败，可选下游可以省略、标记不可用或使用已标记时间的陈旧结果</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1120" height="560" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">降级必须是产品契约，不是 catch 里的猜测</text><rect x="420" y="90" width="280" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="560" y="125" text-anchor="middle" font-size="16" font-weight="700">BFF 聚合分支结果</text><text x="560" y="151" text-anchor="middle" font-size="11">下游超时 / 5xx / 无数据 / 授权拒绝</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M500 180L230 260"/><path d="M560 180V260"/><path d="M620 180L890 260"/></g><g text-anchor="middle"><rect x="70" y="260" width="320" height="190" rx="10" fill="#fbecef" stroke="#b44c5b"/><text x="230" y="297" font-size="17" font-weight="700" fill="#8e3442">必需资源失败</text><text x="230" y="330" font-size="12">主商品 / 主订单 / 核心价格</text><text x="230" y="365" font-size="14" font-weight="700">整体失败</text><text x="230" y="391" font-size="11">404 / 503 / 504 + 稳定 code</text><text x="230" y="420" font-size="11">取消尚未完成的可选分支</text><rect x="400" y="260" width="320" height="190" rx="10" fill="#fff8e6" stroke="#c69a32"/><text x="560" y="297" font-size="17" font-weight="700" fill="#7a571d">可选资源失败</text><text x="560" y="330" font-size="12">评价摘要 / 推荐 / 活动信息</text><text x="560" y="365" font-size="14" font-weight="700">显式 partial</text><text x="560" y="391" font-size="11">unavailable 或契约化省略</text><text x="560" y="420" font-size="11">不与真实空值混淆</text><rect x="730" y="260" width="320" height="190" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="890" y="297" font-size="17" font-weight="700" fill="#315f8c">可安全使用陈旧值</text><text x="890" y="330" font-size="12">只对允许陈旧的数据</text><text x="890" y="365" font-size="14" font-weight="700">stale + asOf</text><text x="890" y="391" font-size="11">客户端可见数据时间</text><text x="890" y="420" font-size="11">不对交易价格/库存随意 stale</text></g><rect x="120" y="495" width="880" height="38" rx="7" fill="#fff" stroke="#a5b8b2"/><text x="560" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#455a64">禁止伪造默认：价格失败≠0，库存失败≠有货，授权失败≠空列表</text></g></svg>
