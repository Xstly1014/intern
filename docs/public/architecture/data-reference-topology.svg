<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="t d"><title id="t">Java 数据访问与存储生产参考拓扑</title><desc id="d">Java 服务通过 Repository 和读路由访问主从数据库，Outbox CDC 构建缓存、搜索和分析，备份独立保护。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="650" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">权威写入、受控读取、版本化派生与独立恢复</text><rect x="35" y="105" width="210" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="140" y="140" font-size="15" font-weight="700">Java 业务服务</text><text x="140" y="170" font-size="11">Use Case / Transaction</text><text x="140" y="194" font-size="11">Repository / Query Port</text><rect x="315" y="90" width="230" height="140" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="430" y="125" font-size="15" font-weight="700">数据访问适配器</text><text x="430" y="155" font-size="11">JPA / SQL · tenant</text><text x="430" y="180" font-size="11">连接池 · timeout</text><text x="430" y="205" font-size="11">主/副本一致性路由</text><rect x="635" y="70" width="220" height="130" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="745" y="105" font-size="15" font-weight="700">Primary OLTP</text><text x="745" y="135" font-size="11">业务 + 幂等 + Outbox</text><text x="745" y="160" font-size="11">事务 / 约束 / WAL</text><rect x="925" y="70" width="220" height="130" rx="9" fill="#f3eff8" stroke="#8064a2"/><text x="1035" y="105" font-size="15" font-weight="700">Read Replica</text><text x="1035" y="135" font-size="11">允许陈旧的查询</text><text x="1035" y="160" font-size="11">lag / LSN / failover</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M245 160H308"/><path d="M545 145H628"/><path d="M855 135H918"/></g><rect x="280" y="310" width="220" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="390" y="345" font-size="15" font-weight="700">Outbox / CDC</text><text x="390" y="375" font-size="11">source version / watermark</text><rect x="570" y="280" width="180" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="660" y="315" font-size="14" font-weight="700">Cache</text><text x="660" y="343" font-size="11">TTL / 失效 / 回源</text><rect x="790" y="280" width="180" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="880" y="315" font-size="14" font-weight="700">Search / Read Model</text><text x="880" y="343" font-size="11">版本化 / 可重建</text><rect x="1010" y="280" width="145" height="90" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1083" y="315" font-size="14" font-weight="700">OLAP</text><text x="1083" y="343" font-size="11">分析隔离</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M745 200L470 303"/><path d="M500 357H563"/><path d="M500 370L783 330"/><path d="M500 385L1003 330"/></g><rect x="125" y="485" width="930" height="90" rx="9" fill="#fff" stroke="#607d8b"/><text x="590" y="515" font-size="15" font-weight="700">独立备份与恢复保护域</text><text x="590" y="543" font-size="11">跨账户/地域不可变备份 · PITR 日志 · KMS · 隔离恢复演练 · RPO/RTO 实测</text><text x="590" y="558" font-size="10" fill="#9a3345">应用运行身份不能删除备份</text><text x="590" y="620" font-size="12" font-weight="700">数据、缓存、索引、对象和备份共同遵守 tenant、权限、删除与保留策略</text></g></svg>
