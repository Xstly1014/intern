<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 550" role="img" aria-labelledby="t d"><title id="t">主要应用攻击面与纵深控制</title><desc id="d">不可信输入经过协议限制、语义校验、授权和危险能力隔离，再由最小权限运行时访问数据与外部网络。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="550" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">把不可信输入限制在明确语法和能力边界内</text><g text-anchor="middle"><rect x="35" y="100" width="190" height="130" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="130" y="133" font-size="15" font-weight="700">不可信输入</text><text x="130" y="161" font-size="11">JSON · URL · 文件 · Header</text><text x="130" y="184" font-size="11">Webhook · 消息 · 模板</text><text x="130" y="207" font-size="11">注入 / SSRF / 重放 / DoS</text><rect x="285" y="90" width="220" height="150" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="395" y="123" font-size="15" font-weight="700">协议与资源限制</text><text x="395" y="151" font-size="11">bytes · 深度 · 数量 · 时间</text><text x="395" y="174" font-size="11">Schema · allowlist · 安全解析器</text><text x="395" y="197" font-size="11">格式检测 · 压缩比</text><rect x="565" y="90" width="220" height="150" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="675" y="123" font-size="15" font-weight="700">授权与业务语义</text><text x="675" y="151" font-size="11">subject / resource / tenant</text><text x="675" y="174" font-size="11">状态 · 幂等 · 反重放</text><text x="675" y="197" font-size="11">输出编码 / 安全响应</text><rect x="845" y="90" width="300" height="150" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="995" y="123" font-size="15" font-weight="700">危险能力隔离</text><text x="995" y="151" font-size="11">参数化 SQL · 无 Shell 拼接</text><text x="995" y="174" font-size="11">出站代理 · 上传隔离扫描</text><text x="995" y="197" font-size="11">禁用危险反序列化 / 表达式</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M225 165H278"/><path d="M505 165H558"/><path d="M785 165H838"/></g><rect x="100" y="310" width="980" height="125" rx="9" fill="#fff" stroke="#a5b8b2"/><text x="590" y="344" text-anchor="middle" font-size="15" font-weight="700">运行时第二道防线</text><text x="590" y="375" text-anchor="middle" font-size="12">最小数据库/云权限 · 网络出站策略 · 沙箱 · 只读文件系统 · WAF · 容器资源限制</text><text x="590" y="406" text-anchor="middle" font-size="11" fill="#9a3345">WAF 可降低通用攻击噪声，但无法修复 IDOR、跨租户或业务状态机缺失</text><text x="590" y="493" text-anchor="middle" font-size="12" font-weight="700">校验正确格式 ≠ 允许访问资源；不可猜 ID ≠ 对象级授权</text></g></svg>
