<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">服务身份与用户委托双主体模型</title><desc id="d">下游同时验证直接服务身份与受约束的用户委托，审计保留 actor、subject、tenant、目的和认证强度。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">下游同时识别“谁调用”与“代表谁”</text><g text-anchor="middle"><rect x="55" y="115" width="210" height="115" rx="8" fill="#fff" stroke="#607d8b"/><text x="160" y="150" font-size="15" font-weight="700">用户 / 管理员</text><text x="160" y="178" font-size="12">subject 或 actor</text><text x="160" y="202" font-size="11">认证强度 · 会话年龄</text><rect x="350" y="105" width="250" height="135" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="475" y="140" font-size="15" font-weight="700">调用服务</text><text x="475" y="168" font-size="12">直接 workload 身份</text><text x="475" y="192" font-size="12">交换受限 delegation Token</text><text x="475" y="216" font-size="11">缩小 aud / scope / TTL</text><rect x="700" y="105" width="250" height="135" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="825" y="140" font-size="15" font-weight="700">资源服务</text><text x="825" y="168" font-size="12">验证 mTLS 调用方</text><text x="825" y="192" font-size="12">验证 subject / tenant / scope</text><text x="825" y="216" font-size="11">按最新资源事实授权</text><rect x="1000" y="115" width="145" height="115" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1073" y="150" font-size="15" font-weight="700">审计</text><text x="1073" y="178" font-size="11">actor + subject</text><text x="1073" y="202" font-size="11">reason + ticket</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M265 172H343"/><path d="M600 172H693"/><path d="M950 172H993"/></g><rect x="170" y="315" width="840" height="85" rx="9" fill="#fff" stroke="#a5b8b2"/><text x="590" y="346" text-anchor="middle" font-size="13" font-weight="700">委托边界：目标服务 audience · 允许动作 scope · tenant/resource · 最短有效期 · 不可无限转发</text><text x="590" y="376" text-anchor="middle" font-size="12" fill="#9a3345">禁止只传用户 Token 看不见调用服务，也禁止只信服务身份丢失用户资源边界</text><text x="590" y="449" text-anchor="middle" font-size="12" font-weight="700">代理操作必须保留真实 actor，不能让审计只显示被代表用户</text></g></svg>
