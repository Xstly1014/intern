<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">从访问模式到存储选型</title><desc id="d">先定义正确性、查询、规模、生命周期和恢复目标，再选择最少的存储技术。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">先写访问模式，再选数据库品牌</text><g><rect x="35" y="100" width="200" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="135" y="135" font-size="14" font-weight="700">正确性</text><text x="135" y="163" font-size="11">事务 · 约束 · 一致性</text><text x="135" y="187" font-size="11">权威还是副本</text><rect x="265" y="100" width="200" height="110" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="365" y="135" font-size="14" font-weight="700">访问模式</text><text x="365" y="163" font-size="11">Key · 范围 · 排序 · 全文</text><text x="365" y="187" font-size="11">读写比 / 延迟</text><rect x="495" y="100" width="200" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="595" y="135" font-size="14" font-weight="700">规模与增长</text><text x="595" y="163" font-size="11">QPS · bytes · 总量</text><text x="595" y="187" font-size="11">热点 / 地域</text><rect x="725" y="100" width="200" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="825" y="135" font-size="14" font-weight="700">生命周期</text><text x="825" y="163" font-size="11">保留 · 删除 · 归档</text><text x="825" y="187" font-size="11">数据驻留</text><rect x="955" y="100" width="190" height="110" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1050" y="135" font-size="14" font-weight="700">恢复与团队</text><text x="1050" y="163" font-size="11">RPO/RTO · 成本</text><text x="1050" y="187" font-size="11">运维成熟度</text></g><path d="M590 210V285" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="310" y="292" width="560" height="100" rx="10" fill="#fff" stroke="#607d8b"/><text x="590" y="328" font-size="16" font-weight="700">选择能正确满足需求的最少技术组合</text><text x="590" y="357" font-size="12">OLTP 为权威；缓存/搜索/对象/OLAP 仅在访问证据成立时引入</text><text x="590" y="447" font-size="12" font-weight="700">每增加一种存储，就增加一套权限、容量、升级、备份、监控和故障责任</text></g></svg>
