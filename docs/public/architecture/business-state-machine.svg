<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">订单状态机与非法转换</title><desc id="d">订单从待支付进入已支付、已取消或超时关闭，已支付后进入履约，非法和重复命令有明确语义。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">状态转换由业务行为驱动，不允许任意 setStatus</text><g><rect x="50" y="190" width="180" height="80" rx="40" fill="#edf3fa" stroke="#4f7cac"/><text x="140" y="238" font-size="15" font-weight="700">待支付</text><rect x="340" y="80" width="180" height="80" rx="40" fill="#e8f5f0" stroke="#2f7d68"/><text x="430" y="128" font-size="15" font-weight="700">已支付</text><rect x="650" y="80" width="180" height="80" rx="40" fill="#fff8e6" stroke="#c69a32"/><text x="740" y="128" font-size="15" font-weight="700">履约中</text><rect x="950" y="80" width="180" height="80" rx="40" fill="#e8f5f0" stroke="#2f7d68"/><text x="1040" y="128" font-size="15" font-weight="700">已完成</text><rect x="340" y="330" width="180" height="80" rx="40" fill="#fbecef" stroke="#b44c5b"/><text x="430" y="378" font-size="15" font-weight="700">已取消</text><rect x="650" y="330" width="180" height="80" rx="40" fill="#f3eff8" stroke="#8064a2"/><text x="740" y="378" font-size="15" font-weight="700">超时关闭</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M205 190L350 150"/><path d="M520 120H643"/><path d="M830 120H943"/><path d="M180 270L360 330"/><path d="M220 245L650 350"/></g><g font-size="11"><text x="275" y="155">确认支付</text><text x="582" y="110">开始履约</text><text x="887" y="110">签收</text><text x="250" y="315">用户取消</text><text x="445" y="315">支付超时</text></g><path d="M930 195L990 275L930 275Z" fill="#fbecef" stroke="#b44c5b"/><text x="1000" y="250" font-size="11" fill="#9a3345">已完成 → 取消：非法</text><text x="590" y="470" font-size="12" font-weight="700">重复命令返回原结果；并发命令由 version / 条件更新决定唯一胜者</text></g></svg>
