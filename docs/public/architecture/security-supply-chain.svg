<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">从源码到运行制品的软件供应链</title><desc id="d">源码、依赖、隔离构建、SBOM、签名、策略验证和运行时形成可追溯的制品信任链。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">可追溯、可验证的软件供应链</text><g text-anchor="middle"><rect x="25" y="115" width="160" height="110" rx="8" fill="#fff" stroke="#607d8b"/><text x="105" y="148" font-size="14" font-weight="700">源码 / 评审</text><text x="105" y="176" font-size="11">保护分支 · Secret 扫描</text><text x="105" y="199" font-size="11">提交身份</text><rect x="215" y="115" width="160" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="295" y="148" font-size="14" font-weight="700">依赖仓库</text><text x="295" y="176" font-size="11">锁定版本 · 可信代理</text><text x="295" y="199" font-size="11">漏洞 / 许可证</text><rect x="405" y="115" width="160" height="110" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="485" y="148" font-size="14" font-weight="700">隔离构建</text><text x="485" y="176" font-size="11">短期 CI 身份</text><text x="485" y="199" font-size="11">可复现 / provenance</text><rect x="595" y="115" width="160" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="675" y="148" font-size="14" font-weight="700">制品 / SBOM</text><text x="675" y="176" font-size="11">不可变 digest</text><text x="675" y="199" font-size="11">签名与来源证明</text><rect x="785" y="115" width="160" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="865" y="148" font-size="14" font-weight="700">部署门禁</text><text x="865" y="176" font-size="11">验证签名 / 策略</text><text x="865" y="199" font-size="11">环境授权</text><rect x="975" y="115" width="175" height="110" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1063" y="148" font-size="14" font-weight="700">运行 / 响应</text><text x="1063" y="176" font-size="11">漂移 / 新漏洞监测</text><text x="1063" y="199" font-size="11">紧急升级 / 回滚</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M185 170H208"/><path d="M375 170H398"/><path d="M565 170H588"/><path d="M755 170H778"/><path d="M945 170H968"/></g><rect x="170" y="305" width="840" height="85" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="337" text-anchor="middle" font-size="13" font-weight="700">追溯关系：运行 digest → 签名制品 → 构建身份/参数 → 源码提交 + 完整依赖</text><text x="590" y="367" text-anchor="middle" font-size="11" fill="#9a3345">CI 不持永久云密钥；生产不接受可变 latest 或未经受信流水线签名的制品</text><text x="590" y="445" text-anchor="middle" font-size="12" font-weight="700">扫描结果需要所有者、可达性判断、修复 SLA 和例外到期时间</text></g></svg>
