<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc"><title id="title">模块化单体中的 BFF 代码依赖边界</title><desc id="desc">展示 Web、App、Admin API 模块分别拥有协议适配，并只依赖应用层；领域层不依赖 Web 技术，基础设施实现应用和领域定义的端口。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="570" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">同一进程也要保持可验证的依赖方向</text>
<g text-anchor="middle"><rect x="55" y="90" width="300" height="155" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="205" y="124" font-size="16" font-weight="700">web-api</text><text x="205" y="153" font-size="12">Controller · Request/Response DTO</text><text x="205" y="178" font-size="12">校验 · Mapper · Error Mapper</text><text x="205" y="203" font-size="12">Web 聚合与 Cookie 适配</text><rect x="440" y="90" width="300" height="155" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="590" y="124" font-size="16" font-weight="700">app-api</text><text x="590" y="153" font-size="12">Controller · Request/Response DTO</text><text x="590" y="178" font-size="12">校验 · Mapper · Error Mapper</text><text x="590" y="203" font-size="12">版本兼容与弱网裁剪</text><rect x="825" y="90" width="300" height="155" rx="9" fill="#f3eff8" stroke="#8064a2"/><text x="975" y="124" font-size="16" font-weight="700">admin-api</text><text x="975" y="153" font-size="12">Controller · Request/Response DTO</text><text x="975" y="178" font-size="12">校验 · Mapper · Error Mapper</text><text x="975" y="203" font-size="12">权限视图与批量接入</text>
<rect x="285" y="310" width="610" height="90" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="590" y="344" font-size="16" font-weight="700">application</text><text x="590" y="371" font-size="12">Commands · Queries · Use Cases · Ports · 事务编排</text><rect x="390" y="455" width="400" height="70" rx="9" fill="#fff" stroke="#607d8b"/><text x="590" y="484" font-size="16" font-weight="700">domain</text><text x="590" y="508" font-size="12">Entity · Value Object · Policy · 不变量</text><rect x="925" y="330" width="205" height="155" rx="9" fill="#fbecef" stroke="#b44c5b"/><text x="1028" y="365" font-size="15" font-weight="700">infrastructure</text><text x="1028" y="394" font-size="12">Persistence Adapter</text><text x="1028" y="419" font-size="12">Remote Client</text><text x="1028" y="444" font-size="12">Messaging Adapter</text><text x="1028" y="469" font-size="11">实现内层定义的 Port</text></g>
<g stroke="#607d8b" stroke-width="2.5" marker-end="url(#a)"><path d="M205 245V280H470V303"/><path d="M590 245V303"/><path d="M975 245V280H710V303"/><path d="M590 400V448"/><path d="M925 407H902"/></g><text x="590" y="290" text-anchor="middle" font-size="11">允许：API → application</text><text x="850" y="392" text-anchor="end" font-size="11">实现 Port</text><path d="M70 545H1110" stroke="#b44c5b" stroke-width="2" stroke-dasharray="7 6"/><text x="590" y="562" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3345">禁止：application/domain 依赖 Servlet、API DTO 或具体数据库；禁止 Controller 直接访问 Repository / Entity</text></g></svg>
