<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">配置灰度发布与回滚</title><desc id="d">配置经校验审批、小流量灰度、观测和扩大发布，失败回滚到最后有效版本。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="430" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">配置灰度发布与回滚</text><rect x="30" y="120" width="171" height="120" rx="8" fill="#edf3fa" stroke="#607d8b"/><text x="115.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Edit</text><rect x="219" y="120" width="171" height="120" rx="8" fill="#e8f5f0" stroke="#607d8b"/><text x="304.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Schema Validate</text><rect x="408" y="120" width="171" height="120" rx="8" fill="#fff8e6" stroke="#607d8b"/><text x="493.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Approve</text><rect x="597" y="120" width="171" height="120" rx="8" fill="#f3eff8" stroke="#607d8b"/><text x="682.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Canary</text><rect x="786" y="120" width="171" height="120" rx="8" fill="#fbecef" stroke="#607d8b"/><text x="871.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Observe</text><rect x="975" y="120" width="171" height="120" rx="8" fill="#fff" stroke="#607d8b"/><text x="1060.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Rollout / Rollback</text><path d="M201 180H212" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M390 180H401" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M579 180H590" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M768 180H779" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M957 180H968" stroke="#607