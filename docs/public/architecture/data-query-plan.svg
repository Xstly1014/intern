<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" role="img" aria-labelledby="t d"><title id="t">SQL 执行计划与实际行数</title><desc id="d">SQL 经统计估算选择扫描、Join、排序和回表算子，再用实际行数和耗时验证。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="490" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">“使用了索引”只是执行计划分析的开始</text><rect x="35" y="120" width="190" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="130" y="155" font-size="14" font-weight="700">SQL + 参数分布</text><text x="130" y="185" font-size="11">过滤 / Join / 排序</text><rect x="285" y="105" width="230" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="400" y="140" font-size="14" font-weight="700">统计信息 / 估算</text><text x="400" y="170" font-size="11">基数 · 选择性 · 倾斜</text><text x="400" y="195" font-size="11">estimated rows</text><rect x="575" y="105" width="230" height="125" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="690" y="140" font-size="14" font-weight="700">算子计划</text><text x="690" y="170" font-size="11">scan · join · sort · lookup</text><text x="690" y="195" font-size="11">临时表 / 并行</text><rect x="865" y="105" width="280" height="125" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1005" y="140" font-size="14" font-weight="700">实际执行</text><text x="1005" y="170" font-size="11">actual rows · loops · time</text><text x="1005" y="195" font-size="11">IO · 回表 · 锁等待 · bytes</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M225 167H278"/><path d="M515 167H568"/><path d="M805 167H858"/></g><rect x="150" y="310" width="880" height="80" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="340" font-size="13" font-weight="700">estimated 与 actual 偏差大 → 检查统计陈旧、数据倾斜、相关列与参数敏感计划</text><text x="590" y="368" font-size="11">生产量级/分布验证，不能用几十行测试数据证明计划稳定</text><text x="590" y="440" font-size="12" font-weight="700">治理目标是扫描、锁、IO 和总资源消耗，不只是单次耗时</text></g></svg>
