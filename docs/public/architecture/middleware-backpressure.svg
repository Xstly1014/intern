<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">背压从下游传播到入口</title><desc id="d">下游容量限制 Consumer、Worker、Broker 和 Producer，避免无界内存与重试风暴。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="430" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">背压从下游传播到入口</text><rect x="30" y="120" width="209" height="120" rx="8" fill="#edf3fa" stroke="#607d8b"/><text x="134.5" y="158" text-anchor="middle" font-size="14" font-weight="700">DB / API 容量</text><rect x="257" y="120" width="209" height="120" rx="8" fill="#e8f5f0" stroke="#607d8b"/><text x="361.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Worker 有界并发</text><rect x="484" y="120" width="209" height="120" rx="8" fill="#fff8e6" stroke="#607d8b"/><text x="588.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Consumer pause</text><rect x="711" y="120" width="209" height="120" rx="8" fill="#f3eff8" stroke="#607d8b"/><text x="815.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Broker quota</text><rect x="938" y="120" width="209" height="120" rx="8" fill="#fbecef" stroke="#607d8b"/><text x="1042.5" y="158" text-anchor="middle" font-size="14" font-weight="700">入口降载</text><path d="M239 180H250" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M466 180H477" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M693 180H704" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M920 180H931" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="310" width="980" height="62" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="348" text-anchor="middle" font-size="12" font-weight="700">压力必须反向传播，不能藏在无界线程池</text></g></svg>
