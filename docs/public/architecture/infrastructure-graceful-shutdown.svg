<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Java Pod 从摘流到退出的停机时序</title>
<desc id="desc">展示终止事件后端点摘除、SIGTERM、请求排空、资源关闭与强制终止的时间预算。</desc>
<defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.heading{font-size:25px;font-weight:700;fill:#1f2d33}.caption{font-size:14px;fill:#607078}.node-title{font-size:16px;font-weight:700;fill:#1f2d33}.node-sub{font-size:13px;fill:#45565e}.edge{fill:none;stroke:#607078;stroke-width:2}.note{font-size:12px;fill:#6a777d}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607078"/></marker>
</defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="38" class="heading">Java Pod 从摘流到退出的停机时序</text>
<text x="30" y="63" class="caption">展示终止事件后端点摘除、SIGTERM、请求排空、资源关闭与强制终止的时间预算。</text>
<path d="M 150 165 L 175 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 310 165 L 335 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 460 165 L 485 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 630 165 L 655 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 790 165 L 815 165" class="edge" marker-end="url(#arrow)"/>
<path d="M 240 300 L 240 205" class="edge" marker-end="url(#arrow)"/>
<path d="M 720 300 L 720 205" class="edge" marker-end="url(#arrow)"/>
<g aria-label="T0 删除 Pod"><rect x="25" y="125" width="125" height="80" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="87.5" y="153" class="node-title" text-anchor="middle">T0 删除 Pod</text><text x="87.5" y="177" class="node-sub" text-anchor="middle">终止开始</text></g>
<g aria-label="Endpoint 摘除"><rect x="175" y="125" width="135" height="80" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="242.5" y="153" class="node-title" text-anchor="middle">Endpoint 摘除</text><text x="242.5" y="177" class="node-sub" text-anchor="middle">readiness=false</text><text x="242.5" y="196" class="node-sub" text-anchor="middle">停止新流量</text></g>
<g aria-label="SIGTERM"><rect x="335" y="125" width="125" height="80" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="397.5" y="153" class="node-title" text-anchor="middle">SIGTERM</text><text x="397.5" y="177" class="node-sub" text-anchor="middle">Spring 接收</text><text x="397.5" y="196" class="node-sub" text-anchor="middle">停机信号</text></g>
<g aria-label="请求排空"><rect x="485" y="125" width="145" height="80" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="557.5" y="153" class="node-title" text-anchor="middle">请求排空</text><text x="557.5" y="177" class="node-sub" text-anchor="middle">完成 in-flight</text><text x="557.5" y="196" class="node-sub" text-anchor="middle">拒绝新任务</text></g>
<g aria-label="资源关闭"><rect x="655" y="125" width="135" height="80" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="722.5" y="153" class="node-title" text-anchor="middle">资源关闭</text><text x="722.5" y="177" class="node-sub" text-anchor="middle">提交 offset</text><text x="722.5" y="196" class="node-sub" text-anchor="middle">关闭连接池</text></g>
<g aria-label="进程退出"><rect x="815" y="125" width="120" height="80" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="875" y="153" class="node-title" text-anchor="middle">进程退出</text><text x="875" y="177" class="node-sub" text-anchor="middle">exit 0</text></g>
<g aria-label="terminationGracePeriodSeconds"><rect x="175" y="300" width="610" height="78" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="480" y="328" class="node-title" text-anchor="middle">terminationGracePeriodSeconds</text><text x="480" y="352" class="node-sub" text-anchor="middle">必须大于：摘流传播 + 最长请求/消费 + 资源关闭；超时后 SIGKILL</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 基础设施与交付层</text>
</svg>
