<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="t d"><title id="t">N+1 与批量加载成本</title><desc id="d">逐行懒加载制造大量数据库往返，投影或批量查询用固定次数获得结果。</desc><rect width="1180" height="470" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">N+1 的主要成本是重复往返与连接占用</text><rect x="45" y="90" width="500" height="285" rx="10" fill="#fbecef" stroke="#b44c5b"/><text x="295" y="128" text-anchor="middle" font-size="17" font-weight="700">1 + N</text><text x="90" y="170" font-size="12">1. SELECT 100 orders</text><text x="90" y="205" font-size="12">2. 对每个 order：SELECT user WHERE id=?</text><g stroke="#b44c5b"><path d="M105 245H490"/><path d="M105 260H490"/><path d="M105 275H490"/><path d="M105 290H490"/><path d="M105 305H490"/></g><text x="295" y="345" text-anchor="middle" font-size="11">101 次排队 / 网络 / 解析 / 执行</text><rect x="635" y="90" width="500" height="285" rx="10" fill="#e8f5f0" stroke="#2f7d68"/><text x="885" y="128" text-anchor="middle" font-size="17" font-weight="700">固定次数</text><text x="680" y="170" font-size="12">方案 A：一次 Projection Join</text><text x="680" y="205" font-size="12">方案 B：orders + users WHERE id IN (...)</text><path d="M690 255H1080" stroke="#2f7d68" stroke-width="8"/><path d="M690 290H1080" stroke="#4f7cac" stroke-width="8"/><text x="885" y="345" text-anchor="middle" font-size="11">1～2 次查询，受控行数与结果字节</text><text x="590" y="425" text-anchor="middle" font-size="12" font-weight="700">扩大连接池不会修复 N+1，只会让更多重复查询同时打到数据库</text></g></svg>
