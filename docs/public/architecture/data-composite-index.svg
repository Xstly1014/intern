<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" role="img" aria-labelledby="t d"><title id="t">复合索引匹配过滤与排序</title><desc id="d">查询按租户、状态等值过滤并按创建时间和 ID 游标排序，对应复合索引列顺序。</desc><rect width="1180" height="490" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">索引顺序来自查询谓词与稳定排序</text><rect x="100" y="95" width="980" height="80" rx="8" fill="#fff" stroke="#607d8b"/><text x="590" y="128" font-size="13" font-weight="700">WHERE tenant_id=? AND status=? AND (created_at,id)&lt;(?,?)</text><text x="590" y="154" font-size="12">ORDER BY created_at DESC, id DESC LIMIT 50</text><g><rect x="110" y="250" width="210" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="215" y="285" font-size="15" font-weight="700">tenant_id</text><text x="215" y="315" font-size="11">等值 / 隔离第一维</text><rect x="350" y="250" width="210" height="95" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="455" y="285" font-size="15" font-weight="700">status</text><text x="455" y="315" font-size="11">等值过滤</text><rect x="590" y="250" width="210" height="95" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="695" y="285" font-size="15" font-weight="700">created_at DESC</text><text x="695" y="315" font-size="11">范围 + 排序</text><rect x="830" y="250" width="210" height="95" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="935" y="285" font-size="15" font-weight="700">id DESC</text><text x="935" y="315" font-size="11">唯一稳定 tie-breaker</text></g><path d="M110 375H1040" stroke="#607d8b" stroke-width="3"/><text x="590" y="410" font-size="12">INDEX (tenant_id, status, created_at DESC, id DESC)</text><text x="590" y="455" font-size="11" font-weight="700">是否覆盖、是否回表、估算是否准确，最终以真实数据执行计划验证</text></g></svg>
