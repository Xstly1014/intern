<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="t d"><title id="t">可信转发 Header 传递链</title><desc id="d">客户端伪造 Header 在 CDN 被删除，真实 IP 经签名代理链传递到网关</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1040" height="420" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="520" y="42" font-size="23" font-weight="700" fill="#17342c">真实 IP 只能沿受信代理链建立</text><rect x="45" y="125" width="200" height="100" rx="13" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="145" y="158" font-size="16" font-weight="700">公网客户端</text><text x="145" y="186" font-size="11" fill="#913744">伪造 X-Forwarded-For</text><text x="145" y="205" font-size="11" fill="#913744">1.2.3.4</text><rect x="305" y="105" width="210" height="140" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="410" y="142" font-size="17" font-weight="700">CDN / 边界代理</text><text x="410" y="171" font-size="11" fill="#607d8b">删除外部同名 Header</text><text x="410" y="194" font-size="11" fill="#607d8b">写入真实连接 IP</text><text x="410" y="217" font-size="11" fill="#607d8b">附加边缘签名</text><rect x="575" y="105" width="190" height="140" rx="14" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="670" y="142" font-size="17" font-weight="700">Load Balancer</text><text x="670" y="174" font-size="11" fill="#607d8b">只信任已知 CDN 来源</text><text x="670" y="198" font-size="11" fill="#607d8b">验证签名 / mTLS</text><rect x="825" y="125" width="170" height="100" rx="13" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="910" y="158" font-size="16" font-weight="700">API Gateway</text><text x="910" y="186" font-size="11" fill="#607d8b">规范化 client_ip</text><text x="910" y="205" font-size="10" fill="#607d8b">生成可信请求上下文</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M245 175H299"/><path d="M515 175H569"/><path d="M765 175H819"/></g><text x="520" y="310" font-size="12" fill="#607d8b">Forwarded / X-Forwarded-For 只在明确的代理跳数和来源范围内可信</text><rect x="180" y="340" width="680" height="48" rx="10" fill="#fff4e8" stroke="#c07a3d"/><text x="520" y="370" font-size="12" fill="#8c5a2d">用户、租户、角色等身份 Header 同样必须覆盖外部值，并保护内部链路</text></g></svg>
