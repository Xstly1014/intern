<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">从业务目标到生产反馈的架构落地闭环</title>
<desc id="desc">展示业务旅程、约束量化、架构设计、分阶段实现、生产验证和反馈演进形成闭环。</desc>
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.heading{font-size:25px;font-weight:700;fill:#1f2d33}.caption{font-size:14px;fill:#607078}.node-title{font-size:16px;font-weight:700;fill:#1f2d33}.node-sub{font-size:13px;fill:#45565e}.edge{fill:none;stroke:#607078;stroke-width:2}.note{font-size:12px;fill:#6a777d}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607078"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="38" class="heading">从业务目标到生产反馈的架构落地闭环</text><text x="30" y="63" class="caption">展示业务旅程、约束量化、架构设计、分阶段实现、生产验证和反馈演进形成闭环。</text>
<path d="M 165 166 L 190 166" class="edge" marker-end="url(#arrow)"/>
<path d="M 320 166 L 345 166" class="edge" marker-end="url(#arrow)"/>
<path d="M 475 166 L 500 166" class="edge" marker-end="url(#arrow)"/>
<path d="M 630 166 L 655 166" class="edge" marker-end="url(#arrow)"/>
<path d="M 785 166 L 810 166" class="edge" marker-end="url(#arrow)"/>
<path d="M 870 207 L 700 354" class="edge" marker-end="url(#arrow)"/>
<path d="M 260 354 L 100 207" class="edge" marker-end="url(#arrow)"/>
<g aria-label="业务目标"><rect x="35" y="125" width="130" height="82" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="100" y="153" class="node-title" text-anchor="middle">业务目标</text><text x="100" y="177" class="node-sub" text-anchor="middle">关键旅程</text><text x="100" y="196" class="node-sub" text-anchor="middle">价值与优先级</text></g>
<g aria-label="量化约束"><rect x="190" y="125" width="130" height="82" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="255" y="153" class="node-title" text-anchor="middle">量化约束</text><text x="255" y="177" class="node-sub" text-anchor="middle">SLO · 容量</text><text x="255" y="196" class="node-sub" text-anchor="middle">RTO/RPO · 成本</text></g>
<g aria-label="架构设计"><rect x="345" y="125" width="130" height="82" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="410" y="153" class="node-title" text-anchor="middle">架构设计</text><text x="410" y="177" class="node-sub" text-anchor="middle">边界 · 数据</text><text x="410" y="196" class="node-sub" text-anchor="middle">失败与安全</text></g>
<g aria-label="分段交付"><rect x="500" y="125" width="130" height="82" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="565" y="153" class="node-title" text-anchor="middle">分段交付</text><text x="565" y="177" class="node-sub" text-anchor="middle">最小增量</text><text x="565" y="196" class="node-sub" text-anchor="middle">证据门禁</text></g>
<g aria-label="生产验证"><rect x="655" y="125" width="130" height="82" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="720" y="153" class="node-title" text-anchor="middle">生产验证</text><text x="720" y="177" class="node-sub" text-anchor="middle">灰度 · 演练</text><text x="720" y="196" class="node-sub" text-anchor="middle">业务与技术 SLI</text></g>
<g aria-label="反馈决策"><rect x="810" y="125" width="120" height="82" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="870" y="153" class="node-title" text-anchor="middle">反馈决策</text><text x="870" y="177" class="node-sub" text-anchor="middle">保留 · 调整</text><text x="870" y="196" class="node-sub" text-anchor="middle">拆分或退役</text></g>
<g aria-label="持续闭环"><rect x="260" y="315" width="440" height="78" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="480" y="343" class="node-title" text-anchor="middle">持续闭环</text><text x="480" y="367" class="node-sub" text-anchor="middle">事故、容量、成本、交付和组织信号回到下一轮约束</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 端到端落地与演进</text>
</svg>
