<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">权威事实与派生存储的数据版图</title><desc id="d">OLTP 保存权威事实，通过事件和 CDC 构建缓存、搜索、对象元数据、读模型与分析副本。</desc><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">一个权威来源，多种可重建访问形态</text><rect x="405" y="90" width="370" height="120" rx="10" fill="#fff8e6" stroke="#c69a32" stroke-width="2"/><text x="590" y="128" font-size="17" font-weight="700">OLTP 权威数据库</text><text x="590" y="158" font-size="12">事务 · 约束 · 业务状态 · Outbox</text><text x="590" y="184" font-size="11">唯一写入所有者</text><g><rect x="30" y="320" width="190" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="125" y="355" font-size="14" font-weight="700">Redis / 本地缓存</text><text x="125" y="383" font-size="11">热数据 · TTL</text><rect x="260" y="320" width="190" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="355" y="355" font-size="14" font-weight="700">搜索索引</text><text x="355" y="383" font-size="11">全文 · 筛选</text><rect x="490" y="320" width="190" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="585" y="355" font-size="14" font-weight="700">只读投影</text><text x="585" y="383" font-size="11">页面 / 跨域查询</text><rect x="720" y="320" width="190" height="90" rx="8" fill="#fff" stroke="#607d8b"/><text x="815" y="355" font-size="14" font-weight="700">对象存储</text><text x="815" y="383" font-size="11">附件与归档</text><rect x="950" y="320" width="200" height="90" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1050" y="355" font-size="14" font-weight="700">数仓 / OLAP</text><text x="1050" y="383" font-size="11">历史分析</text></g><g stroke="#607d8b" stroke-width="2" stroke-dasharray="6 5"><path d="M470 210L125 313"/><path d="M520 210L355 313"/><path d="M590 210L585 313"/><path d="M660 210L815 313"/><path d="M710 210L1050 313"/></g><text x="590" y="455" font-size="12" font-weigh