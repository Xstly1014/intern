<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-labelledby="t d"><title id="t">BFF 聚合的 deadline、并发与扇出预算</title><desc id="d">展示一个 BFF 请求在总 deadline 内向必需和可选下游并发调用，并为本地组装与响应留余量</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1160" height="600" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">总 deadline 约束所有分支，不是每个下游各拿一份</text><rect x="55" y="90" width="1050" height="65" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="580" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#315f8c">BFF 总预算 500 ms</text><text x="580" y="140" text-anchor="middle" font-size="11">包含本地解析、排队、所有下游尝试、组装与响应余量</text><g text-anchor="middle"><rect x="55" y="220" width="170" height="110" rx="8" fill="#fff" stroke="#607d8b"/><text x="140" y="255" font-size="15" font-weight="700">本地准备</text><text x="140" y="282" font-size="11">契约 / 上下文</text><text x="140" y="305" font-size="11">20 ms</text><rect x="290" y="190" width="190" height="140" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="385" y="225" font-size="15" font-weight="700">必需下游</text><text x="385" y="252" font-size="11">商品主资源</text><text x="385" y="275" font-size="11">失败 → 整体失败</text><text x="385" y="307" font-size="11">子预算 300 ms</text><rect x="530" y="190" width="190" height="140" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="625" y="225" font-size="15" font-weight="700">关键下游</text><text x="625" y="252" font-size="11">价格 / 库存</text><text x="625" y="275" font-size="11">不伪造值</text><text x="625" y="307" font-size="11">子预算 220 ms</text><rect x="770" y="190" width="190" height="140" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="865" y="225" font-size="15" font-weight="700">可选下游</text><text x="865" y="252" font-size="11">评价 / 推荐</text><text x="865" y="275" font-size="11">partial / 快速降级</text><text x="865" y="307" font-size="11">子预算 120 ms</text><rect x="1010" y="220" width="95" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="1057" y="255" font-size="14" font-weight="700">组装</text><text x="1057" y="282" font-size="11">留余量</text><text x="1057" y="305" font-size="11">40 ms</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M225 275H285"/><path d="M225 275L525 250"/><path d="M225 275L765 250"/><path d="M480 260H1005"/><path d="M720 275H1005"/><path d="M960 295H1005"/></g><rect x="80" y="405" width="1000" height="120" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="580" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#355c51">三个独立下游并行，子预算不相加</text><text x="120" y="470" font-size="12" fill="#455a64">• 任一时刻都根据剩余 deadline 决定是否继续、重试或取消</text><text x="120" y="497" font-size="12" fill="#455a64">• 每请求、每下游和每实例都有扇出/并发上限，不用无界 flatMap/Future</text></g></svg>
