<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-labelledby="t d">
  <title id="t">系统边缘架构从小型到全球化的演进</title><desc id="d">对比小型系统、成长型系统与全球系统的客户端与边缘架构组件</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter></defs>
  <rect width="1080" height="660" rx="22" fill="#f7faf9"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <text x="540" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">边缘架构按需求演进，而不是一次堆满组件</text>
    <g filter="url(#s)">
      <g transform="translate(40 90)"><rect width="300" height="490" rx="16" fill="#fff" stroke="#607d8b" stroke-width="2"/><rect width="300" height="68" rx="16" fill="#59636e"/><text x="150" y="29" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">小型系统</text><text x="150" y="51" text-anchor="middle" font-size="11" fill="#fff">单地域 · 小团队 · 托管优先</text><g text-anchor="middle"><rect x="48" y="105" width="204" height="54" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="150" y="138" font-size="14">云 DNS</text><rect x="48" y="186" width="204" height="64" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="150" y="212" font-size="14">CDN / 基础 WAF</text><text x="150" y="233" font-size="10" fill="#607d8b">静态资源与基础防护</text><rect x="48" y="277" width="204" height="64" rx="10" fill="#f3eff8" stroke="#8b6fb3"/><text x="150" y="303" font-size="14">云 L7 LB</text><text x="150" y="324" font-size="10" fill="#607d8b">HTTPS 与健康检查</text><rect x="48" y="368" width="204" height="72" rx="10" fill="#fbecef" stroke="#b44c5b"/><text x="150" y="397" font-size="14">2+ Spring Boot</text><text x="150" y="420" font-size="10" fill="#607d8b">跨两个故障域</text></g></g>
      <g transform="translate(390 90)"><rect width="300" height="490" rx="16" fill="#fff" stroke="#3c8772" stroke-width="2"/><rect width="300" height="68" rx="16" fill="#3c8772"/><text x="150" y="29" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">成长型系统</text><text x="150" y="51" text-anchor="middle" font-size="11" fill="#fff">多可用区 · 峰值流量 · 统一治理</text><g text-anchor="middle"><rect x="48" y="98" width="204" height="54" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="150" y="131" font-size="14">DNS / GSLB</text><rect x="48" y="172" width="204" height="78" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="150" y="198" font-size="14">CDN / DDoS / WAF</text><text x="150" y="220" font-size="10" fill="#607d8b">Bot · Shield · 安全回源</text><rect x="48" y="270" width="204" height="64" rx="10" fill="#f3eff8" stroke="#8b6fb3"/><text x="150" y="296" font-size="14">Regional L7 LB</text><text x="150" y="317" font-size="10" fill="#607d8b">多 AZ 与连接排空</text><rect x="48" y="354" width="204" height="86" rx="10" fill="#fbecef" stroke="#b44c5b"/><text x="150" y="382" font-size="14">Gateway / BFF</text><text x="150" y="404" font-size="10" fill="#607d8b">Java 服务集群</text><text x="150" y="423" font-size="10" fill="#607d8b">RUM + Synthetic + Trace</text></g></g>
      <g transform="translate(740 90)"><rect width="300" height="490" rx="16" fill="#fff" stroke="#8b6fb3" stroke-width="2"/><rect width="300" height="68" rx="16" fill="#8b6fb3"/><text x="150" y="29" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">全球化系统</text><text x="150" y="51" text-anchor="middle" font-size="11" fill="#fff">多地域 · 高 SLO · 平台治理</text><g text-anchor="middle"><rect x="48" y="98" width="204" height="64" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="150" y="124" font-size="14">多权威 DNS</text><text x="150" y="145" font-size="10" fill="#607d8b">Anycast Global Edge</text><rect x="48" y="182" width="204" height="78" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="150" y="208" font-size="14">多区域边缘 Cell</text><text x="150" y="230" font-size="10" fill="#607d8b">CDN · 安全 · 流量隔离</text><rect x="48" y="280" width="204" height="72" rx="10" fill="#f3eff8" stroke="#8b6fb3"/><text x="150" y="307" font-size="14">地域 Gateway / 服务</text><text x="150" y="329" font-size="10" fill="#607d8b">匹配数据与合规拓扑</text><rect x="48" y="372" width="204" height="68" rx="10" fill="#fff8e6" stroke="#cc9a2e"/><text x="150" y="398" font-size="14">全局控制面</text><text x="150" y="420" font-size="10" fill="#607d8b">发布 · 观测 · 容灾 · 成本</text></g></g>
    </g>
    <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M342 335H382"/><path d="M692 335H732"/></g>
    <text x="365" y="323" text-anchor="middle" font-size="10" fill="#607d8b">增长</text><text x="715" y="323" text-anchor="middle" font-size="10" fill="#607d8b">全球化</text>
    <text x="540" y="625" text-anchor="middle" font-size="12" fill="#607d8b">升级触发条件：真实流量、用户地域、SLO、团队边界、故障隔离与合规，而不是“架构越复杂越先进”</text>
  </g>
</svg>
