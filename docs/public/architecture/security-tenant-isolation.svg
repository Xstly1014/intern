<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">多租户隔离强度与成本</title><desc id="d">从共享表到独立集群，隔离和成本逐步提高，同时所有模型都需要租户上下文贯穿非数据库资源。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">租户隔离：强度、成本与爆炸半径的选择</text><path d="M95 330L1060 105" stroke="#607d8b" stroke-width="3" marker-end="url(#a)"/><g text-anchor="middle"><rect x="55" y="285" width="220" height="115" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="165" y="318" font-size="14" font-weight="700">共享库 / 共享表</text><text x="165" y="347" font-size="11">tenant_id + 强制查询约束</text><text x="165" y="372" font-size="11">低成本 · 大爆炸半径</text><rect x="330" y="225" width="220" height="115" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="440" y="258" font-size="14" font-weight="700">独立 Schema</text><text x="440" y="287" font-size="11">共享实例 · Schema 路由</text><text x="440" y="312" font-size="11">迁移与连接管理增加</text><rect x="605" y="165" width="220" height="115" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="715" y="198" font-size="14" font-weight="700">独立数据库</text><text x="715" y="227" font-size="11">大客户 / 数据驻留</text><text x="715" y="252" font-size="11">容量与版本编排增加</text><rect x="880" y="105" width="240" height="115" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="1000" y="138" font-size="14" font-weight="700">独立集群 / 账户</text><text x="1000" y="167" font-size="11">高监管 / 高价值租户</text><text x="1000" y="192" font-size="11">最强隔离 · 最高运维成本</text></g><text x="1020" y="85" font-size="12" font-weight="700">隔离与成本增强</text><rect x="140" y="435" width="900" height="50" rx="8" fill="#fbecef"/><text x="590" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3345">无论数据模型如何：缓存、锁、搜索、对象、消息、导出、分析和备份都必须保留 tenant 边界</text></g></svg>
