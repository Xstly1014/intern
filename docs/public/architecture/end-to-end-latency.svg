<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t d"><title id="t">端到端延迟组成</title><desc id="d">DNS、建连、TLS、上传、边缘、源站、业务、首字节、下载和渲染共同构成用户延迟</desc><rect width="1080" height="430" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="540" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17342c">用户感知的端到端延迟</text><g transform="translate(45 110)"><rect width="90" height="90" fill="#edf3fa" stroke="#4f7cac"/><rect x="90" width="120" height="90" fill="#e8f5f0" stroke="#3c8772"/><rect x="210" width="95" height="90" fill="#f3eff8" stroke="#8b6fb3"/><rect x="305" width="105" height="90" fill="#fff8e6" stroke="#cc9a2e"/><rect x="410" width="125" height="90" fill="#fff4e8" stroke="#c07a3d"/><rect x="535" width="115" height="90" fill="#edf3fa" stroke="#4f7cac"/><rect x="650" width="130" height="90" fill="#fbecef" stroke="#b44c5b"/><rect x="780" width="90" height="90" fill="#e8f5f0" stroke="#3c8772"/><rect x="870" width="120" height="90" fill="#f3eff8" stroke="#8b6fb3"/></g><g text-anchor="middle" font-size="11" fill="#263238"><text x="90" y="148">DNS</text><text x="90" y="169">查询</text><text x="195" y="148">TCP/QUIC</text><text x="195" y="169">建连</text><text x="302" y="148">TLS</text><text x="302" y="169">握手</text><text x="402" y="148">请求</text><text x="402" y="169">上传</text><text x="517" y="148">边缘排队</text><text x="517" y="169">安全检查</text><text x="637" y="148">回源</text><text x="637" y="169">网络</text><text x="760" y="148">网关与</text><text x="760" y="169">业务处理</text><text x="870" y="148">TTFB</text><text x="870" y="169">首字节</text><text x="1010" y="148">下载与</text><text x="1010" y="169">客户端渲染</text></g><path d="M45 240H1035" stroke="#607d8b" stroke-width="3"/><g stroke="#607d8b"><path d="M45 230V250"/><path d="M1035 230V250"/></g><text x="540" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#607d8b">Total = 所有阶段之和 + 排队、丢包重传与客户端重试</text><rect x="165" y="320" width="750" height="60" rx="12" fill="#fff" stroke="#607d8b"/><text x="540" y="347" text-anchor="middle" font-size="13" fill="#263238">只优化 Java 方法耗时，未必能改善真实用户体验</text><text x="540" y="368" text-anchor="middle" font-size="11" fill="#607d8b">移动网络中 DNS、建连、丢包和跨地域 RTT 可能占据大部分时间</text></g></svg>
