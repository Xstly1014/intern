<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">身份认证、资源授权与审计链路</title><desc id="d">用户通过身份提供方获得 Token，网关初检后业务服务做资源级授权并记录审计</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1000" height="480" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="500" y="42" font-size="23" font-weight="700" fill="#17342c">身份、权限与审计贯穿完整请求</text><g><rect x="40" y="140" width="140" height="76" rx="12" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="110" y="184" font-size="16" font-weight="700">用户</text><rect x="235" y="115" width="190" height="126" rx="14" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="330" y="150" font-size="16" font-weight="700">身份提供方 IdP</text><text x="330" y="180" font-size="11" fill="#607d8b">登录 · MFA · OIDC</text><text x="330" y="204" font-size="11" fill="#607d8b">签发 Access Token</text><rect x="480" y="115" width="190" height="126" rx="14" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="575" y="150" font-size="16" font-weight="700">API Gateway</text><text x="575" y="180" font-size="11" fill="#607d8b">签名 · 过期 · iss / aud</text><text x="575" y="204" font-size="11" fill="#607d8b">粗粒度 Scope</text><rect x="725" y="115" width="230" height="126" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="840" y="150" font-size="16" font-weight="700">业务服务</text><text x="840" y="180" font-size="11" fill="#607d8b">资源所有权 · 租户 · 状态</text><text x="840" y="204" font-size="11" fill="#607d8b">最终授权决定</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M180 178H229"/><path d="M425 178H474"/><path d="M670 178H719"/></g><rect x="270" y="335" width="460" height="78" rx="13" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="500" y="367" font-size="16" font-weight="700">不可篡改的审计事件</text><text x="500" y="392" font-size="11" fill="#607d8b">主体 · 委托者 · 动作 · 资源 · 结果 · Trace · 时间</text><path d="M840 241V295Q840 315 820 315H500V329" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/></g></svg>
