<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="t d"><title id="t">创建订单端到端时序</title><desc id="d">用户、边缘网关、BFF、订单、库存、数据库 Outbox 和消息消费者之间的时序</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1120" height="760" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="560" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#17342c">创建订单：同步受理与异步扩散</text><g text-anchor="middle" font-size="13" font-weight="700"><rect x="25" y="65" width="110" height="52" rx="9" fill="#fff" stroke="#607d8b"/><text x="80" y="97">用户</text><rect x="175" y="65" width="130" height="52" rx="9" fill="#e8f5f0" stroke="#3c8772"/><text x="240" y="97">边缘 / 网关</text><rect x="350" y="65" width="110" height="52" rx="9" fill="#f3eff8" stroke="#8b6fb3"/><text x="405" y="97">BFF</text><rect x="505" y="65" width="110" height="52" rx="9" fill="#fbecef" stroke="#b44c5b"/><text x="560" y="97">订单</text><rect x="660" y="65" width="110" height="52" rx="9" fill="#fbecef" stroke="#b44c5b"/><text x="715" y="97">库存</text><rect x="815" y="65" width="130" height="52" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="880" y="97">DB / Outbox</text><rect x="985" y="65" width="115" height="52" rx="9" fill="#fff8e6" stroke="#cc9a2e"/><text x="1042" y="97">MQ / 消费者</text></g><g stroke="#90a4ae" stroke-dasharray="5 5"><path d="M80 117V700"/><path d="M240 117V700"/><path d="M405 117V700"/><path d="M560 117V700"/><path d="M715 117V700"/><path d="M880 117V700"/><path d="M1042 117V700"/></g><g stroke="#607d8b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M80 165H234"/><path d="M240 220H399"/><path d="M405 275H554"/><path d="M560 330H709"/><path d="M715 380H566"/><path d="M560 435H874"/><path d="M880 485H566"/><path d="M560 535H411"/><path d="M405 585H86"/><path d="M880 645H1036"/></g><g font-size="12" fill="#263238"><text x="155" y="157">POST + 幂等键</text><text x="320" y="212">限流 / 验签 / 路由</text><text x="480" y="267">校验转换</text><text x="635" y="322">预占库存</text><text x="635" y="372">预占结果</text><text x="720" y="427">订单 + Outbox 同事务</text><text x="720" y="477">提交成功</text><text x="480" y="527">订单号</text><text x="240" y="577">已受理响应</text><text x="960" y="637">发布事件 → 支付 / 通知 / 积分</text></g><text x="560" y="730" text-anchor="middle" font-size="12" fill="#607d8b">客户端超时后使用同一幂等键查询；消息消费者按至少一次投递实现幂等</text></g></svg>
