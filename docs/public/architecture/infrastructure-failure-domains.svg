<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">实例、节点、可用区与地域故障域</title>
<desc id="desc">展示从进程到地域逐级扩大的故障域以及每一级需要的隔离和冗余措施。</desc>
<defs>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.heading{font-size:25px;font-weight:700;fill:#1f2d33}.caption{font-size:14px;fill:#607078}.node-title{font-size:16px;font-weight:700;fill:#1f2d33}.node-sub{font-size:13px;fill:#45565e}.edge{fill:none;stroke:#607078;stroke-width:2}.note{font-size:12px;fill:#6a777d}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607078"/></marker>
</defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="38" class="heading">实例、节点、可用区与地域故障域</text>
<text x="30" y="63" class="caption">展示从进程到地域逐级扩大的故障域以及每一级需要的隔离和冗余措施。</text>
<path d="M 480 410 L 480 430" class="edge" marker-end="url(#arrow)"/>
<g aria-label="Region A"><rect x="70" y="75" width="820" height="335" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="480" y="103" class="node-title" text-anchor="middle">Region A</text><text x="480" y="127" class="node-sub" text-anchor="middle">地域级故障：控制面、骨干网或大范围服务不可用</text></g>
<g aria-label="AZ 1"><rect x="105" y="125" width="350" height="235" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="280" y="153" class="node-title" text-anchor="middle">AZ 1</text><text x="280" y="177" class="node-sub" text-anchor="middle">独立电力与网络；至少承载一部分容量</text></g>
<g aria-label="AZ 2"><rect x="505" y="125" width="350" height="235" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="680" y="153" class="node-title" text-anchor="middle">AZ 2</text><text x="680" y="177" class="node-sub" text-anchor="middle">反亲和与 topologySpread 跨区分布</text></g>
<g aria-label="Node A"><rect x="135" y="185" width="130" height="120" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="200" y="213" class="node-title" text-anchor="middle">Node A</text><text x="200" y="237" class="node-sub" text-anchor="middle">Pod 1</text><text x="200" y="256" class="node-sub" text-anchor="middle">Pod 2</text></g>
<g aria-label="Node B"><rect x="295" y="185" width="130" height="120" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="360" y="213" class="node-title" text-anchor="middle">Node B</text><text x="360" y="237" class="node-sub" text-anchor="middle">Pod 3</text><text x="360" y="256" class="node-sub" text-anchor="middle">冗余副本</text></g>
<g aria-label="Node C"><rect x="535" y="185" width="130" height="120" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="600" y="213" class="node-title" text-anchor="middle">Node C</text><text x="600" y="237" class="node-sub" text-anchor="middle">Pod 4</text><text x="600" y="256" class="node-sub" text-anchor="middle">Pod 5</text></g>
<g aria-label="Node D"><rect x="695" y="185" width="130" height="120" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="760" y="213" class="node-title" text-anchor="middle">Node D</text><text x="760" y="237" class="node-sub" text-anchor="middle">Pod 6</text><text x="760" y="256" class="node-sub" text-anchor="middle">冗余副本</text></g>
<g aria-label="Region B / 备份域"><rect x="290" y="430" width="380" height="48" rx="8" fill="#fff0ef" stroke="#b94b45" stroke-width="2"/><text x="480" y="458" class="node-title" text-anchor="middle">Region B / 备份域</text><text x="480" y="482" class="node-sub" text-anchor="middle">按 RTO/RPO 选择冷备、温备或多活</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 基础设施与交付层</text>
</svg>
