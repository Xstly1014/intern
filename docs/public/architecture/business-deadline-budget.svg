<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" role="img" aria-labelledby="t d"><title id="t">服务调用链 deadline 与重试预算</title><desc id="d">入口总预算沿调用链递减，每一跳为排队、调用和本地处理保留时间，重试共享同一预算。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="490" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">deadline 是绝对终点，不能每跳重新获得完整超时</text><rect x="45" y="110" width="200" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="145" y="145" font-size="14" font-weight="700">入口：剩余 1000 ms</text><text x="145" y="175" font-size="11">解析 / 排队 / 响应余量</text><rect x="330" y="110" width="200" height="100" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="430" y="145" font-size="14" font-weight="700">服务 A：剩余 850 ms</text><text x="430" y="175" font-size="11">本地 80 + 下游预算</text><rect x="615" y="110" width="200" height="100" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="715" y="145" font-size="14" font-weight="700">服务 B：剩余 600 ms</text><text x="715" y="175" font-size="11">连接池排队也计时</text><rect x="900" y="110" width="235" height="100" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1018" y="145" font-size="14" font-weight="700">依赖：最多 350 ms</text><text x="1018" y="175" font-size="11">为组装 / 提交留出余量</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M245 160H323"/><path d="M530 160H608"/><path d="M815 160H893"/></g><rect x="160" y="300" width="860" height="85" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="329" font-size="13" font-weight="700">一次重试消耗同一总预算：尝试 + 退避 + 排队 + 第二次尝试 ≤ 剩余 deadline</text><text x="590" y="358" font-size="11" fill="#9a3345">每层各重试 3 次会形成乘法放大；通常只允许最了解业务意图的一层负责</text><text x="590" y="438" font-size="12" font-weight="700">预算不足以安全完成时快速拒绝，避免已注定超时的工作继续占用连接与锁</text></g></svg>
