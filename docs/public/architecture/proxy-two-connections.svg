<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d"><title id="t">反向代理的两段连接模型</title><desc id="d">客户端与负载均衡器是前端连接，负载均衡器与 Java 网关是独立后端连接</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="960" height="350" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="480" y="42" font-size="23" font-weight="700" fill="#17342c">代理终止客户端连接，再建立独立后端连接</text><rect x="55" y="125" width="180" height="82" rx="13" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="145" y="174" font-size="17" font-weight="700">Client</text><rect x="390" y="100" width="180" height="132" rx="14" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="480" y="148" font-size="18" font-weight="700">Load Balancer</text><text x="480" y="177" font-size="11" fill="#607d8b">协议终止 · 连接池</text><text x="480" y="199" font-size="11" fill="#607d8b">排队 · 复用 · 超时</text><rect x="725" y="125" width="180" height="82" rx="13" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="815" y="174" font-size="17" font-weight="700">Java Gateway</text><path d="M235 166H384" stroke="#3c8772" stroke-width="5" marker-end="url(#a)"/><path d="M570 166H719" stroke="#8b6fb3" stroke-width="5" marker-end="url(#a)"/><text x="312" y="143" font-size="12" fill="#2d6b59">Frontend Connection</text><text x="645" y="143" font-size="12" fill="#6c528f">Backend Connection</text><text x="312" y="228" font-size="11" fill="#607d8b">HTTP/2 / QUIC / TLS</text><text x="645" y="228" font-size="11" fill="#607d8b">HTTP/1.1 / HTTP/2 / mTLS</text><text x="480" y="300" font-size="12" fill="#607d8b">两段连接的协议、池大小、Keep-Alive 和空闲超时可以不同，但必须协调</text></g></svg>
