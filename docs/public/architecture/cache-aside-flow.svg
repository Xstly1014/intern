<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">Cache-Aside 读取和写入流程</title><desc id="d">读取缓存未命中后查询数据库并回填，写入时先更新数据库再删除缓存</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1000" height="540" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17342c">Cache-Aside：缓存是可重建的性能副本</text><g text-anchor="middle"><rect x="65" y="100" width="180" height="70" rx="12" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="155" y="142" font-size="16" font-weight="700">业务服务</text><rect x="410" y="100" width="180" height="70" rx="12" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="500" y="142" font-size="16" font-weight="700">Redis 缓存</text><rect x="755" y="100" width="180" height="70" rx="12" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="845" y="142" font-size="16" font-weight="700">权威数据库</text></g><line x1="155" y1="170" x2="155" y2="475" stroke="#90a4ae" stroke-dasharray="5 5"/><line x1="500" y1="170" x2="500" y2="475" stroke="#90a4ae" stroke-dasharray="5 5"/><line x1="845" y1="170" x2="845" y2="475" stroke="#90a4ae" stroke-dasharray="5 5"/><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M155 215H494"/><path d="M500 250H165"/><path d="M155 290H839"/><path d="M845 330H165"/><path d="M155 365H494"/><path d="M155 410H839"/><path d="M845 450H165"/><path d="M155 480H494"/></g><g font-size="12" fill="#263238"><text x="325" y="207">1. 读缓存</text><text x="325" y="242">2. miss</text><text x="500" y="282">3. 查数据库</text><text x="500" y="322">4. 返回权威数据</text><text x="325" y="357">5. 回填缓存 + TTL</text><text x="500" y="402">写：1. 更新数据库</text><text x="500" y="442">2. 提交成功</text><text x="325" y="472">3. 删除缓存</text></g><text x="500" y="518" text-anchor="middle" font-size="12" fill="#607d8b">并发、失效失败和读写竞态需要结合唯一版本、CDC 或短暂陈旧窗口设计</text></g></svg>
