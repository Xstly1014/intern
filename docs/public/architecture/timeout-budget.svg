<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">逐层递减的超时预算</title><desc id="d">客户端、边缘负载均衡、网关、BFF 和业务依赖的超时预算从外向内递减</desc><rect width="960" height="500" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="480" y="42" font-size="23" font-weight="700" fill="#17342c">超时从外向内递减</text><g><rect x="80" y="85" width="800" height="340" rx="20" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="170" y="120" font-size="16" font-weight="700">客户端 5.0s</text><rect x="140" y="135" width="680" height="260" rx="18" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="225" y="169" font-size="15" font-weight="700">边缘 / LB 4.5s</text><rect x="200" y="185" width="560" height="180" rx="16" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="275" y="219" font-size="15" font-weight="700">网关 4.0s</text><rect x="260" y="235" width="440" height="100" rx="14" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="325" y="269" font-size="15" font-weight="700">BFF 3.5s</text><rect x="390" y="275" width="260" height="45" rx="10" fill="#fff8e6" stroke="#cc9a2e"/><text x="520" y="303" font-size="13">业务服务及依赖共享剩余预算</text></g><text x="480" y="462" font-size="12" fill="#607d8b">外层必须保留返回错误、记录指标和释放连接的时间；下载、上传和流式请求使用独立预算</text></g></svg>
