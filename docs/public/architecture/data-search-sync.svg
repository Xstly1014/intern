<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">权威数据库到搜索索引的版本化同步</title><desc id="d">Outbox 或 CDC 传递带源版本的变更，索引消费者拒绝旧版本，并通过新索引和别名全量重建。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="480" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">搜索是带版本的派生副本，不是第二写主</text><rect x="35" y="120" width="220" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="145" y="155" font-size="15" font-weight="700">权威 DB + Outbox</text><text x="145" y="185" font-size="11">entity ID · tenant</text><text x="145" y="208" font-size="11">sourceVersion · tombstone</text><rect x="345" y="120" width="210" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="450" y="155" font-size="15" font-weight="700">CDC / Broker</text><text x="450" y="185" font-size="11">重复 · 乱序 · 积压</text><rect x="645" y="105" width="230" height="140" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="760" y="140" font-size="15" font-weight="700">Indexer</text><text x="760" y="170" font-size="11">只接受更高 sourceVersion</text><text x="760" y="195" font-size="11">映射 Schema / 删除文档</text><text x="760" y="220" font-size="11">记录 watermark / failure</text><rect x="965" y="120" width="180" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="1055" y="155" font-size="15" font-weight="700">Search Alias</text><text x="1055" y="185" font-size="11">index_v2 / 原子切换</text><text x="1055" y="208" font-size="11">可回滚 v1</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M255 175H338"/><path d="M555 175H638"/><path d="M875 175H958"/></g><rect x="180" y="330" width="820" height="65" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="357" font-size="12" font-weight="700">全量快照构建新索引 + 增量日志追平 → 校验 count/version/query → 切 Alias</text><text x="590" y="380" font-size="11" fill="#9a3345">高风险结果回权威服务复核当前权限和状态</text><text x="590" y="440" font-size="12">索引可删除重建；权威事实不可依赖索引反向修复</text></g></svg>
