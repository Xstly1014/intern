<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">Cache-Aside 读写失效与竞态</title><desc id="d">读未命中回源并填充，写先提交数据库再失效缓存，同时防止旧读回填覆盖新版本。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">Cache-Aside：权威库先正确，缓存可失效可重建</text><rect x="50" y="110" width="190" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="145" y="145" font-size="14" font-weight="700">读请求</text><text x="145" y="175" font-size="11">GET versioned key</text><rect x="350" y="90" width="220" height="130" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="460" y="125" font-size="15" font-weight="700">缓存</text><text x="460" y="155" font-size="11">hit → 返回</text><text x="460" y="180" font-size="11">miss → 有界回源 / singleflight</text><rect x="740" y="90" width="250" height="130" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="865" y="125" font-size="15" font-weight="700">权威数据库</text><text x="865" y="155" font-size="11">读取当前 value + version</text><text x="865" y="180" font-size="11">写事务先提交</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M240 155H343"/><path d="M570 180H733"/><path d="M740 130H577"/></g><rect x="50" y="315" width="190" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="145" y="350" font-size="14" font-weight="700">写请求</text><text x="145" y="380" font-size="11">业务事务</text><path d="M240 360H733" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M865 220C865 290 460 270 460 308" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="315" width="220" height="90" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="460" y="350" font-size="14" font-weight="700">提交后删除 / 版本失效</text><text x="460" y="380" font-size="11">失败由事件重试</text><text x="730" y="380" font-size="11" fill="#9a3345">旧读回填只在 sourceVersion 不倒退时接受</text><text x="590" y="465" font-size="12" font-weight="700">缓存故障时限制回源并发；强一致决策直接读取权威库</text></g></svg>
