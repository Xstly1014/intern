<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 530" role="img" aria-labelledby="t d"><title id="t">从业务能力到限界上下文</title><desc id="d">电商中的目录、定价、库存、订单、支付和履约各自拥有不同语言、规则与事实。</desc><rect width="1180" height="530" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">按语言、规则和事实所有权划分上下文</text><g><rect x="40" y="95" width="240" height="130" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="160" y="130" font-size="16" font-weight="700">商品目录</text><text x="160" y="160" font-size="12">标题 · 属性 · 类目</text><text x="160" y="188" font-size="11">Product = 可展示商品</text><rect x="330" y="95" width="240" height="130" rx="9" fill="#f3eff8" stroke="#8064a2"/><text x="450" y="130" font-size="16" font-weight="700">定价</text><text x="450" y="160" font-size="12">价目 · 促销 · 客群</text><text x="450" y="188" font-size="11">Product = 定价对象</text><rect x="620" y="95" width="240" height="130" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="740" y="130" font-size="16" font-weight="700">库存</text><text x="740" y="160" font-size="12">SKU · 可用量 · 预留</text><text x="740" y="188" font-size="11">Product = 可库存单元</text><rect x="910" y="95" width="230" height="130" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="1025" y="130" font-size="16" font-weight="700">订单</text><text x="1025" y="160" font-size="12">订单项 · 金额快照 · 状态</text><text x="1025" y="188" font-size="11">Product = 下单时快照</text><rect x="185" y="310" width="280" height="105" rx="9" fill="#fbecef" stroke="#b44c5b"/><text x="325" y="345" font-size="16" font-weight="700">支付</text><text x="325" y="375" font-size="12">支付尝试 · 授权 · 退款事实</text><rect x="715" y="310" width="280" height="105" rx="9" fill="#fff" stroke="#607d8b"/><text x="855" y="345" font-size="16" font-weight="700">履约</text><text x="855" y="375" font-size="12">包裹 · 承运 · 签收承诺</text></g><text x="590" y="475" font-size="12" font-weight="700">同名概念在边界内有自己的模型；边界之间通过 ID、API 和事件翻译</text></g></svg>
