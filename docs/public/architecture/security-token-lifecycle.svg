<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">Token 从签发到撤销的生命周期</title><desc id="d">Token 经认证签发、严格验证、短期使用、刷新旋转、重放检测，最终过期或撤销。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">短期、受限、可轮换、可撤销</text><g text-anchor="middle"><rect x="35" y="115" width="175" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="123" y="148" font-size="14" font-weight="700">认证与签发</text><text x="123" y="175" font-size="11">aud · scope · exp</text><text x="123" y="197" font-size="11">key version / kid</text><rect x="255" y="115" width="175" height="110" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="343" y="148" font-size="14" font-weight="700">Resource 验证</text><text x="343" y="175" font-size="11">签名 · iss · aud</text><text x="343" y="197" font-size="11">时间 · 类型 · scope</text><rect x="475" y="115" width="175" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="563" y="148" font-size="14" font-weight="700">短期使用</text><text x="563" y="175" font-size="11">最小 Claim</text><text x="563" y="197" font-size="11">不无限转发</text><rect x="695" y="115" width="175" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="783" y="148" font-size="14" font-weight="700">刷新旋转</text><text x="783" y="175" font-size="11">新 Refresh Token</text><text x="783" y="197" font-size="11">旧 Token 作废</text><rect x="915" y="115" width="230" height="110" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1030" y="148" font-size="14" font-weight="700">过期 / 注销 / 封禁</text><text x="1030" y="175" font-size="11">撤销 Session / Token 家族</text><text x="1030" y="197" font-size="11">风险事件与用户通知</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M210 170H248"/><path d="M430 170H468"/><path d="M650 170H688"/><path d="M870 170H908"/></g><rect x="240" y="300" width="700" height="100" rx="9" fill="#fff" stroke="#b44c5b"/><text x="590" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3345">已旋转的 Refresh Token 再次出现 = 可能被复制</text><text x="590" y="361" text-anchor="middle" font-size="12">撤销整个 Token family · 终止相关会话 · 触发风险检测 · 要求重新认证</text><text x="590" y="444" text-anchor="middle" font-size="12" font-weight="700">JWT 签名提供完整性，不提供保密；敏感信息和高频变化权限不要塞入 Token</text></g></svg>
