<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">上线期间角色、信号与决策回路</title>
<desc id="desc">展示发布负责人协调应用、数据、平台、安全和业务角色，根据统一时间线与门禁作出放量、暂停或回退决策。</desc>
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.heading{font-size:25px;font-weight:700;fill:#1f2d33}.caption{font-size:14px;fill:#607078}.node-title{font-size:16px;font-weight:700;fill:#1f2d33}.node-sub{font-size:13px;fill:#45565e}.edge{fill:none;stroke:#607078;stroke-width:2}.note{font-size:12px;fill:#6a777d}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607078"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="38" class="heading">上线期间角色、信号与决策回路</text><text x="30" y="63" class="caption">展示发布负责人协调应用、数据、平台、安全和业务角色，根据统一时间线与门禁作出放量、暂停或回退决策。</text>
<path d="M 215 115 L 270 96" class="edge" marker-end="url(#arrow)"/>
<path d="M 215 125 L 270 206" class="edge" marker-end="url(#arrow)"/>
<path d="M 415 96 L 665 130" class="edge" marker-end="url(#arrow)"/>
<path d="M 415 206 L 665 180" class="edge" marker-end="url(#arrow)"/>
<path d="M 610 96 L 665 130" class="edge" marker-end="url(#arrow)"/>
<path d="M 610 206 L 665 180" class="edge" marker-end="url(#arrow)"/>
<path d="M 790 215 L 590 330" class="edge" marker-end="url(#arrow)"/>
<path d="M 310 367 L 150 165" class="edge" marker-end="url(#arrow)"/>
<g aria-label="发布负责人"><rect x="35" y="70" width="180" height="95" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="125" y="98" class="node-title" text-anchor="middle">发布负责人</text><text x="125" y="122" class="node-sub" text-anchor="middle">统一时间线</text><text x="125" y="141" class="node-sub" text-anchor="middle">go / pause / rollback</text><text x="125" y="160" class="node-sub" text-anchor="middle">控制变更窗口</text></g>
<g aria-label="应用负责人"><rect x="270" y="55" width="145" height="82" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="342.5" y="83" class="node-title" text-anchor="middle">应用负责人</text><text x="342.5" y="107" class="node-sub" text-anchor="middle">版本/错误/延迟</text><text x="342.5" y="126" class="node-sub" text-anchor="middle">代码回滚边界</text></g>
<g aria-label="数据负责人"><rect x="270" y="165" width="145" height="82" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="342.5" y="193" class="node-title" text-anchor="middle">数据负责人</text><text x="342.5" y="217" class="node-sub" text-anchor="middle">迁移 checkpoint</text><text x="342.5" y="236" class="node-sub" text-anchor="middle">差异与恢复点</text></g>
<g aria-label="平台/安全"><rect x="465" y="55" width="145" height="82" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="537.5" y="83" class="node-title" text-anchor="middle">平台/安全</text><text x="537.5" y="107" class="node-sub" text-anchor="middle">流量/资源/策略</text><text x="537.5" y="126" class="node-sub" text-anchor="middle">基础设施与权限</text></g>
<g aria-label="业务确认人"><rect x="465" y="165" width="145" height="82" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="537.5" y="193" class="node-title" text-anchor="middle">业务确认人</text><text x="537.5" y="217" class="node-sub" text-anchor="middle">订单/支付/履约</text><text x="537.5" y="236" class="node-sub" text-anchor="middle">用户与工单信号</text></g>
<g aria-label="统一发布状态"><rect x="665" y="95" width="255" height="120" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="792.5" y="123" class="node-title" text-anchor="middle">统一发布状态</text><text x="792.5" y="147" class="node-sub" text-anchor="middle">digest · config · schema phase</text><text x="792.5" y="166" class="node-sub" text-anchor="middle">traffic weight · flag state</text><text x="792.5" y="185" class="node-sub" text-anchor="middle">SLI · business KPI · actions</text></g>
<g aria-label="决策动作"><rect x="310" y="330" width="340" height="75" rx="8" fill="#fff0ef" stroke="#b94b45" stroke-width="2"/><text x="480" y="358" class="node-title" text-anchor="middle">决策动作</text><text x="480" y="382" class="node-sub" text-anchor="middle">继续放量 · 保持观察 · 停止副作用</text><text x="480" y="401" class="node-sub" text-anchor="middle">回滚流量/配置 · forward fix</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 端到端落地与演进</text>
</svg>
