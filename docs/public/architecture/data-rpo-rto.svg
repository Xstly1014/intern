<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-labelledby="t d"><title id="t">RPO RTO 与时间点恢复</title><desc id="d">基础备份和连续日志确定可恢复点，RPO 衡量数据损失窗口，RTO 衡量恢复耗时。</desc><rect width="1180" height="460" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">RPO 定义恢复到哪里，RTO 定义多久恢复</text><path d="M90 220H1090" stroke="#607d8b" stroke-width="4"/><g text-anchor="middle"><circle cx="180" cy="220" r="12" fill="#4f7cac"/><text x="180" y="175" font-size="13" font-weight="700">全量备份</text><text x="180" y="260" font-size="11">00:00</text><circle cx="520" cy="220" r="12" fill="#2f7d68"/><text x="520" y="175" font-size="13" font-weight="700">最后可用日志</text><text x="520" y="260" font-size="11">09:57</text><circle cx="620" cy="220" r="12" fill="#b44c5b"/><text x="620" y="175" font-size="13" font-weight="700">事故</text><text x="620" y="260" font-size="11">10:00</text><circle cx="980" cy="220" r="12" fill="#c69a32"/><text x="980" y="175" font-size="13" font-weight="700">业务恢复</text><text x="980" y="260" font-size="11">10:45</text></g><path d="M520 310H620" stroke="#b44c5b" stroke-width="7"/><text x="570" y="345" text-anchor="middle" font-size="13" font-weight="700">RPO = 3 分钟</text><path d="M620 375H980" stroke="#c69a32" stroke-width="7"/><text x="800" y="410" text-anchor="middle" font-size="13" font-weight="700">RTO = 45 分钟</text><text x="590" y="445" text-anchor="middle" font-size="11">PITR = 基础备份 + 连续 WAL/binlog + 目标时间/位点 + 一致性验证</text></g></svg>
