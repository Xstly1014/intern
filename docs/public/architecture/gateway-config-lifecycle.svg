<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc"><title id="title">API 网关配置发布生命周期</title><desc id="desc">展示配置从提交、静态验证、影响分析、预发布测试、波次发布到 ACK 观察和回滚的完整生命周期</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="650" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">配置是高风险制品，发布流程应与代码同等严格</text>
  <g text-anchor="middle"><rect x="45" y="90" width="140" height="100" rx="8" fill="#fff" stroke="#607d8b"/><text x="115" y="125" font-size="15" font-weight="700">1. 提交</text><text x="115" y="150" font-size="11">Git / 受控 API</text><text x="115" y="171" font-size="11">人、原因、目标</text>
  <rect x="225" y="90" width="160" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="305" y="125" font-size="15" font-weight="700">2. 静态验证</text><text x="305" y="150" font-size="11">Schema / 引用 / 冲突</text><text x="305" y="171" font-size="11">参数安全边界</text>
  <rect x="425" y="90" width="160" height="100" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="505" y="125" font-size="15" font-weight="700">3. 影响分析</text><text x="505" y="150" font-size="11">路由 / 消费者 / 安全</text><text x="505" y="171" font-size="11">结构化 diff + 审批</text>
  <rect x="625" y="90" width="160" height="100" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="705" y="125" font-size="15" font-weight="700">4. 预发布</text><text x="705" y="150" font-size="11">契约 / 恶意输入</text><text x="705" y="171" font-size="11">脱敏回放 / 无副作用</text>
  <rect x="825" y="90" width="160" height="100" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="905" y="125" font-size="15" font-weight="700">5. 生成快照</text><text x="905" y="150" font-size="11">版本 / 摘要 / 签名</text><text x="905" y="171" font-size="11">不可变、可回滚</text></g>
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M185 140H220"/><path d="M385 140H420"/><path d="M585 140H620"/><path d="M785 140H820"/><path d="M905 190V245"/></g>
  <rect x="100" y="245" width="980" height="230" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="590" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#355c51">6. 按故障域分波次发布</text>
  <g text-anchor="middle"><rect x="145" y="315" width="180" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="235" y="348" font-size="15" font-weight="700">Canary 实例</text><text x="235" y="375" font-size="11">加载候选快照</text><text x="235" y="398" font-size="11">ACK / NACK</text>
  <rect x="365" y="315" width="180" height="105" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="455" y="348" font-size="15" font-weight="700">Cell / AZ 1</text><text x="455" y="375" font-size="11">观察配置应用</text><text x="455" y="398" font-size="11">路由、资源、错误</text>
  <rect x="585" y="315" width="180" height="105" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="675" y="348" font-size="15" font-weight="700">Cell / AZ 2</text><text x="675" y="375" font-size="11">前一波稳定后扩大</text><text x="675" y="398" font-size="11">不同时替换全部</text>
  <rect x="805" y="315" width="230" height="105" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="920" y="348" font-size="15" font-weight="700">全部实例对账</text><text x="920" y="375" font-size="11">期望版本 vs 实际版本</text><text x="920" y="398" font-size="11">分歧 / 陈旧 / 应用耗时</text></g>
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M325 367H360"/><path d="M545 367H580"/><path d="M765 367H800"/></g>
  <path d="M590 475V525" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><g text-anchor="middle"><rect x="145" y="525" width="380" height="80" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="335" y="557" font-size="15" font-weight="700" fill="#1e6654">成功：标记快照为已知有效</text><text x="335" y="582" font-size="11">审计发布 ID、范围、ACK 和指标</text>
  <rect x="655" y="525" width="380" height="80" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="845" y="557" font-size="15" font-weight="700" fill="#8e3442">失败：停止扩大并重发上一快照</text><text x="845" y="582" font-size="11">不手工反向修改，保留 NACK 与差异</text></g>
  </g></svg>
