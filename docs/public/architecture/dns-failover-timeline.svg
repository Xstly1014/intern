<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t d"><title id="t">DNS 故障切流时间线</title><desc id="d">主地域故障、健康探测、GSLB 摘除、新查询切换和旧 TTL 客户端收敛</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1080" height="430" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="540" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17342c">DNS 切流不是瞬时完成</text><path d="M90 210H1000" stroke="#607d8b" stroke-width="4" marker-end="url(#a)"/><g stroke="#607d8b" stroke-width="2"><path d="M120 190V230"/><path d="M300 190V230"/><path d="M480 190V230"/><path d="M660 190V230"/><path d="M850 190V230"/></g><g text-anchor="middle"><g transform="translate(45 80)"><rect width="150" height="80" rx="11" fill="#fbecef" stroke="#b44c5b"/><text x="75" y="30" font-size="15" font-weight="700">T0</text><text x="75" y="55" font-size="11">主地域故障</text></g><g transform="translate(215 255)"><rect width="170" height="90" rx="11" fill="#fff4e8" stroke="#c07a3d"/><text x="85" y="30" font-size="15" font-weight="700">T + 15s</text><text x="85" y="55" font-size="11">多个探测点</text><text x="85" y="73" font-size="11">连续失败</text></g><g transform="translate(395 80)"><rect width="170" height="80" rx="11" fill="#edf3fa" stroke="#4f7cac"/><text x="85" y="30" font-size="15" font-weight="700">T + 30s</text><text x="85" y="55" font-size="11">GSLB 摘除主地域</text></g><g transform="translate(575 255)"><rect width="170" height="90" rx="11" fill="#e8f5f0" stroke="#3c8772"/><text x="85" y="30" font-size="15" font-weight="700">T + 30s</text><text x="85" y="55" font-size="11">新 DNS 查询</text><text x="85" y="73" font-size="11">获得备用地域</text></g><g transform="translate(765 80)"><rect width="190" height="80" rx="11" fill="#fff8e6" stroke="#cc9a2e"/><text x="95" y="30" font-size="15" font-weight="700">T + TTL</text><text x="95" y="55" font-size="11">旧缓存逐步过期收敛</text></g></g><text x="540" y="390" text-anchor="middle" font-size="12" fill="#607d8b">已有 DNS 缓存和长连接仍可能访问旧地址；客户端连接失败后需要重新解析并退避重试</text></g></svg>
