<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">小型系统边缘部署链路</title><desc id="d">Web App、云 DNS、CDN WAF、L7 负载均衡和跨故障域 Spring Boot 实例</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="960" height="360" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="480" y="42" font-size="23" font-weight="700" fill="#17342c">小型系统：托管能力 + 最小生产底线</text><g font-size="14" font-weight="700"><g transform="translate(25 125)"><rect width="130" height="70" rx="11" fill="#fff" stroke="#607d8b"/><text x="65" y="42">Web / App</text></g><g transform="translate(185 125)"><rect width="125" height="70" rx="11" fill="#edf3fa" stroke="#4f7cac"/><text x="62" y="42">云 DNS</text></g><g transform="translate(340 115)"><rect width="155" height="90" rx="11" fill="#e8f5f0" stroke="#3c8772"/><text x="77" y="35">CDN / WAF</text><text x="77" y="61" font-size="10" fill="#607d8b">静态 + 基础防护</text></g><g transform="translate(525 115)"><rect width="155" height="90" rx="11" fill="#f3eff8" stroke="#8b6fb3"/><text x="77" y="35">云 L7 LB</text><text x="77" y="61" font-size="10" fill="#607d8b">TLS + 健康检查</text></g><g transform="translate(710 90)"><rect width="220" height="140" rx="13" fill="#fbecef" stroke="#b44c5b"/><text x="110" y="34">Spring Boot</text><rect x="20" y="58" width="82" height="55" rx="8" fill="#fff" stroke="#b44c5b"/><text x="61" y="91" font-size="11">故障域 A</text><rect x="118" y="58" width="82" height="55" rx="8" fill="#fff" stroke="#b44c5b"/><text x="159" y="91" font-size="11">故障域 B</text></g></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M155 160H179"/><path d="M310 160H334"/><path d="M495 160H519"/><path d="M680 160H704"/></g><text x="480" y="305" font-size="12" fill="#607d8b">域名证书、静态缓存、基础限流、readiness、优雅停机、外部探测和备份恢复缺一不可</text></g></s