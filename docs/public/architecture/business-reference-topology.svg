<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="t d"><title id="t">Java 业务服务生产参考拓扑</title><desc id="d">订单、库存和支付服务分别拥有数据库，通过 Outbox 和 Broker 传播事实，Saga、读模型和对账形成完整业务闭环。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="650" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">权威写模型、可靠事实、持久流程与可修复投影</text><rect x="35" y="100" width="170" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="120" y="135" font-size="15" font-weight="700">BFF</text><text x="120" y="163" font-size="11">Command / Query</text><rect x="280" y="75" width="230" height="145" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="395" y="110" font-size="15" font-weight="700">订单服务</text><text x="395" y="138" font-size="11">聚合 · 事务 · Outbox</text><text x="395" y="163" font-size="11">Order DB（唯一写主）</text><text x="395" y="188" font-size="11">状态 / version / 幂等</text><rect x="560" y="75" width="230" height="145" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="675" y="110" font-size="15" font-weight="700">库存服务</text><text x="675" y="138" font-size="11">预留状态机 · Outbox</text><text x="675" y="163" font-size="11">Inventory DB（唯一写主）</text><text x="675" y="188" font-size="11">available / reservation</text><rect x="840" y="75" width="230" height="145" rx="9" fill="#f3eff8" stroke="#8064a2"/><text x="955" y="110" font-size="15" font-weight="700">支付服务</text><text x="955" y="138" font-size="11">支付尝试 · 退款 · Outbox</text><text x="955" y="163" font-size="11">Payment DB（唯一写主）</text><text x="955" y="188" font-size="11">渠道适配 / 账本</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M205 147H273"/><path d="M510 147H553"/><path d="M790 147H833"/></g><rect x="160" y="300" width="280" height="100" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="300" y="335" font-size="15" font-weight="700">Saga / 流程管理器</text><text x="300" y="365" font-size="11">持久状态 · deadline · 补偿</text><rect x="480" y="300" width="220" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="590" y="335" font-size="15" font-weight="700">Event Broker</text><text x="590" y="365" font-size="11">至少一次 · 分区顺序</text><rect x="740" y="300" width="280" height="100" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="880" y="335" font-size="15" font-weight="700">授权 Read Model</text><text x="880" y="365" font-size="11">投影 · 新鲜度 · 可重建</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M395 220L335 293"/><path d="M675 220L620 293"/><path d="M955 220L660 293"/><path d="M700 350H733"/></g><rect x="250" y="490" width="680" height="80" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="590" y="520" font-size="15" font-weight="700">对账与安全修复</text><text x="590" y="547" font-size="11">比较双方事实 · 差异工单 · 通过幂等业务命令修复 · 不直接写库</text><g stroke="#607d8b" stroke-width="2" stroke-dasharray="6 5"><path d="M300 400L450 483"/><path d="M590 400V483"/><path d="M880 400L730 483"/></g><text x="590" y="615" font-size="12" font-weight="700">业务 SLI 串联命令、状态停留、Outbox、Saga、投影延迟和对账差异</text></g></svg>
