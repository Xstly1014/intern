<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc"><title id="title">API 网关灰度发布与自动回退</title><desc id="desc">展示候选版本从内部主体到百分比扩大的灰度阶段，每阶段通过技术指标和业务不变量门禁后继续，否则回退</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="640" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">灰度是分流、观测、决策与回退的闭环</text>
  <g text-anchor="middle"><rect x="45" y="95" width="150" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="120" y="128" font-size="15" font-weight="700">候选集群</text><text x="120" y="153" font-size="11">readiness + 合成探测</text><text x="120" y="172" font-size="11">未接用户流量</text>
  <rect x="235" y="95" width="150" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="310" y="128" font-size="15" font-weight="700">内部主体</text><text x="310" y="153" font-size="11">测试账号 / 指定租户</text><text x="310" y="172" font-size="11">受控标签</text>
  <rect x="425" y="95" width="130" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="490" y="128" font-size="15" font-weight="700">1%</text><text x="490" y="153" font-size="11">最小样本</text><text x="490" y="172" font-size="11">稳定哈希</text>
  <rect x="595" y="95" width="130" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="660" y="128" font-size="15" font-weight="700">5% → 25%</text><text x="660" y="153" font-size="11">扩大观察</text><text x="660" y="172" font-size="11">不全量洗牌</text>
  <rect x="765" y="95" width="130" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="830" y="128" font-size="15" font-weight="700">50%</text><text x="830" y="153" font-size="11">验证容量</text><text x="830" y="172" font-size="11">长窗口观察</text>
  <rect x="935" y="95" width="180" height="90" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="1025" y="128" font-size="15" font-weight="700">100% + 回切窗口</text><text x="1025" y="153" font-size="11">旧版本仍可快速恢复</text><text x="1025" y="172" font-size="11">稳定后再清理</text></g>
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M195 140H230"/><path d="M385 140H420"/><path d="M555 140H590"/><path d="M725 140H760"/><path d="M895 140H930"/></g>
  <rect x="105" y="250" width="970" height="200" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="590" y="283" text-anchor="middle" font-size="18" font-weight="700" fill="#355c51">每一阶段都等待样本和观察窗口</text>
  <g text-anchor="middle"><rect x="145" y="320" width="250" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="270" y="350" font-size="14" font-weight="700">技术指标</text><text x="270" y="375" font-size="11">5xx / timeout / P99 / CPU / pool</text><text x="270" y="395" font-size="11">候选与基线对比</text>
  <rect x="465" y="320" width="250" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="590" y="350" font-size="14" font-weight="700">业务不变量</text><text x="590" y="375" font-size="11">下单 / 支付 / 重复 / 副作用</text><text x="590" y="395" font-size="11">高风险命中可立即中止</text>
  <rect x="785" y="320" width="250" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="910" y="350" font-size="14" font-weight="700">决策</text><text x="910" y="375" font-size="11">继续 / 暂停 / 回退</text><text x="910" y="395" font-size="11">自动门禁 + 人工上下文</text></g>
  <path d="M910 410V505H590" stroke="#b44c5b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="315" y="495" width="550" height="90" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="590" y="528" text-anchor="middle" font-size="16" font-weight="700" fill="#8e3442">超阈值：停止扩大，恢复上一稳定权重/版本</text><text x="590" y="555" text-anchor="middle" font-size="12" fill="#455a64">回退不代表数据已自动回退，数据库和消息 Schema 必须先前后兼容</text>
  </g></svg>
