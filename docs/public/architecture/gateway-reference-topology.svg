<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">生产 API 网关参考架构</title><desc id="desc">展示全球边缘、地域负载均衡、跨可用区网关数据面、上游 BFF 与服务，以及独立控制面、配额、身份密钥和可观测平台</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1200" height="720" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">生产 API 网关：数据面按故障域隔离，控制面不进请求热路径</text>
  <g text-anchor="middle"><rect x="40" y="105" width="150" height="90" rx="8" fill="#fff" stroke="#607d8b"/><text x="115" y="139" font-size="15" font-weight="700">全球客户端</text><text x="115" y="165" font-size="11">Web / App / Partner</text>
  <rect x="235" y="90" width="180" height="120" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="325" y="124" font-size="15" font-weight="700">边缘与安全</text><text x="325" y="150" font-size="11">DNS / Anti-DDoS / WAF</text><text x="325" y="172" font-size="11">TLS / 地域选择</text><text x="325" y="194" font-size="11">边缘经过验证的 Forwarded</text>
  <rect x="460" y="105" width="160" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="540" y="139" font-size="15" font-weight="700">地域 L7 LB</text><text x="540" y="165" font-size="11">跨 AZ 健康调度</text></g>
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M190 150H230"/><path d="M415 150H455"/><path d="M620 150H670"/></g>
  <rect x="670" y="75" width="490" height="380" rx="12" fill="#fff" stroke="#a5b8b2"/><text x="915" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#355c51">地域网关数据面</text>
  <g text-anchor="middle"><rect x="705" y="140" width="190" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="800" y="174" font-size="15" font-weight="700">Gateway AZ-A</text><text x="800" y="201" font-size="11">本地不可变快照</text><text x="800" y="223" font-size="11">路由 / 鉴权 / 流控</text><text x="800" y="245" font-size="11">有界连接池 / 重试</text>
  <rect x="935" y="140" width="190" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="1030" y="174" font-size="15" font-weight="700">Gateway AZ-B</text><text x="1030" y="201" font-size="11">独立连接与故障</text><text x="1030" y="223" font-size="11">同一受控配置版本</text><text x="1030" y="245" font-size="11">优雅摘流 / 排空</text>
  <rect x="705" y="315" width="420" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="915" y="347" font-size="15" font-weight="700">BFF / 业务服务集群</text><text x="915" y="373" font-size="11">只接受受信任网关流量 · 资源级授权 · 业务事实</text><text x="915" y="394" font-size="11">按路由与服务独立容量、熔断和 SLO</text></g>
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M800 265V310"/><path d="M1030 265V310"/></g>
  <rect x="40" y="505" width="1120" height="160" rx="12" fill="#edf3fa" stroke="#4f7cac"/><text x="600" y="538" text-anchor="middle" font-size="18" font-weight="700" fill="#315f8c">独立控制与平台能力（不处理业务请求）</text>
  <g text-anchor="middle"><rect x="75" y="565" width="190" height="65" rx="7" fill="#fff" stroke="#4f7cac"/><text x="170" y="591" font-size="14" font-weight="700">配置控制面</text><text x="170" y="614" font-size="11">验证 / 审批 / 波次 / 回滚</text>
  <rect x="290" y="565" width="190" height="65" rx="7" fill="#fff" stroke="#2f7d68"/><text x="385" y="591" font-size="14" font-weight="700">身份与密钥</text><text x="385" y="614" font-size="11">JWKS / CA / Secret 轮换</text>
  <rect x="505" y="565" width="190" height="65" rx="7" fill="#fff" stroke="#c69a32"/><text x="600" y="591" font-size="14" font-weight="700">配额与开发者</text><text x="600" y="614" font-size="11">套餐 / Consumer / API 产品</text>
  <rect x="720" y="565" width="190" height="65" rx="7" fill="#fff" stroke="#8064a2"/><text x="815" y="591" font-size="14" font-weight="700">发布与安全门禁</text><text x="815" y="614" font-size="11">灰度 / 影响分析 / 审计</text>
  <rect x="935" y="565" width="190" height="65" rx="7" fill="#fff" stroke="#b44c5b"/><text x="1030" y="591" font-size="14" font-weight="700">观测与告警</text><text x="1030" y="614" font-size="11">Metrics / Logs / Trace / SLO</text></g>
  <g stroke="#4f7cac" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"><path d="M170 565V480H800V270"/><path d="M385 565V470H870V270"/><path d="M1030 565V470H1030V270"/></g>
  </g></svg>
