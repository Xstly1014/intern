<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="t d"><title id="t">OAuth OIDC 授权码与 PKCE 流程</title><desc id="d">客户端、浏览器、身份提供商和 BFF 之间使用 state、nonce、授权码和 PKCE verifier 建立会话。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="570" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="40" text-anchor="middle" font-size="24" font-weight="700">Authorization Code + PKCE</text><g text-anchor="middle"><text x="120" y="90" font-size="15" font-weight="700">客户端 / 浏览器</text><text x="440" y="90" font-size="15" font-weight="700">BFF / OAuth Client</text><text x="790" y="90" font-size="15" font-weight="700">IdP / Authorization Server</text><text x="1060" y="90" font-size="15" font-weight="700">业务 API</text></g><g stroke="#a5b8b2" stroke-width="2"><path d="M120 105V510"/><path d="M440 105V510"/><path d="M790 105V510"/><path d="M1060 105V510"/></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M120 135H433"/><path d="M440 185H783"/><path d="M790 235H127"/><path d="M120 285H783"/><path d="M790 335H447"/><path d="M440 385H783"/><path d="M790 435H447"/><path d="M440 480H1053"/></g><g font-size="12"><text x="275" y="127">1 创建 state、nonce、verifier/challenge</text><text x="600" y="177">2 精确 redirect URI + challenge</text><text x="455" y="227">3 登录 / MFA / 同意</text><text x="455" y="277">4 回调 code + state（一次性）</text><text x="610" y="327">5 校验 state，提交 code + verifier</text><text x="610" y="377">6 验证 PKCE 与 client / redirect</text><text x="610" y="427">7 ID / Access / Refresh Token</text><text x="730" y="472">8 浏览器持 HttpOnly Session；Access Token 留在 BFF</text></g><rect x="175" y="520" width="830" height="32" rx="6" fill="#fbecef"/><text x="590" y="541" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3345">禁止：App 内置 Client Secret · URL 携带 Token · 开放 redirect 通配 · 只解码不验签</text></g></svg>
