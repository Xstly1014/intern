<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="t d"><title id="t">幂等键首次执行与重复返回</title><desc id="d">首次请求原子占位并保存指纹和结果，重复相同载荷返回原结果，不同载荷则冲突。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="470" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">幂等是业务结果复用，不只是挡住重复 HTTP</text><rect x="40" y="120" width="210" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="145" y="153" font-size="14" font-weight="700">请求</text><text x="145" y="180" font-size="11">tenant + operation + key</text><text x="145" y="202" font-size="11">payload fingerprint</text><rect x="330" y="105" width="270" height="130" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="465" y="138" font-size="15" font-weight="700">原子读取 / 占位</text><text x="465" y="167" font-size="11">不存在 → processing → 执行业务</text><text x="465" y="191" font-size="11">已成功 → 比对 fingerprint</text><text x="465" y="215" font-size="11">租约过期 → 受控接管</text><rect x="720" y="70" width="400" height="80" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="920" y="103" font-size="14" font-weight="700">首次 / 相同 Key + 相同载荷</text><text x="920" y="128" font-size="11">执行一次或返回已保存的原 Result</text><rect x="720" y="190" width="400" height="80" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="920" y="223" font-size="14" font-weight="700">相同 Key + 不同载荷</text><text x="920" y="248" font-size="11">409 幂等冲突，不执行第二次</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M250 170H323"/><path d="M600 150L713 115"/><path d="M600 190L713 225"/></g><rect x="185" y="330" width="810" height="65" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="357" font-size="12" font-weight="700">业务数据 + 幂等状态 + 结果摘要在同一数据库事务提交</text><text x="590" y="380" font-size="11" fill="#9a3345">核心正确性不能只靠可能过期/丢失的 Redis SETNX</text></g></svg>
