<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="t d"><title id="t">Expand Migrate Contract 数据库演进</title><desc id="d">先扩展兼容结构，再发布兼容应用和分批回填，切换读取验证后才删除旧结构。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="470" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">Schema 演进允许新旧应用同时运行</text><g font-size="12"><rect x="30" y="115" width="180" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="120" y="148" font-weight="700">1 Expand</text><text x="120" y="178">新增兼容列/表/索引</text><text x="120" y="198">旧应用不受影响</text><rect x="250" y="115" width="190" height="100" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="345" y="148" font-weight="700">2 Compatible App</text><text x="345" y="178">新旧读写均可</text><text x="345" y="198">单一写路径同步</text><rect x="480" y="115" width="190" height="100" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="575" y="148" font-weight="700">3 Backfill</text><text x="575" y="178">分批 / 限速 / checkpoint</text><text x="575" y="198">可暂停 / 可重入</text><rect x="710" y="115" width="190" height="100" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="805" y="148" font-weight="700">4 Switch</text><text x="805" y="178">灰度切读 / 影子比较</text><text x="805" y="198">业务不变量校验</text><rect x="940" y="115" width="210" height="100" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1045" y="148" font-weight="700">5 Contract</text><text x="1045" y="178">消费者归零 / 回滚窗结束</text><text x="1045" y="198">删除旧结构</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M210 165H243"/><path d="M440 165H473"/><path d="M670 165H703"/><path d="M900 165H933"/></g><rect x="130" y="310" width="920" height="65" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="337" font-size="12" font-weight="700">DDL、索引与回填都有锁/IO/日志/复制成本：预演、限速、超时、监控、可取消</text><text x="590" y="360" font-size="11" fill="#9a3345">禁止一次发布同时改名/删列并要求全部实例瞬时升级</text><text x="590" y="425" font-size="12">每一阶段可观察、可暂停、可回滚，Contract 是最后一步</text></g></svg>
