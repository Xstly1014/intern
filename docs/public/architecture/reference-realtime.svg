<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">WebSocket 与 SSE 心跳和恢复机制</title><desc id="d">客户端通过边缘负载均衡连接实时网关，使用心跳、退避重连、游标恢复与身份刷新</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="500" y="42" font-size="23" font-weight="700" fill="#17342c">长连接必须能断线、重连和恢复状态</text><rect x="55" y="130" width="180" height="90" rx="13" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="145" y="165" font-size="17" font-weight="700">Client</text><text x="145" y="193" font-size="10" fill="#607d8b">lastEventId / cursor</text><rect x="400" y="105" width="200" height="140" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="500" y="143" font-size="17" font-weight="700">Edge / LB</text><text x="500" y="173" font-size="11">WebSocket / SSE</text><text x="500" y="198" font-size="10" fill="#607d8b">连接排空 · 空闲超时</text><rect x="765" y="130" width="180" height="90" rx="13" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="855" y="165" font-size="17" font-weight="700">Realtime Gateway</text><text x="855" y="193" font-size="10" fill="#607d8b">可恢复订阅状态</text><path d="M235 160H394" stroke="#3c8772" stroke-width="3" marker-end="url(#a)"/><path d="M600 160H759" stroke="#3c8772" stroke-width="3" marker-end="url(#a)"/><path d="M855 205H606" stroke="#8b6fb3" stroke-width="2" marker-end="url(#a)"/><path d="M400 205H241" stroke="#8b6fb3" stroke-width="2" marker-end="url(#a)"/><text x="317" y="146" font-size="11" fill="#2d6b59">建立连接</text><text x="680" y="146" font-size="11" fill="#2d6b59">代理转发</text><text x="680" y="228" font-size="11" fill="#6c528f">事件流</text><rect x="110" y="320" width="780" height="105" rx="14" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="500" y="348" font-size="15" font-weight="700">连接管理规则</text><text x="500" y="375" font-size="11">心跳周期 &lt; 链路最小空闲超时 · 断线后指数退避 + 抖动</text><text x="500" y="399" font-size="11">重连携带 lastEventId / cursor 恢复缺失事件 · 身份过期后安全刷新再重连</text></g></svg>
