<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc"><title id="title">网关身份验证与信任传递</title><desc id="desc">展示外部凭证经过 Header 清洗、凭证验证、路由策略后，以受信任身份上下文传给业务服务做资源级授权</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="610" rx="18" fill="#f7faf9"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">验证身份 ≠ 完成业务授权</text>
    <rect x="25" y="80" width="300" height="440" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="175" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#455a64">不可信外部区域</text>
    <g text-anchor="middle"><rect x="60" y="155" width="230" height="80" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="175" y="187" font-size="15" font-weight="700">客户端凭证</text><text x="175" y="213" font-size="11">JWT / Opaque Token / API Key / mTLS</text>
      <rect x="60" y="295" width="230" height="120" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="175" y="327" font-size="15" font-weight="700">可伪造 Header</text><text x="175" y="354" font-size="11">X-User-Id / X-Tenant-Id</text><text x="175" y="376" font-size="11">X-Forwarded-* / X-Canary</text><text x="175" y="398" font-size="11" fill="#9b3544">必须删除，不能优先保留</text></g>
    <rect x="365" y="80" width="450" height="440" rx="10" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="590" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1e6654">网关信任边界</text>
    <g text-anchor="middle"><rect x="405" y="145" width="170" height="100" rx="8" fill="#fff" stroke="#4f7cac"/><text x="490" y="177" font-size="14" font-weight="700">1. 凭证验证</text><text x="490" y="201" font-size="11">签名 / iss / aud / 时间</text><text x="490" y="223" font-size="11">JWKS / introspection</text>
      <rect x="605" y="145" width="170" height="100" rx="8" fill="#fff" stroke="#8064a2"/><text x="690" y="177" font-size="14" font-weight="700">2. 路由策略</text><text x="690" y="201" font-size="11">client / scope / tenant</text><text x="690" y="223" font-size="11">只做粗粒度访问</text>
      <rect x="405" y="300" width="370" height="130" rx="8" fill="#fff" stroke="#2f7d68"/><text x="590" y="332" font-size="15" font-weight="700">标准主体上下文</text><text x="590" y="359" font-size="11">subject · tenant · client · scopes · auth strength</text><text x="590" y="383" font-size="11">最小声明，有界长度，不携带外部凭证秘密</text><text x="590" y="408" font-size="11" fill="#1e6654">通过 mTLS / 受信任网络 / 内部签名 Token 传递</text></g>
    <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M290 195H400"/><path d="M290 355H400"/><path d="M575 195H600"/><path d="M590 245V295"/><path d="M775 365H855"/></g>
    <rect x="855" y="80" width="300" height="440" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="1005" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#455a64">资源所有者</text>
    <g text-anchor="middle"><rect x="890" y="175" width="230" height="100" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="1005" y="208" font-size="15" font-weight="700">BFF / 业务服务</text><text x="1005" y="234" font-size="11">验证内部身份来源</text><text x="1005" y="256" font-size="11">不接受绕过网关公网请求</text>
      <rect x="890" y="325" width="230" height="120" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1005" y="357" font-size="15" font-weight="700">最终资源授权</text><text x="1005" y="383" font-size="11">订单是否属于用户</text><text x="1005" y="405" font-size="11">当前状态是否允许操作</text><text x="1005" y="427" font-size="11">领域数据与审计在业务层</text></g>
    <path d="M1005 275V320" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="120" y="550" width="940" height="38" rx="7" fill="#fff8e6" stroke="#c69a32"/><text x="590" y="575" text-anchor="middle" font-size="12" font-weight="700" fill="#7a571d">网关建立可信主体；业务服务结合实时资源事实完成最终授权</text>
  </g>
</svg>
