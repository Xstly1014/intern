<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-labelledby="t d"><title id="t">成长型系统运行时架构</title><desc id="d">CDN WAF、网关、模块化单体或领域服务、数据和统一可观测</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1040" height="400" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="520" y="42" font-size="23" font-weight="700" fill="#17342c">成长型系统：按独立价值引入分布式能力</text><rect x="35" y="125" width="145" height="72" rx="12" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="107" y="155" font-size="15" font-weight="700">CDN / WAF</text><text x="107" y="177" font-size="10" fill="#607d8b">边缘防护</text><rect x="225" y="125" width="145" height="72" rx="12" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="297" y="168" font-size="15" font-weight="700">API Gateway</text><rect x="415" y="100" width="250" height="122" rx="14" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="540" y="137" font-size="16" font-weight="700">模块化单体</text><text x="540" y="164" font-size="12">或少量领域服务</text><text x="540" y="191" font-size="10" fill="#607d8b">按发布 / 伸缩 / 故障隔离拆分</text><rect x="735" y="70" width="250" height="80" rx="12" fill="#e9f7f4" stroke="#358f80" stroke-width="2"/><text x="860" y="102" font-size="15" font-weight="700">MySQL · Redis · MQ</text><text x="860" y="126" font-size="10" fill="#607d8b">权威数据、缓存与事件</text><rect x="735" y="205" width="250" height="80" rx="12" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="860" y="237" font-size="15" font-weight="700">统一可观测</text><text x="860" y="261" font-size="10" fill="#607d8b">日志 · 指标 · Trace</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M180 161H219"/><path d="M370 161H409"/><path d="M665 135H729"/><path d="M665 185H700V245H729"/></g><text x="520" y="350" font-size="12" fill="#607d8b">先拆搜索、通知、文件处理等有独立资源或故障价值的能力，而不是按表拆服务</text></g></svg>
