<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc"><title id="title">接入层从模块化单体到多 BFF 的演进</title><desc id="desc">展示接入层按契约、团队、发布、容量和故障隔离需求，从单体模块演进到共享部署，再到按终端拆分，领域用例始终保持独立。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="570" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">先建立代码边界，再按真实压力拆部署边界</text><g text-anchor="middle">
<rect x="35" y="95" width="300" height="330" rx="10" fill="#fff" stroke="#607d8b"/><text x="185" y="130" font-size="18" font-weight="700">阶段一：模块化单体</text><rect x="75" y="160" width="220" height="62" rx="7" fill="#e8f5f0" stroke="#2f7d68"/><text x="185" y="186" font-size="13" font-weight="700">web-api / app-api / admin-api</text><text x="185" y="207" font-size="11">各自 DTO、Mapper、错误契约</text><rect x="75" y="247" width="220" height="62" rx="7" fill="#edf3fa" stroke="#4f7cac"/><text x="185" y="273" font-size="13" font-weight="700">application + domain</text><text x="185" y="294" font-size="11">同进程、依赖方向受控</text><rect x="75" y="334" width="220" height="55" rx="7" fill="#fff8e6"/><text x="185" y="367" font-size="12">一个部署单元 · 最低运维成本</text>
<rect x="440" y="95" width="300" height="330" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="590" y="130" font-size="18" font-weight="700">阶段二：共享 BFF</text><rect x="480" y="160" width="220" height="62" rx="7" fill="#e8f5f0" stroke="#2f7d68"/><text x="590" y="186" font-size="13" font-weight="700">一个独立 BFF 集群</text><text x="590" y="207" font-size="11">内部仍按终端模块化</text><rect x="480" y="247" width="220" height="62" rx="7" fill="#fff" stroke="#607d8b"/><text x="590" y="273" font-size="13" font-weight="700">稳定业务 API</text><text x="590" y="294" font-size="11">新增网络信任与韧性边界</text><rect x="480" y="334" width="220" height="55" rx="7" fill="#fff8e6"/><text x="590" y="367" font-size="12">独立伸缩 / 发布 / 公网隔离</text>
<rect x="845" y="95" width="300" height="330" rx="10" fill="#e8f5f0" stroke="#2f7d68"/><text x="995" y="130" font-size="18" font-weight="700">阶段三：多终端 BFF</text><rect x="885" y="158" width="220" height="50" rx="7" fill="#fff" stroke="#607d8b"/><text x="995" y="189" font-size="13" font-weight="700">Web BFF</text><rect x="885" y="225" width="220" height="50" rx="7" fill="#fff" stroke="#607d8b"/><text x="995" y="256" font-size="13" font-weight="700">App BFF</text><rect x="885" y="292" width="220" height="50" rx="7" fill="#fff" stroke="#607d8b"/><text x="995" y="323" font-size="13" font-weight="700">Admin / Partner BFF</text><rect x="885" y="359" width="220" height="35" rx="7" fill="#fff8e6"/><text x="995" y="382" font-size="11">团队与故障域真正独立</text></g>
<g stroke="#607d8b" stroke-width="3" marker-end="url(#a)"><path d="M335 260H433"/><path d="M740 260H838"/></g><text x="387" y="238" text-anchor="middle" font-size="11">需要独立发布/容量</text><text x="793" y="238" text-anchor="middle" font-size="11">终端差异持续扩大</text>
<rect x="95" y="470" width="990" height="55" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="590" y="493" text-anchor="middle" font-size="12" font-weight="700">每次拆分前都要证明：契约差异、团队所有权、发布节奏、容量或故障隔离至少一项足以抵消网络与运维成本</text><text x="590" y="514" text-anchor="middle" font-size="11">无论处于哪一阶段：BFF 不拥有领域数据库，不复制核心交易规则，命令始终进入单一明确用例</text></g></svg>
