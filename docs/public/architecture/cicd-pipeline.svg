<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="t d"><title id="t">持续交付流水线</title><desc id="d">从提交代码到构建、扫描、测试、灰度、指标验证和全量或回滚</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1120" height="420" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="560" y="42" font-size="23" font-weight="700" fill="#17342c">从代码提交到生产的可验证流水线</text><g font-size="14" font-weight="700"><g transform="translate(25 105)"><rect width="125" height="72" rx="11" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="62" y="43">Commit</text></g><g transform="translate(175 105)"><rect width="135" height="72" rx="11" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="67" y="32">编译</text><text x="67" y="52">单元测试</text></g><g transform="translate(335 105)"><rect width="145" height="72" rx="11" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="72" y="32">静态分析</text><text x="72" y="52">依赖扫描</text></g><g transform="translate(505 105)"><rect width="135" height="72" rx="11" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="67" y="32">签名制品</text><text x="67" y="52">不可变镜像</text></g><g transform="translate(665 105)"><rect width="145" height="72" rx="11" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="72" y="32">集成测试</text><text x="72" y="52">契约测试</text></g><g transform="translate(835 105)"><rect width="125" height="72" rx="11" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="62" y="32">测试环境</text><text x="62" y="52">部署验证</text></g><g transform="translate(985 105)"><rect width="110" height="72" rx="11" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="55" y="43">生产灰度</text></g></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M150 141H169"/><path d="M310 141H329"/><path d="M480 141H499"/><path d="M640 141H659"/><path d="M810 141H829"/><path d="M960 141H979"/></g><rect x="380" y="260" width="360" height="78" rx="13" fill="#fff" stroke="#3c8772" stroke-width="2"/><text x="560" y="291" font-size="16" font-weight="700">SLO 与业务指标门禁</text><text x="560" y="317" font-size="12" fill="#607d8b">错误率 · P99 · 业务成功率 · 资源饱和</text><path d="M1040 177V235Q1040 250 1025 250H746" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M560 338V380H875" fill="none" stroke="#3c8772" stroke-width="2" marker-end="url(#a)"/><path d="M560 338V380H245" fill="none" stroke="#b44c5b" stroke-width="2" marker-end="url(#a)"/><text x="890" y="385" font-size="13" fill="#2d6b59">通过：逐步全量</text><text x="230" y="385" font-size="13" fill="#913744">失败：暂停或回滚</text></g></svg>
