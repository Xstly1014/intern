<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc"><title id="title">API 网关指标、日志与 Trace 关联</title><desc id="desc">展示一个客户端请求在网关本地处理、多次上游尝试与最终响应中如何生成指标、结构化日志和 Trace</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1160" height="650" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">从原始请求到每次上游尝试，必须保留因果链</text>
  <g text-anchor="middle"><rect x="45" y="100" width="150" height="100" rx="8" fill="#fff" stroke="#607d8b"/><text x="120" y="135" font-size="15" font-weight="700">客户端</text><text x="120" y="161" font-size="11">request ID</text><text x="120" y="181" font-size="11">traceparent</text>
  <rect x="250" y="85" width="210" height="130" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="355" y="120" font-size="15" font-weight="700">网关本地处理</text><text x="355" y="147" font-size="11">路由 / 鉴权 / 限流</text><text x="355" y="169" font-size="11">本地耗时 / 策略命中</text><text x="355" y="194" font-size="11">server span</text>
  <rect x="515" y="85" width="210" height="130" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="620" y="120" font-size="15" font-weight="700">上游尝试 1</text><text x="620" y="147" font-size="11">实例 / 排队 / Connect</text><text x="620" y="169" font-size="11">status / reset / timeout</text><text x="620" y="194" font-size="11">client span #1</text>
  <rect x="780" y="85" width="210" height="130" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="885" y="120" font-size="15" font-weight="700">上游尝试 2</text><text x="885" y="147" font-size="11">剩余 deadline / 另一实例</text><text x="885" y="169" font-size="11">status / duration</text><text x="885" y="194" font-size="11">client span #2</text></g>
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M195 150H245"/><path d="M460 150H510"/><path d="M725 150H775"/><path d="M885 215V265H620"/></g>
  <rect x="250" y="265" width="740" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="620" y="297" text-anchor="middle" font-size="16" font-weight="700" fill="#315f8c">最终请求总结</text><text x="620" y="324" text-anchor="middle" font-size="12" fill="#455a64">final status · error category · attempt count · total duration · route/upstream/release/config version</text><text x="620" y="347" text-anchor="middle" font-size="11" fill="#455a64">不覆盖第一次失败，不把上游尝试当成新的客户请求</text>
  <g><rect x="45" y="415" width="320" height="155" rx="9" fill="#fff" stroke="#2f7d68"/><text x="205" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#1e6654">Metrics：聚合与告警</text><text x="75" y="482" font-size="12" fill="#455a64">• Rate：原请求 vs 上游尝试</text><text x="75" y="507" font-size="12" fill="#455a64">• Errors：本地 vs 上游原始状态</text><text x="75" y="532" font-size="12" fill="#455a64">• Duration：本地/排队/Connect/TTFB</text><text x="75" y="557" font-size="12" fill="#455a64">• 低基数 route/cluster/region 标签</text>
  <rect x="420" y="415" width="320" height="155" rx="9" fill="#fff" stroke="#4f7cac"/><text x="580" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#315f8c">Logs：精确查询与审计</text><text x="450" y="482" font-size="12" fill="#455a64">• 结构化单请求总结</text><text x="450" y="507" font-size="12" fill="#455a64">• request/trace ID 可关联</text><text x="450" y="532" font-size="12" fill="#455a64">• 凭证、Cookie、Body 不入日志</text><text x="450" y="557" font-size="12" fill="#455a64">• 有界缓冲、采样与丢弃计数</text>
  <rect x="795" y="415" width="320" height="155" rx="9" fill="#fff" stroke="#8064a2"/><text x="955" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#654b87">Trace：分布式因果</text><text x="825" y="482" font-size="12" fill="#455a64">• 网关 server span</text><text x="825" y="507" font-size="12" fill="#455a64">• 每次上游尝试独立 client span</text><text x="825" y="532" font-size="12" fill="#455a64">• deadline、错误与发布上下文</text><text x="825" y="557" font-size="12" fill="#455a64">• tail sampling 保留错误与慢请求</text></g>
  </g></svg>
