<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="t d"><title id="t">从业务用例到存储引擎的数据访问链</title><desc id="d">用例经 Repository、连接池、驱动、查询计划和数据页得到领域或投影结果。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="470" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">数据访问延迟不只有 SQL 执行时间</text><g font-size="12"><rect x="25" y="115" width="150" height="90" rx="8" fill="#fff" stroke="#607d8b"/><text x="100" y="148" font-weight="700">业务用例</text><text x="100" y="177">事务 / 一致性需求</text><rect x="205" y="115" width="160" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="285" y="148" font-weight="700">Repository / Query</text><text x="285" y="177">tenant · 参数化</text><rect x="395" y="115" width="150" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="470" y="148" font-weight="700">连接池</text><text x="470" y="177">等待 / 借出连接</text><rect x="575" y="115" width="150" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="650" y="148" font-weight="700">驱动 / 网络</text><text x="650" y="177">协议 / 传输</text><rect x="755" y="115" width="170" height="90" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="840" y="148" font-weight="700">执行计划 / 锁</text><text x="840" y="177">索引 · IO · 等待</text><rect x="955" y="115" width="200" height="90" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1055" y="148" font-weight="700">映射与结果传输</text><text x="1055" y="177">行数 · bytes · ORM</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M175 160H198"/><path d="M365 160H388"/><path d="M545 160H568"/><path d="M725 160H748"/><path d="M925 160H948"/></g><rect x="130" y="300" width="920" height="75" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="330" font-size="13" font-weight="700">端到端数据延迟 = acquire + network + execute/lock/IO + transfer + mapping</text><text x="590" y="357" font-size="11">每段分别设置预算与指标，超时取消后归还连接</text><text x="590" y="425" font-size="12" font-weight="700">结果映射为 Aggregate 或 Projection，不把 Persistence Entity 泄露到 API</text></g></svg>
