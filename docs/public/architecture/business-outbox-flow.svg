<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">Transactional Outbox 可靠发布链路</title><desc id="d">业务数据和 Outbox 同事务写入，Relay 至少一次发布，消费者通过 Inbox 与业务事务去重。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">Outbox 防止“库成功但消息未记录”</text><rect x="35" y="105" width="300" height="180" rx="10" fill="#e8f5f0" stroke="#2f7d68"/><text x="185" y="138" font-size="15" font-weight="700">生产服务本地事务</text><rect x="70" y="165" width="100" height="75" rx="7" fill="#fff" stroke="#607d8b"/><text x="120" y="197" font-size="12" font-weight="700">业务表</text><text x="120" y="220" font-size="10">状态 + version</text><rect x="200" y="165" width="100" height="75" rx="7" fill="#fff8e6" stroke="#c69a32"/><text x="250" y="197" font-size="12" font-weight="700">Outbox</text><text x="250" y="220" font-size="10">event ID</text><rect x="410" y="135" width="190" height="120" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="505" y="170" font-size="14" font-weight="700">Relay / CDC</text><text x="505" y="198" font-size="11">轮询 / 日志读取</text><text x="505" y="222" font-size="11">失败重试 · 可能重复</text><rect x="675" y="145" width="150" height="100" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="750" y="180" font-size="14" font-weight="700">Broker</text><text x="750" y="208" font-size="11">至少一次传递</text><rect x="900" y="105" width="245" height="180" rx="10" fill="#fff8e6" stroke="#c69a32"/><text x="1023" y="138" font-size="15" font-weight="700">消费者本地事务</text><text x="1023" y="177" font-size="12">Inbox / event ID 去重</text><text x="1023" y="207" font-size="12">状态机处理重复 / 乱序</text><text x="1023" y="237" font-size="12">业务效果原子提交</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M335 195H403"/><path d="M600 195H668"/><path d="M825 195H893"/></g><rect x="145" y="350" width="890" height="70" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="378" font-size="12" font-weight="700">Relay 崩溃后可重复发布，因此 event ID、aggregate version 与消费者幂等是端到端正确性的组成部分</text><text x="590" y="401" font-size="11" fill="#9a3345">Outbox 不是 exactly-once；它把不可恢复的双写窗口变成可检测、可重试的重复</text></g></svg>
