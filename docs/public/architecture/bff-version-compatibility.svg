<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc"><title id="title">BFF 客户端版本兼容策略</title><desc id="desc">展示不同代际客户端进入版本适配器，复用同一应用用例，再映射为各自稳定响应，并通过真实流量证据淘汰旧版本。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">兼容留在 API 边界，不污染领域模型</text><g text-anchor="middle">
<rect x="35" y="100" width="175" height="80" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="123" y="131" font-size="14" font-weight="700">旧 App v1</text><text x="123" y="156" font-size="12">字段少 · 枚举旧</text><rect x="35" y="220" width="175" height="80" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="123" y="251" font-size="14" font-weight="700">当前 App v2</text><text x="123" y="276" font-size="12">主维护契约</text><rect x="35" y="340" width="175" height="80" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="123" y="371" font-size="14" font-weight="700">新 App v3</text><text x="123" y="396" font-size="12">灰度新能力</text>
<rect x="310" y="75" width="260" height="370" rx="10" fill="#fff" stroke="#2f7d68" stroke-width="2"/><text x="440" y="112" font-size="17" font-weight="700">版本适配层</text><rect x="345" y="145" width="190" height="62" rx="7" fill="#fbecef"/><text x="440" y="171" font-size="13" font-weight="700">v1 Adapter</text><text x="440" y="191" font-size="11">默认值 / 枚举 fallback</text><rect x="345" y="228" width="190" height="62" rx="7" fill="#fff8e6"/><text x="440" y="254" font-size="13" font-weight="700">v2 Adapter</text><text x="440" y="274" font-size="11">当前标准契约</text><rect x="345" y="311" width="190" height="62" rx="7" fill="#edf3fa"/><text x="440" y="337" font-size="13" font-weight="700">v3 Adapter</text><text x="440" y="357" font-size="11">能力协商 / 灰度</text><text x="440" y="411" font-size="11" font-weight="700" fill="#9a3345">版本信号不参与高风险授权</text>
<rect x="680" y="128" width="205" height="125" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="783" y="163" font-size="15" font-weight="700">共享应用用例</text><text x="783" y="191" font-size="12">Command / Query</text><text x="783" y="216" font-size="12">领域规则只有一份</text><rect x="680" y="300" width="205" height="105" rx="9" fill="#f3eff8" stroke="#8064a2"/><text x="783" y="334" font-size="15" font-weight="700">契约遥测</text><text x="783" y="360" font-size="12">版本流量 · 错误 · 行为</text><text x="783" y="383" font-size="12">升级率 · 最后调用时间</text><rect x="975" y="185" width="170" height="145" rx="9" fill="#fff" stroke="#607d8b"/><text x="1060" y="219" font-size="15" font-weight="700">淘汰门</text><text x="1060" y="248" font-size="12">最低支持版本</text><text x="1060" y="273" font-size="12">调用方清单归零</text><text x="1060" y="298" font-size="12">明确升级响应</text></g>
<g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M210 140H303"/><path d="M210 260H303"/><path d="M210 380H303"/><path d="M570 190H673"/><path d="M570 342H673"/><path d="M885 352C940 352 930 258 968 258"/></g><text x="590" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#455a64">增加可选字段通常兼容，但新增枚举值、改变 null 语义或默认行为仍可能破坏旧客户端</text></g></svg>
