<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="t d"><title id="t">安全文件上传流程</title><desc id="d">客户端申请凭证、直传隔离区、校验扫描、重编码审核和 CDN 发布</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1120" height="420" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="560" y="42" font-size="23" font-weight="700" fill="#17342c">文件先隔离、检查，再进入公开分发区</text><g font-size="12"><g transform="translate(20 120)"><rect width="130" height="78" rx="10" fill="#fff" stroke="#607d8b"/><text x="65" y="34" font-weight="700">申请短期凭证</text><text x="65" y="56" font-size="10" fill="#607d8b">Key / 大小 / TTL</text></g><g transform="translate(170 120)"><rect width="130" height="78" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="65" y="34" font-weight="700">隔离 Bucket</text><text x="65" y="56" font-size="10" fill="#607d8b">客户端直传</text></g><g transform="translate(320 120)"><rect width="130" height="78" rx="10" fill="#f3eff8" stroke="#8b6fb3"/><text x="65" y="34" font-weight="700">大小 / 摘要</text><text x="65" y="56" font-size="10" fill="#607d8b">类型与完整性</text></g><g transform="translate(470 120)"><rect width="130" height="78" rx="10" fill="#fff4e8" stroke="#c07a3d"/><text x="65" y="34" font-weight="700">恶意软件</text><text x="65" y="56" font-size="10" fill="#607d8b">内容扫描</text></g><g transform="translate(620 120)"><rect width="140" height="78" rx="10" fill="#fff8e6" stroke="#cc9a2e"/><text x="70" y="31" font-weight="700">解码重编码</text><text x="70" y="52" font-size="10" fill="#607d8b">移除危险元数据</text></g><g transform="translate(780 120)"><rect width="140" height="78" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="70" y="31" font-weight="700">审核与发布</text><text x="70" y="52" font-size="10" fill="#607d8b">发布区域 / 状态</text></g><g transform="translate(940 120)"><rect width="150" height="78" rx="10" fill="#e8f5f0" stroke="#3c8772"/><text x="75" y="34" font-weight="700">CDN 分发</text><text x="75" y="56" font-size="10" fill="#607d8b">仅公开已发布对象</text></g></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M150 159H164"/><path d="M300 159H314"/><path d="M450 159H464"/><path d="M600 159H614"/><path d="M760 159H774"/><path d="M920 159H934"/></g><path d="M535 198V285" stroke="#b44c5b" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="290" width="270" height="58" rx="11" fill="#fbecef" stroke="#b44c5b"/><text x="535" y="325" font-size="13" fill="#913744">失败：隔离、删除或人工复核</text><text x="560" y="390" font-size="12" fill="#607d8b">Java API 管理授权与元数据，不转发大文件字节；文件名不直接成为公开对象 Key</text></g></svg>
