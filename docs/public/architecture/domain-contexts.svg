<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">电商领域限界上下文</title><desc id="d">商品、交易、库存、支付和履约五个上下文及其业务职责</desc><rect width="1000" height="560" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17342c">电商领域：按业务能力划分限界上下文</text><g text-anchor="middle"><g transform="translate(60 95)"><rect width="270" height="150" rx="15" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="135" y="39" font-size="18" font-weight="700">商品上下文</text><text x="135" y="72" font-size="13" fill="#607d8b">商品 · 类目 · 属性</text><text x="135" y="99" font-size="13" fill="#607d8b">上下架 · 展示信息</text></g><g transform="translate(365 95)"><rect width="270" height="150" rx="15" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="135" y="39" font-size="18" font-weight="700">交易上下文</text><text x="135" y="72" font-size="13" fill="#607d8b">购物车 · 价格快照</text><text x="135" y="99" font-size="13" fill="#607d8b">订单状态 · 取消规则</text></g><g transform="translate(670 95)"><rect width="270" height="150" rx="15" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="135" y="39" font-size="18" font-weight="700">库存上下文</text><text x="135" y="72" font-size="13" fill="#607d8b">可售 · 预占</text><text x="135" y="99" font-size="13" fill="#607d8b">扣减 · 释放</text></g><g transform="translate(210 310)"><rect width="270" height="150" rx="15" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="135" y="39" font-size="18" font-weight="700">支付上下文</text><text x="135" y="72" font-size="13" fill="#607d8b">支付单 · 渠道</text><text x="135" y="99" font-size="13" fill="#607d8b">退款 · 对账</text></g><g transform="translate(520 310)"><rect width="270" height="150" rx="15" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="135" y="39" font-size="18" font-weight="700">履约上下文</text><text x="135" y="72" font-size="13" fill="#607d8b">出库 · 配送</text><text x="135" y="99" font-size="13" fill="#607d8b">签收 · 售后</text></g></g><text x="500" y="520" text-anchor="middle" font-size="12" fill="#607d8b">每个上下文拥有自己的业务语言、规则和数据写入权，通过 API 或事件协作</text></g></svg>
