<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="t d"><title id="t">MVCC 快照版本与可见性</title><desc id="d">读事务按快照看到旧行版本，写事务生成新版本，长事务阻止旧版本清理。</desc><rect width="1180" height="470" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">MVCC 减少读写互阻，但旧版本不是免费保存</text><path d="M100 230H1080" stroke="#607d8b" stroke-width="3"/><g text-anchor="middle"><circle cx="220" cy="230" r="12" fill="#4f7cac"/><text x="220" y="190" font-size="13" font-weight="700">T1 读快照</text><text x="220" y="275" font-size="11">看到 row v1</text><circle cx="500" cy="230" r="12" fill="#c69a32"/><text x="500" y="190" font-size="13" font-weight="700">T2 更新提交</text><text x="500" y="275" font-size="11">生成 row v2</text><circle cx="760" cy="230" r="12" fill="#2f7d68"/><text x="760" y="190" font-size="13" font-weight="700">新事务读取</text><text x="760" y="275" font-size="11">看到 row v2</text><circle cx="1000" cy="230" r="12" fill="#b44c5b"/><text x="1000" y="190" font-size="13" font-weight="700">T1 仍未结束</text><text x="1000" y="275" font-size="11">v1 不能清理</text></g><rect x="145" y="330" width="890" height="65" rx="8" fill="#fbecef"/><text x="590" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3345">长事务/旧快照 → Undo 或 dead tuples 增长 → 清理受阻 → IO、磁盘和复制压力上升</text><text x="590" y="380" text-anchor="middle" font-size="11">MVCC 不消除写写冲突、唯一约束、范围锁和写偏差</text><text x="590" y="435" text-anchor="middle" font-size="12">可见性规则与快照时机以目标数据库和隔离级别为准</text></g></svg>
