<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">密钥版本发布与无中断轮换</title><desc id="d">验证方先信任新旧版本，签发方再切换新版本，观察旧版本使用归零后才撤销旧密钥。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">无中断轮换：先扩展信任，再切换签发，最后收缩</text><g text-anchor="middle"><rect x="30" y="125" width="180" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="120" y="158" font-size="14" font-weight="700">1 生成新版本 K2</text><text x="120" y="186" font-size="11">K1 仍活跃</text><text x="120" y="208" font-size="11">记录 owner / usage</text><rect x="250" y="125" width="190" height="110" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="345" y="158" font-size="14" font-weight="700">2 发布验证信任</text><text x="345" y="186" font-size="11">验证方接受 K1 + K2</text><text x="345" y="208" font-size="11">缓存/JWK/CA 灰度</text><rect x="480" y="125" width="190" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="575" y="158" font-size="14" font-weight="700">3 切换签发/写入</text><text x="575" y="186" font-size="11">新 Token/密文使用 K2</text><text x="575" y="208" font-size="11">保留读取 K1</text><rect x="710" y="125" width="190" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="805" y="158" font-size="14" font-weight="700">4 观察与迁移</text><text x="805" y="186" font-size="11">等待最大寿命/缓存</text><text x="805" y="208" font-size="11">渐进重加密</text><rect x="940" y="125" width="210" height="110" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1045" y="158" font-size="14" font-weight="700">5 撤销旧版本 K1</text><text x="1045" y="186" font-size="11">旧使用归零并告警</text><text x="1045" y="208" font-size="11">保留审计 / 回滚窗口</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M210 180H243"/><path d="M440 180H473"/><path d="M670 180H703"/><path d="M900 180H933"/></g><rect x="155" y="315" width="870" height="80" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="345" text-anchor="middle" font-size="13" font-weight="700">Token 签名密钥：等待最大 Token + JWK 缓存寿命；数据加密密钥：旧密文未迁移前不能删除旧 KEK</text><text x="590" y="374" text-anchor="middle" font-size="11" fill="#9a3345">轮换不是“生成一个新 Secret”，必须覆盖全部使用方、观察、撤销、异常回滚和紧急泄露流程</text><text x="590" y="450" text-anchor="middle" font-size="12" font-weight="700">证书、数据库密码、第三方 Key 和云权限都应有同样的版本生命周期</text></g></svg>
