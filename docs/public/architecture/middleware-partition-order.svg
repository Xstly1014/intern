<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">Partition Key 与局部顺序</title><desc id="d">相同业务 Key 路由同一分区保持局部顺序，不同分区并行。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="430" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">Partition Key 与局部顺序</text><rect x="30" y="120" width="361" height="120" rx="8" fill="#edf3fa" stroke="#607d8b"/><text x="210.5" y="158" text-anchor="middle" font-size="14" font-weight="700">order-1</text><text x="210.5" y="186" text-anchor="middle" font-size="11" font-weight="400">P0: v1 → v2 → v3</text><rect x="409" y="120" width="361" height="120" rx="8" fill="#e8f5f0" stroke="#607d8b"/><text x="589.5" y="158" text-anchor="middle" font-size="14" font-weight="700">order-2</text><text x="589.5" y="186" text-anchor="middle" font-size="11" font-weight="400">P1: v1 → v2</text><rect x="788" y="120" width="361" height="120" rx="8" fill="#fff8e6" stroke="#607d8b"/><text x="968.5" y="158" text-anchor="middle" font-size="14" font-weight="700">hot tenant</text><text x="968.5" y="186" text-anchor="middle" font-size="11" font-weight="400">P2: 倾斜</text><path d="M391 180H402" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M770 180H781" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="310" width="980" height="62" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="348" text-anchor="middle" font-size="12" font-weight="700">顺序范围、并行度和热点由 Key 同时决定</text></g></svg>
