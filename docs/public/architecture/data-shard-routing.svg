<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">分片键路由与热点分布</title><desc id="d">路由层用租户或业务键映射虚拟分片，再映射物理分片；大租户可迁移到专属分片。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">分片键应让主要请求在单分片完成</text><rect x="40" y="120" width="220" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="150" y="155" font-size="15" font-weight="700">请求</text><text x="150" y="185" font-size="11">tenantId + resourceId</text><text x="150" y="207" font-size="11">无 Key 查询受限</text><rect x="350" y="105" width="260" height="140" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="480" y="140" font-size="15" font-weight="700">版本化路由目录</text><text x="480" y="170" font-size="11">tenant → virtual shard</text><text x="480" y="195" font-size="11">virtual → physical shard</text><text x="480" y="220" font-size="11">迁移状态 / 唯一写主</text><g><rect x="730" y="70" width="180" height="90" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="820" y="105" font-size="14" font-weight="700">Shard A</text><text x="820" y="132" font-size="11">v0-v31</text><rect x="730" y="190" width="180" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="820" y="225" font-size="14" font-weight="700">Shard B</text><text x="820" y="252" font-size="11">v32-v63</text><rect x="730" y="310" width="180" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="820" y="345" font-size="14" font-weight="700">Shard C</text><text x="820" y="372" font-size="11">v64-v95</text><rect x="970" y="190" width="180" height="90" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1060" y="225" font-size="14" font-weight="700">大租户专属</text><text x="1060" y="252" font-size="11">避免热点邻居</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M260 175H343"/><path d="M610 155L723 115"/><path d="M610 175L723 235"/><path d="M610 195L723 355"/><path d="M910 235H963"/></g><text x="480" y="365" font-size="11" fill="#9a3345">fan-out：并发、timeout、Top-K 合并和结果上限</text><text x="590" y="455" font-size="12" font-weight="700">再均衡通过虚拟分片、增量同步、校验和切唯一写主完成，不做无协议双写</text></g></svg>
