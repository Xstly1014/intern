<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" role="img" aria-labelledby="t d"><title id="t">DTO、命令、领域模型与响应映射</title><desc id="d">展示不可信请求 DTO 经白名单映射为用例命令，进入领域模型与持久化，再映射为终端响应</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1160" height="580" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">协议、用例、领域与持久化可以独立演进</text><g text-anchor="middle"><rect x="35" y="115" width="180" height="130" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="125" y="150" font-size="16" font-weight="700">Request DTO</text><text x="125" y="178" font-size="11">不可信、兼容导向</text><text x="125" y="202" font-size="11">JSON / Header / App 版本</text><rect x="270" y="95" width="190" height="170" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="365" y="132" font-size="16" font-weight="700">白名单 API Mapper</text><text x="365" y="160" font-size="11">只复制允许字段</text><text x="365" y="184" font-size="11">主体 / 租户来自 Context</text><text x="365" y="208" font-size="11">价格 / 状态不从 Body 取</text><text x="365" y="242" font-size="11" fill="#1e6654">未映射新字段应报错</text><rect x="515" y="115" width="180" height="130" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="605" y="150" font-size="16" font-weight="700">Command / Query</text><text x="605" y="178" font-size="11">业务意图、强类型</text><text x="605" y="202" font-size="11">无 Servlet / JSON 注解</text><rect x="750" y="115" width="180" height="130" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="840" y="150" font-size="16" font-weight="700">领域模型</text><text x="840" y="178" font-size="11">授权 / 不变量</text><text x="840" y="202" font-size="11">行为改变状态</text><rect x="985" y="115" width="140" height="130" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="1055" y="150" font-size="16" font-weight="700">持久化</text><text x="1055" y="178" font-size="11">Entity / Row</text><text x="1055" y="202" font-size="11">索引 / 迁移</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M215 180H265"/><path d="M460 180H510"/><path d="M695 180H745"/><path d="M930 180H980"/></g><path d="M840 245V330H365" stroke="#607d8b" stroke-width="2" marker-end="url(#a)" fill="none"/><g text-anchor="middle"><rect x="270" y="330" width="190" height="130" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="365" y="365" font-size="16" font-weight="700">Response Mapper</text><text x="365" y="393" font-size="11">字段级白名单</text><text x="365" y="417" font-size="11">格式化 / 终端兼容</text><text x="365" y="441" font-size="11">不直接序列化 Entity</text><rect x="35" y="330" width="180" height="130" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="125" y="365" font-size="16" font-weight="700">Response DTO</text><text x="125" y="393" font-size="11">终端展示模型</text><text x="125" y="417" font-size="11">权限裁剪 / 稳定契约</text></g><path d="M270 395H220" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="330" width="530" height="130" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="825" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#355c51">直接暴露 Entity 的代价</text><text x="590" y="395" font-size="12" fill="#455a64">• Mass Assignment：客户端修改 status / price / owner</text><text x="590" y="422" font-size="12" fill="#455a64">• 懒加载 N+1、循环序列化、内部字段泄露、表结构绑定公网契约</text></g></svg>
