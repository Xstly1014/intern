<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="t d"><title id="t">客户端直传对象存储并安全发布</title><desc id="d">客户端向 API 申请上传会话，分片直传隔离存储，服务完成校验扫描后发布 CDN</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1080" height="470" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="540" y="42" font-size="23" font-weight="700" fill="#17342c">大文件绕过 Java 字节转发，状态仍由业务服务管理</text><rect x="45" y="155" width="150" height="82" rx="12" fill="#fff" stroke="#607d8b" stroke-width="2"/><text x="120" y="188" font-size="16" font-weight="700">Client</text><text x="120" y="213" font-size="10" fill="#607d8b">分片 / 摘要 / 重试</text><rect x="270" y="105" width="180" height="82" rx="12" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="360" y="136" font-size="16" font-weight="700">Upload API</text><text x="360" y="161" font-size="10" fill="#607d8b">短期签名 · Key · 规则</text><rect x="270" y="255" width="180" height="82" rx="12" fill="#f3eff8" stroke="#8b6fb3" stroke-width="2"/><text x="360" y="286" font-size="16" font-weight="700">完成 API</text><text x="360" y="311" font-size="10" fill="#607d8b">记录状态 · 触发处理</text><rect x="535" y="130" width="190" height="132" rx="14" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="630" y="164" font-size="16" font-weight="700">隔离对象存储</text><text x="630" y="192" font-size="11">分片直传</text><text x="630" y="218" font-size="10" fill="#607d8b">尚不可公开访问</text><rect x="790" y="105" width="230" height="182" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="905" y="140" font-size="16" font-weight="700">异步安全处理</text><text x="905" y="170" font-size="11">摘要 / 大小 / 扫描</text><text x="905" y="194" font-size="11">审核 / 重编码</text><text x="905" y="226" font-size="10" fill="#607d8b">发布 Bucket / 状态</text><text x="905" y="250" font-size="10" fill="#607d8b">CDN 分发</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M195 175H264V146"/><path d="M450 146H529"/><path d="M195 217H240Q250 217 250 235V296H264"/><path d="M450 296H740Q760 296 760 276V230H784"/><path d="M725 196H784"/></g><text x="540" y="410" font-size="12" fill="#607d8b">上传凭证限制对象前缀、单文件大小、Content-Type 与有效期；公开域只分发处理完成的对象</text></g></svg>
