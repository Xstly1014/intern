<g aria-label="架构约束"><rect x="30" y="75" width="185" height="100" rx="8" fill="#eef2f4" stroke="#34444d" stroke-width="2"/><text x="122.5" y="103" class="node-title" text-anchor="middle">架构约束</text><text x="122.5" y="127" class="node-sub" text-anchor="middle">模块依赖 · 数据权威</text><text x="122.5" y="146" class="node-sub" text-anchor="middle">兼容窗口 · 安全基线</text><text x="122.5" y="165" class="node-sub" text-anchor="middle">SLO · 成本上限</text></g>
<g aria-label="代码与构建"><rect x="265" y="45" width="170" height="82" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="350" y="73" class="node-title" text-anchor="middle">代码与构建</text><text x="350" y="97" class="node-sub" text-anchor="middle">ArchUnit · 依赖锁定</text><text x="350" y="116" class="node-sub" text-anchor="middle">SBOM/签名/策略</text></g>
<g aria-label="契约与数据"><rect x="265" y="155" width="170" height="82" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="350" y="183" class="node-title" text-anchor="middle">契约与数据</text><text x="350" y="207" class="node-sub" text-anchor="middle">API/事件契约测试</text><text x="350" y="226" class="node-sub" text-anchor="middle">Schema/跨域写检查</text></g>
