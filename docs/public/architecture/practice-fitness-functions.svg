<g aria-label="生产行为"><rect x="485" y="155" width="170" height="82" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="570" y="183" class="node-title" text-anchor="middle">生产行为</text><text x="570" y="207" class="node-sub" text-anchor="middle">尾延迟/错误预算</text><text x="570" y="226" class="node-sub" text-anchor="middle">数据新鲜度/单位成本</text></g>
