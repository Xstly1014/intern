<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">从认证到资源授权和审计的请求链</title><desc id="d">一次受保护请求经过凭证取得、Token 验证、上下文建立、对象授权、租户过滤和审计记录。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">受保护请求的信任链</text><g text-anchor="middle"><rect x="30" y="105" width="150" height="105" rx="8" fill="#fff" stroke="#607d8b"/><text x="105" y="138" font-size="14" font-weight="700">1 客户端</text><text x="105" y="165" font-size="11">取得短期凭证</text><text x="105" y="187" font-size="11">PKCE / 安全存储</text><rect x="220" y="105" width="150" height="105" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="295" y="138" font-size="14" font-weight="700">2 网关</text><text x="295" y="165" font-size="11">签名 / iss / aud</text><text x="295" y="187" font-size="11">Scope / 有效期</text><rect x="410" y="105" width="150" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="485" y="138" font-size="14" font-weight="700">3 BFF</text><text x="485" y="165" font-size="11">可信 RequestContext</text><text x="485" y="187" font-size="11">actor / subject / tenant</text><rect x="600" y="105" width="150" height="105" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="675" y="138" font-size="14" font-weight="700">4 资源服务</text><text x="675" y="165" font-size="11">对象关系 / 状态</text><text x="675" y="187" font-size="11">最终授权</text><rect x="790" y="105" width="150" height="105" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="865" y="138" font-size="14" font-weight="700">5 数据访问</text><text x="865" y="165" font-size="11">tenant + resource</text><text x="865" y="187" font-size="11">查询时过滤</text><rect x="980" y="105" width="170" height="105" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1065" y="138" font-size="14" font-weight="700">6 审计 / 检测</text><text x="1065" y="165" font-size="11">决策与业务结果</text><text x="1065" y="187" font-size="11">异常关联</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M180 157H213"/><path d="M370 157H403"/><path d="M560 157H593"/><path d="M750 157H783"/><path d="M940 157H973"/></g><rect x="105" y="290" width="970" height="90" rx="9" fill="#fff" stroke="#a5b8b2"/><text x="590" y="322" text-anchor="middle" font-size="14" font-weight="700">每一跳同时保留：直接调用 workload + 被代表 subject + tenant + trace/deadline</text><text x="590" y="350" text-anchor="middle" font-size="12">身份冲突、上下文缺失、策略未知、租户不匹配或验证失败均默认拒绝</text><text x="590" y="435" text-anchor="middle" font-size="12" font-weight="700">网关只做粗粒度准入；拥有资源事实的服务承担最终授权责任</text></g></svg>
