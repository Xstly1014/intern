<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" role="img" aria-labelledby="t d"><title id="t">静态资源版本化发布与回滚</title><desc id="d">HTML 短缓存引用内容哈希资源，图片按版本尺寸缓存，发布先资源后 HTML，回滚指向旧哈希</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1020" height="530" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="510" y="42" font-size="23" font-weight="700" fill="#17342c">URL 随内容变化，发布不依赖全站 Purge</text><rect x="65" y="100" width="250" height="120" rx="14" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="190" y="135" font-size="16" font-weight="700">HTML</text><text x="190" y="164" font-size="12">短 TTL</text><text x="190" y="188" font-size="10" fill="#607d8b">stale-while-revalidate</text><rect x="385" y="80" width="280" height="160" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="525" y="115" font-size="16" font-weight="700">内容哈希资源</text><text x="525" y="146" font-size="12">app.a83f.js</text><text x="525" y="170" font-size="12">style.19bc.css</text><text x="525" y="204" font-size="10" fill="#607d8b">long TTL + immutable</text><rect x="735" y="100" width="220" height="120" rx="14" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="845" y="135" font-size="16" font-weight="700">图片衍生资源</text><text x="845" y="164" font-size="11">id / version / size.webp</text><text x="845" y="188" font-size="10" fill="#607d8b">CDN 转换 + 长 TTL</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M315 160H379"/><path d="M665 160H729"/></g><rect x="80" y="315" width="860" height="130" rx="14" fill="#fff" stroke="#8b6fb3" stroke-width="2"/><text x="510" y="345" font-size="16" font-weight="700">安全发布顺序</text><text x="510" y="377" font-size="12">1. 上传新哈希资源 → 2. 验证可访问 → 3. 发布引用新哈希的 HTML</text><text x="510" y="407" font-size="12">回滚：HTML 重新指向旧哈希；旧资源在兼容窗口内始终保留</text><text x="510" y="485" font-size="12" fill="#607d8b">同一个 URL 的内容保持不可变，客户端和全球 PoP 不需要同步清除才能保证版本正确</text></g></svg>
