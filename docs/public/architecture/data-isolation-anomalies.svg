<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">隔离级别与并发异常</title><desc id="d">两个事务交错可能造成不可重复读、丢失更新和写偏差，需要约束、版本、锁或串行化。</desc><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">先画事务交错，再选择隔离与原子机制</text><g text-anchor="middle"><text x="300" y="95" font-size="15" font-weight="700">事务 A</text><text x="880" y="95" font-size="15" font-weight="700">事务 B</text></g><g stroke="#a5b8b2" stroke-width="2"><path d="M300 110V400"/><path d="M880 110V400"/></g><g font-size="12"><rect x="170" y="130" width="260" height="45" rx="6" fill="#edf3fa"/><text x="300" y="158" text-anchor="middle">读余额 100</text><rect x="750" y="190" width="260" height="45" rx="6" fill="#e8f5f0"/><text x="880" y="218" text-anchor="middle">读余额 100</text><rect x="170" y="250" width="260" height="45" rx="6" fill="#fff8e6"/><text x="300" y="278" text-anchor="middle">写余额 80</text><rect x="750" y="310" width="260" height="45" rx="6" fill="#fbecef"/><text x="880" y="338" text-anchor="middle">写余额 70（覆盖 A）</text></g><text x="590" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3345">丢失更新</text><rect x="160" y="420" width="860" height="45" rx="7" fill="#fff" stroke="#607d8b"/><text x="590" y="448" text-anchor="middle" font-size="12" font-weight="700">version/CAS、SELECT FOR UPDATE 或原子条件更新决定唯一胜者；仅提高隔离名不一定足够</text></g></svg>
