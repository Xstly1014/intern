<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">工作队列、发布订阅与分区日志</title><desc id="d">工作队列竞争处理，发布订阅复制给订阅方，分区日志由消费组维护进度。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="430" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">工作队列、发布订阅与分区日志</text><rect x="30" y="120" width="361" height="120" rx="8" fill="#edf3fa" stroke="#607d8b"/><text x="210.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Work Queue</text><text x="210.5" y="186" text-anchor="middle" font-size="11" font-weight="400">一条任务一个 Worker</text><rect x="409" y="120" width="361" height="120" rx="8" fill="#e8f5f0" stroke="#607d8b"/><text x="589.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Pub/Sub</text><text x="589.5" y="186" text-anchor="middle" font-size="11" font-weight="400">每订阅方一份</text><rect x="788" y="120" width="361" height="120" rx="8" fill="#fff8e6" stroke="#607d8b"/><text x="968.5" y="158" text-anchor="middle" font-size="14" font-weight="700">Partitioned Log</text><text x="968.5" y="186" text-anchor="middle" font-size="11" font-weight="400">保留 + offset + 回放</text><path d="M391 180H402" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M770 180H781" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="310" width="980" height="62" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="348" text-anchor="middle" font-size="12" font-weight="700">先定义消费所有权与保留语义，再选择产品</text></g></svg>
