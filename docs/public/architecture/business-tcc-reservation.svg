<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">TCC Try Confirm Cancel 资源预留</title><desc id="d">Try 创建带过期时间的预留，Confirm 消费，Cancel 释放，并处理重复、空回滚和悬挂。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">TCC 由资源服务拥有预留状态机</text><rect x="80" y="125" width="230" height="120" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="195" y="160" font-size="16" font-weight="700">Try</text><text x="195" y="190" font-size="12">创建 reservation + expiry</text><text x="195" y="215" font-size="11">检查并冻结可用资源</text><rect x="475" y="125" width="230" height="120" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="590" y="160" font-size="16" font-weight="700">Confirm</text><text x="590" y="190" font-size="12">消费有效 reservation</text><text x="590" y="215" font-size="11">重复确认返回原结果</text><rect x="870" y="125" width="230" height="120" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="985" y="160" font-size="16" font-weight="700">Cancel</text><text x="985" y="190" font-size="12">释放 reservation</text><text x="985" y="215" font-size="11">重复取消返回原结果</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M310 185H468"/><path d="M310 220C470 320 790 320 870 220"/></g><text x="390" y="171" font-size="11">全流程成功</text><text x="590" y="302" font-size="11">失败 / 超时</text><rect x="140" y="355" width="900" height="70" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="590" y="382" font-size="12" font-weight="700">必须处理：空回滚（Cancel 先到）· 悬挂（Cancel 后迟到 Try）· 重复 Confirm/Cancel · 预留过期</text><text x="590" y="405" font-size="11">reservation ID + 状态 + version 是权威事实，不能靠请求顺序假设</text></g></svg>
