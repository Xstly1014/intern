<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="t d"><title id="t">接入层与 BFF 运行时边界</title><desc id="d">展示终端、网关、BFF、业务用例与数据层的职责边界</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1160" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">终端契约可快变，领域不变量必须稳定</text><g text-anchor="middle"><rect x="30" y="105" width="170" height="130" rx="8" fill="#fff" stroke="#607d8b"/><text x="115" y="140" font-size="16" font-weight="700">终端</text><text x="115" y="168" font-size="12">Web / App / Admin</text><text x="115" y="192" font-size="11">页面、弱网、版本</text><rect x="240" y="105" width="170" height="130" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="325" y="140" font-size="16" font-weight="700">API 网关</text><text x="325" y="168" font-size="12">路由 / 凭证初检</text><text x="325" y="192" font-size="11">配额、灰度、上游保护</text><rect x="450" y="80" width="260" height="180" rx="8" fill="#e8f5f0" stroke="#2f7d68" stroke-width="3"/><text x="580" y="118" font-size="18" font-weight="700" fill="#1e6654">接入层 / BFF</text><text x="580" y="150" font-size="12">契约 / 校验 / 规范化</text><text x="580" y="174" font-size="12">DTO 映射 / 查询聚合</text><text x="580" y="198" font-size="12">终端兼容 / 错误契约</text><text x="580" y="230" font-size="11" fill="#1e6654">不拥有领域数据与交易规则</text><rect x="750" y="105" width="180" height="130" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="840" y="140" font-size="16" font-weight="700">业务用例</text><text x="840" y="168" font-size="12">授权 / 不变量</text><text x="840" y="192" font-size="11">幂等、状态机、事务</text><rect x="970" y="105" width="160" height="130" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="1050" y="140" font-size="16" font-weight="700">数据层</text><text x="1050" y="168" font-size="12">领域事实</text><text x="1050" y="192" font-size="11">数据所有权</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M200 170H235"/><path d="M410 170H445"/><path d="M710 170H745"/><path d="M930 170H965"/></g><g><rect x="80" y="330" width="280" height="105" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="220" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#355c51">网关回答</text><text x="105" y="392" font-size="12" fill="#455a64">请求去哪里，能否进入，流量如何治理</text><rect x="440" y="330" width="280" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="580" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#1e6654">BFF 回答</text><text x="465" y="392" font-size="12" fill="#455a64">终端传了什么，如何转用例，页面需要什么</text><rect x="800" y="330" width="280" height="105" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="940" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#355c51">业务层回答</text><text x="825" y="392" font-size="12" fill="#455a64">当前主体能否操作，状态如何改变</text></g></g></svg>
