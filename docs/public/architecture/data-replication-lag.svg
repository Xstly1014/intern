<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-labelledby="t d"><title id="t">主库提交复制日志与副本可见性</title><desc id="d">主库提交后生成日志，副本异步接收和重放，副本可见时间晚于客户端收到提交成功。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="460" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">主库提交成功不等于副本立即可见</text><rect x="55" y="120" width="220" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="165" y="155" font-size="14" font-weight="700">客户端写入</text><text x="165" y="185" font-size="11">收到 commit success</text><rect x="355" y="105" width="230" height="130" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="470" y="140" font-size="15" font-weight="700">Primary</text><text x="470" y="170" font-size="11">事务提交 · 产生 WAL/binlog</text><text x="470" y="198" font-size="11">LSN / GTID = 842</text><rect x="680" y="105" width="180" height="130" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="770" y="140" font-size="15" font-weight="700">复制链路</text><text x="770" y="170" font-size="11">发送 · 网络 · 队列</text><text x="770" y="198" font-size="11">可能积压</text><rect x="955" y="105" width="190" height="130" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="1050" y="140" font-size="15" font-weight="700">Replica</text><text x="1050" y="170" font-size="11">接收并重放</text><text x="1050" y="198" font-size="11">达到 842 后才可见</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M275 170H348"/><path d="M585 170H673"/><path d="M860 170H948"/></g><path d="M470 275H1050" stroke="#b44c5b" stroke-width="5"/><text x="760" y="305" font-size="12" font-weight="700" fill="#9a3345">replication lag = 传输 + 排队 + 重放时间</text><text x="590" y="390" font-size="12">长事务、大 DDL、IO 饱和和热点写入都会扩大延迟</text><text x="590" y="425" font-size="12" font-weight="700">需要当前事实的授权、状态与幂等查询不能无条件读副本</text></g></svg>
