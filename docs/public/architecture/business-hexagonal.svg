<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" role="img" aria-labelledby="t d"><title id="t">业务服务端口与适配器结构</title><desc id="d">HTTP、消息和任务通过入站适配器调用应用用例，领域通过出站端口使用数据库、Broker 与供应商。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="540" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">依赖向内，技术细节通过端口接入</text><rect x="40" y="110" width="190" height="90" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="135" y="145" font-size="14" font-weight="700">HTTP / gRPC</text><text x="135" y="174" font-size="11">入站适配器</text><rect x="40" y="250" width="190" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="135" y="285" font-size="14" font-weight="700">Message / Job</text><text x="135" y="314" font-size="11">入站适配器</text><rect x="320" y="90" width="540" height="300" rx="16" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="590" y="125" font-size="17" font-weight="700">Application</text><text x="590" y="154" font-size="12">Command / Query · 用例编排 · 事务 · 授权</text><rect x="410" y="190" width="360" height="140" rx="12" fill="#fff8e6" stroke="#c69a32"/><text x="590" y="228" font-size="17" font-weight="700">Domain</text><text x="590" y="260" font-size="12">Aggregate · Value Object · Policy</text><text x="590" y="290" font-size="12">状态机 · 不变量 · 领域事件</text><rect x="950" y="80" width="190" height="90" rx="8" fill="#fff" stroke="#607d8b"/><text x="1045" y="115" font-size="14" font-weight="700">DB / Cache</text><text x="1045" y="144" font-size="11">Repository Adapter</text><rect x="950" y="215" width="190" height="90" rx="8" fill="#fff" stroke="#607d8b"/><text x="1045" y="250" font-size="14" font-weight="700">Broker</text><text x="1045" y="279" font-size="11">Outbox Adapter</text><rect x="950" y="350" width="190" height="90" rx="8" fill="#fff" stroke="#607d8b"/><text x="1045" y="385" font-size="14" font-weight="700">供应商 API</text><text x="1045" y="414" font-size="11">ACL Adapter</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M230 155H313"/><path d="M230 295H313"/><path d="M860 130H943"/><path d="M860 260H943"/><path d="M860 365H943"/></g><text x="590" y="480" font-size="12" font-weight="700">领域层不知道 Spring、JPA、Kafka 或供应商 SDK；适配器不知道业务是否允许</text></g></svg>
