<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">应用实例连接池与数据库总预算</title><desc id="d">多个在线实例、滚动发布、任务和运维连接共享数据库的安全连接上限。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="480" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">连接池按数据库承载能力分配，不按线程数膨胀</text><g><rect x="45" y="100" width="210" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="150" y="135" font-size="14" font-weight="700">在线实例 × N</text><text x="150" y="165" font-size="11">每实例 maxPool</text><rect x="45" y="245" width="210" height="95" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="150" y="280" font-size="14" font-weight="700">发布 / 故障重叠</text><text x="150" y="310" font-size="11">新旧 Pod 同时存在</text><rect x="340" y="100" width="210" height="95" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="445" y="135" font-size="14" font-weight="700">后台任务 / 迁移</text><text x="445" y="165" font-size="11">批处理独立配额</text><rect x="340" y="245" width="210" height="95" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="445" y="280" font-size="14" font-weight="700">管理 / 监控</text><text x="445" y="310" font-size="11">预留应急连接</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M255 147H640"/><path d="M255 292H640"/><path d="M550 147H640"/><path d="M550 292H640"/></g><rect x="650" y="100" width="470" height="240" rx="12" fill="#fbecef" stroke="#b44c5b"/><text x="885" y="140" font-size="18" font-weight="700">数据库安全并发预算</text><text x="885" y="185" font-size="13">active query 受 CPU / IO / 锁 / 内存约束</text><text x="885" y="225" font-size="13">总配置连接 ≤ 安全上限 - 运维余量</text><text x="885" y="270" font-size="12">池过大：排队从应用转移到数据库，延迟和死锁上升</text><text x="590" y="415" font-size="12" font-weight="700">监控 acquire time 与 pending；应用扩容必须同步收缩单实例连接上限</text></g></svg>
