<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 550" role="img" aria-labelledby="t d"><title id="t">订单 Saga 状态、补偿与人工处理</title><desc id="d">订单流程依次预留库存和授权支付，失败时补偿，补偿失败进入人工处理。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="550" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">Saga 将中间态、超时和补偿变成持久业务状态</text><g><rect x="30" y="105" width="170" height="80" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="115" y="137" font-size="13" font-weight="700">订单待确认</text><text x="115" y="162" font-size="11">saga CREATED</text><rect x="250" y="105" width="170" height="80" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="335" y="137" font-size="13" font-weight="700">库存已预留</text><text x="335" y="162" font-size="11">RESERVED</text><rect x="470" y="105" width="170" height="80" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="555" y="137" font-size="13" font-weight="700">支付已授权</text><text x="555" y="162" font-size="11">AUTHORIZED</text><rect x="690" y="105" width="170" height="80" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="775" y="137" font-size="13" font-weight="700">订单已确认</text><text x="775" y="162" font-size="11">COMPLETED</text><rect x="250" y="310" width="170" height="80" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="335" y="342" font-size="13" font-weight="700">释放库存</text><text x="335" y="367" font-size="11">补偿也需幂等</text><rect x="470" y="310" width="170" height="80" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="555" y="342" font-size="13" font-weight="700">撤销 / 退款</text><text x="555" y="367" font-size="11">新的业务动作</text><rect x="900" y="250" width="230" height="120" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1015" y="285" font-size="14" font-weight="700">NEEDS_ATTENTION</text><text x="1015" y="313" font-size="11">补偿失败 / 未知结果</text><text x="1015" y="338" font-size="11">工单 + 证据 + 安全修复命令</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M200 145H243"/><path d="M420 145H463"/><path d="M640 145H683"/><path d="M555 185V303"/><path d="M470 350H427"/><path d="M640 350H893"/></g><g font-size="10"><text x="230" y="132">Reserve</text><text x="450" y="132">Authorize</text><text x="670" y="132">Confirm</text><text x="580" y="250">失败/超时</text></g><text x="590" y="480" font-size="12" font-weight="700">每一步保存 attempt、deadline、结果、版本与下一动作；进程重启可恢复</text></g></svg>
