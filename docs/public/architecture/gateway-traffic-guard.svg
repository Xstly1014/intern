<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc"><title id="title">API 网关分层流控与过载保护</title><desc id="desc">展示全局、路由、租户、用户的分层配额，以及并发隔离、有界排队与上游容量保护</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1160" height="650" rx="18" fill="#f7faf9"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">分层流控：先保护物理容量，再保护租户公平性</text>
    <g text-anchor="middle"><rect x="35" y="105" width="155" height="100" rx="8" fill="#fff" stroke="#607d8b"/><text x="112" y="142" font-size="15" font-weight="700">入口流量</text><text x="112" y="169" font-size="11">正常 + 突发 + 攻击</text><text x="112" y="190" font-size="11">多租户共享</text>
      <rect x="235" y="90" width="170" height="130" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="320" y="123" font-size="15" font-weight="700">全局硬上限</text><text x="320" y="150" font-size="11">RPS / 连接 / 带宽</text><text x="320" y="172" font-size="11">CPU / 内存 / 新建连接</text><text x="320" y="198" font-size="11" fill="#9b3544">保护网关自身</text>
      <rect x="450" y="90" width="170" height="130" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="535" y="123" font-size="15" font-weight="700">路由 / 上游</text><text x="535" y="150" font-size="11">订单写入 / 查询</text><text x="535" y="172" font-size="11">并发 + RPS + 优先级</text><text x="535" y="198" font-size="11" fill="#7a571d">保护上游容量</text>
      <rect x="665" y="90" width="170" height="130" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="750" y="123" font-size="15" font-weight="700">租户 / 应用</text><text x="750" y="150" font-size="11">套餐配额 / 长周期用量</text><text x="750" y="172" font-size="11">保留容量 / 突发桶</text><text x="750" y="198" font-size="11" fill="#1e6654">保护租户公平</text>
      <rect x="880" y="90" width="170" height="130" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="965" y="123" font-size="15" font-weight="700">用户 / 操作</text><text x="965" y="150" font-size="11">登录 / 短信 / 下单</text><text x="965" y="172" font-size="11">主体 + 资源维度</text><text x="965" y="198" font-size="11">抑制滥用与误操作</text></g>
    <g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M190 155H230"/><path d="M405 155H445"/><path d="M620 155H660"/><path d="M835 155H875"/><path d="M965 220V270"/></g>
    <rect x="95" y="270" width="970" height="240" rx="10" fill="#fff" stroke="#a5b8b2"/><text x="580" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#355c51">通过后仍需要运行时过载保护</text>
    <g text-anchor="middle"><rect x="135" y="345" width="190" height="105" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="230" y="378" font-size="15" font-weight="700">并发 Bulkhead</text><text x="230" y="405" font-size="11">慢路由不占满全局</text><text x="230" y="428" font-size="11">路由/上游独立上限</text>
      <rect x="365" y="345" width="190" height="105" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="460" y="378" font-size="15" font-weight="700">有界队列</text><text x="460" y="405" font-size="11">等待连接与排队超时</text><text x="460" y="428" font-size="11">不缓存必然超时请求</text>
      <rect x="595" y="345" width="190" height="105" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="690" y="378" font-size="15" font-weight="700">熔断 / 摘除</text><text x="690" y="405" font-size="11">失败上游快速失败</text><text x="690" y="428" font-size="11">半开小流量探测恢复</text>
      <rect x="825" y="345" width="190" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="920" y="378" font-size="15" font-weight="700">优先级舍弃</text><text x="920" y="405" font-size="11">先拒绝低信任/低价值</text><text x="920" y="428" font-size="11">保留关键恢复流量</text></g>
    <path d="M95 555H1065" stroke="#d5e2de" stroke-width="2"/><text x="580" y="585" text-anchor="middle" font-size="13" font-weight="700" fill="#455a64">429：公平性/配额 · 503：过载/无可用容量 · Retry-After：只在可合理估计时返回</text>
  </g>
</svg>
