<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">模块化单体到微服务的业务演进</title><desc id="d">先在单体内建立模块和数据所有权，再提取接口、迁移唯一写主，最后按真实收益拆分服务。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">先证明边界，再引入远程调用</text><rect x="35" y="95" width="320" height="290" rx="10" fill="#fff" stroke="#607d8b"/><text x="195" y="130" font-size="17" font-weight="700">阶段一：模块化单体</text><rect x="75" y="165" width="240" height="50" rx="7" fill="#fff8e6"/><text x="195" y="196" font-size="12">order module + owned tables</text><rect x="75" y="235" width="240" height="50" rx="7" fill="#e8f5f0"/><text x="195" y="266" font-size="12">inventory module + owned tables</text><rect x="75" y="305" width="240" height="50" rx="7" fill="#f3eff8"/><text x="195" y="336" font-size="12">公开 Application API / 模块事件</text><rect x="430" y="95" width="320" height="290" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="590" y="130" font-size="17" font-weight="700">阶段二：提取边界</text><text x="590" y="175" font-size="12">直接调用 → 明确 API / 契约</text><text x="590" y="215" font-size="12">指定唯一写主，另一侧只读同步</text><text x="590" y="255" font-size="12">Outbox / CDC 回填 + 对账</text><text x="590" y="295" font-size="12">灰度切读、切写、验证业务指标</text><text x="590" y="340" font-size="11" fill="#9a3345">禁止无协议双写两个数据库</text><rect x="825" y="95" width="320" height="290" rx="10" fill="#e8f5f0" stroke="#2f7d68"/><text x="985" y="130" font-size="17" font-weight="700">阶段三：独立服务</text><rect x="865" y="170" width="240" height="70" rx="7" fill="#fff" stroke="#607d8b"/><text x="985" y="198" font-size="13" font-weight="700">独立团队 / 发布 / SLO</text><text x="985" y="220" font-size="11">独立数据库与值班</text><rect x="865" y="275" width="240" height="70" rx="7" fill="#fff" stroke="#607d8b"/><text x="985" y="303" font-size="13" font-weight="700">远程失败成为正式模型</text><text x="985" y="325" font-size="11">契约、deadline、最终一致</text><g stroke="#607d8b" stroke-width="3" marker-end="url(#a)"><path d="M355 240H423"/><path d="M750 240H818"/></g><text x="590" y="450" font-size="12" font-weight="700">拆分条件：业务语言、数据所有权、团队、容量或故障隔离收益足以覆盖分布式成本</text></g></svg>
