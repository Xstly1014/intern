<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">实时流程与离线对账闭环</title><desc id="d">实时 Saga 之外，对账比较内部账本与外部权威流水，将差异自动修复或生成工单。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">实时路径追求及时，对账路径保证最终可证明收敛</text><rect x="50" y="95" width="260" height="100" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="180" y="130" font-size="15" font-weight="700">内部权威账本</text><text x="180" y="160" font-size="11">订单 / 支付 / 预留事实</text><rect x="50" y="280" width="260" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="180" y="315" font-size="15" font-weight="700">外部权威流水</text><text x="180" y="345" font-size="11">渠道账单 / 回调 / 查询</text><rect x="425" y="160" width="250" height="150" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="550" y="195" font-size="15" font-weight="700">对账引擎</text><text x="550" y="226" font-size="11">按业务键 / 金额 / 状态比较</text><text x="550" y="252" font-size="11">延迟 · 缺失 · 重复 · 不符</text><text x="550" y="278" font-size="11">保存证据与差异分类</text><rect x="790" y="95" width="320" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="950" y="130" font-size="15" font-weight="700">可证明安全 → 自动修复命令</text><text x="950" y="160" font-size="11">复用授权 / 幂等 / 状态机 / 审计</text><rect x="790" y="280" width="320" height="105" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="950" y="315" font-size="15" font-weight="700">未知 / 高风险 → 人工工单</text><text x="950" y="345" font-size="11">证据、建议动作、双人复核</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M310 145L418 195"/><path d="M310 330L418 275"/><path d="M675 205L783 155"/><path d="M675 270L783 325"/></g><text x="590" y="445" font-size="12" font-weight="700">修复工具不能直接写表；任何差异都可重跑、可审计、可解释</text></g></svg>
