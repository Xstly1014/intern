<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">命令模型与查询模型职责差异</title><desc id="d">命令侧保护不变量并写权威事实，查询侧从投影和缓存读取授权后的视图。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">命令改变事实，查询呈现事实</text><rect x="45" y="95" width="500" height="290" rx="10" fill="#fff8e6" stroke="#c69a32"/><text x="295" y="132" text-anchor="middle" font-size="18" font-weight="700">Command Side</text><text x="85" y="175" font-size="13">• 明确业务意图与资源授权</text><text x="85" y="210" font-size="13">• 聚合、状态机、不变量</text><text x="85" y="245" font-size="13">• 本地事务、幂等、并发冲突</text><text x="85" y="280" font-size="13">• 写权威模型 + Outbox 事实</text><text x="85" y="330" font-size="11" fill="#9a3345">不提供任意字段 patch，不返回 JPA Entity</text><rect x="635" y="95" width="500" height="290" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="885" y="132" text-anchor="middle" font-size="18" font-weight="700">Query Side</text><text x="675" y="175" font-size="13">• 按用户/租户/字段授权</text><text x="675" y="210" font-size="13">• Projection、批量、搜索、缓存</text><text x="675" y="245" font-size="13">• 可接受明确的新鲜度与最终一致</text><text x="675" y="280" font-size="13">• 面向场景的只读 View Model</text><text x="675" y="330" font-size="11" fill="#9a3345">不绕过资源所有者写数据</text><path d="M545 240H628" stroke="#607d8b" stroke-width="2" stroke-dasharray="6 5"/><text x="590" y="225" text-anchor="middle" font-size="11">事件构建投影</text><text x="590" y="445" text-anchor="middle" font-size="12" font-weight="700">CQRS 可先是代码模型分离，不要求立即使用两套服务或数据库</text></g></svg>
