<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">限界上下文契约关系</title><desc id="d">上下文通过发布语言、客户供应商、反腐层或分离方式协作，而不是共享内部模型。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">Context Map 明确协作方式与变化责任</text><rect x="50" y="115" width="230" height="110" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="165" y="150" font-size="15" font-weight="700">定价上下文</text><text x="165" y="180" font-size="11">发布 PriceCalculated v2</text><text x="165" y="202" font-size="11">Published Language</text><rect x="475" y="115" width="230" height="110" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="590" y="150" font-size="15" font-weight="700">订单上下文</text><text x="590" y="180" font-size="11">保存价格快照</text><text x="590" y="202" font-size="11">Customer / Consumer</text><rect x="900" y="115" width="230" height="110" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="1015" y="150" font-size="15" font-weight="700">外部物流</text><text x="1015" y="180" font-size="11">供应商模型</text><text x="1015" y="202" font-size="11">不可直接进入领域</text><rect x="735" y="285" width="210" height="90" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="840" y="320" font-size="14" font-weight="700">Anti-corruption Layer</text><text x="840" y="347" font-size="11">翻译状态、错误与标识</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M280 170H468"/><path d="M900 190L865 278"/><path d="M735 330L670 225"/></g><rect x="160" y="410" width="860" height="45" rx="7" fill="#fbecef"/><text x="590" y="438" font-size="12" font-weight="700" fill="#9a3345">跨边界共享 API / 事件 Schema，不共享 Entity Jar、数据库表或可变领域对象</text></g></svg>
