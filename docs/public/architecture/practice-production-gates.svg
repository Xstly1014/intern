<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">从设计冻结到稳定观察的上线门禁</title>
<desc id="desc">展示上线前契约、安全、容量、运行、迁移恢复、Canary 和上线后验收门禁。</desc>
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}.heading{font-size:25px;font-weight:700;fill:#1f2d33}.caption{font-size:14px;fill:#607078}.node-title{font-size:16px;font-weight:700;fill:#1f2d33}.node-sub{font-size:13px;fill:#45565e}.edge{fill:none;stroke:#607078;stroke-width:2}.note{font-size:12px;fill:#6a777d}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607078"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="30" y="38" class="heading">从设计冻结到稳定观察的上线门禁</text><text x="30" y="63" class="caption">展示上线前契约、安全、容量、运行、迁移恢复、Canary 和上线后验收门禁。</text>
<path d="M 140 156 L 155 156" class="edge" marker-end="url(#arrow)"/>
<path d="M 275 156 L 290 156" class="edge" marker-end="url(#arrow)"/>
<path d="M 410 156 L 425 156" class="edge" marker-end="url(#arrow)"/>
<path d="M 545 156 L 560 156" class="edge" marker-end="url(#arrow)"/>
<path d="M 680 156 L 695 156" class="edge" marker-end="url(#arrow)"/>
<path d="M 815 156 L 830 156" class="edge" marker-end="url(#arrow)"/>
<path d="M 750 202 L 700 330" class="edge" marker-end="url(#arrow)"/>
<g aria-label="契约与数据"><rect x="20" y="110" width="120" height="92" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="80" y="138" class="node-title" text-anchor="middle">契约与数据</text><text x="80" y="162" class="node-sub" text-anchor="middle">API/事件兼容</text><text x="80" y="181" class="node-sub" text-anchor="middle">Schema/所有权</text></g>
<g aria-label="功能与安全"><rect x="155" y="110" width="120" height="92" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="215" y="138" class="node-title" text-anchor="middle">功能与安全</text><text x="215" y="162" class="node-sub" text-anchor="middle">自动测试</text><text x="215" y="181" class="node-sub" text-anchor="middle">威胁与权限</text></g>
<g aria-label="容量与过载"><rect x="290" y="110" width="120" height="92" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="350" y="138" class="node-title" text-anchor="middle">容量与过载</text><text x="350" y="162" class="node-sub" text-anchor="middle">峰值/突发</text><text x="350" y="181" class="node-sub" text-anchor="middle">限流与余量</text></g>
<g aria-label="运行与观测"><rect x="425" y="110" width="120" height="92" rx="8" fill="#f3edff" stroke="#7651a8" stroke-width="2"/><text x="485" y="138" class="node-title" text-anchor="middle">运行与观测</text><text x="485" y="162" class="node-sub" text-anchor="middle">SLO/告警</text><text x="485" y="181" class="node-sub" text-anchor="middle">Runbook/on-call</text></g>
<g aria-label="迁移与恢复"><rect x="560" y="110" width="120" height="92" rx="8" fill="#e8f1ff" stroke="#2766b0" stroke-width="2"/><text x="620" y="138" class="node-title" text-anchor="middle">迁移与恢复</text><text x="620" y="162" class="node-sub" text-anchor="middle">可重入迁移</text><text x="620" y="181" class="node-sub" text-anchor="middle">备份/回滚演练</text></g>
<g aria-label="Canary"><rect x="695" y="110" width="120" height="92" rx="8" fill="#e8f7ef" stroke="#2f7d57" stroke-width="2"/><text x="755" y="138" class="node-title" text-anchor="middle">Canary</text><text x="755" y="162" class="node-sub" text-anchor="middle">业务+技术门禁</text><text x="755" y="181" class="node-sub" text-anchor="middle">停止条件</text></g>
<g aria-label="稳定验收"><rect x="830" y="110" width="110" height="92" rx="8" fill="#fff3df" stroke="#b66a18" stroke-width="2"/><text x="885" y="138" class="node-title" text-anchor="middle">稳定验收</text><text x="885" y="162" class="node-sub" text-anchor="middle">完整周期核对</text><text x="885" y="181" class="node-sub" text-anchor="middle">清理临时项</text></g>
<g aria-label="任何门禁证据不足"><rect x="210" y="330" width="540" height="70" rx="8" fill="#fff0ef" stroke="#b94b45" stroke-width="2"/><text x="480" y="358" class="node-title" text-anchor="middle">任何门禁证据不足</text><text x="480" y="382" class="node-sub" text-anchor="middle">暂停、缩小范围或显式接受风险；遥测缺失不能视为成功</text></g>
<text x="930" y="480" class="note" text-anchor="end">系统架构 · 端到端落地与演进</text>
</svg>
