<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc"><title id="title">多终端 BFF 生产参考架构</title><desc id="desc">展示客户端经 CDN WAF 和 API 网关进入 Web、App、Admin BFF，BFF 调用领域服务及读模型，并由契约、遥测和交付平台提供横向治理。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="660" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">多终端 BFF：契约独立，领域能力复用</text>
<g text-anchor="middle"><rect x="25" y="100" width="150" height="68" rx="8" fill="#fff" stroke="#607d8b"/><text x="100" y="128" font-size="14" font-weight="700">Web / SSR</text><text x="100" y="150" font-size="11">Cookie · CSRF</text><rect x="25" y="205" width="150" height="68" rx="8" fill="#fff" stroke="#607d8b"/><text x="100" y="233" font-size="14" font-weight="700">Mobile App</text><text x="100" y="255" font-size="11">弱网 · 长尾版本</text><rect x="25" y="310" width="150" height="68" rx="8" fill="#fff" stroke="#607d8b"/><text x="100" y="338" font-size="14" font-weight="700">Admin</text><text x="100" y="360" font-size="11">MFA · 审计 · 导出</text>
<rect x="225" y="125" width="175" height="220" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="313" y="162" font-size="15" font-weight="700">边缘与 API 网关</text><text x="313" y="195" font-size="12">WAF / TLS / 路由</text><text x="313" y="222" font-size="12">凭证初检 / 配额</text><text x="313" y="249" font-size="12">灰度 / 可信身份</text><text x="313" y="292" font-size="11" fill="#455a64">不做页面聚合</text><text x="313" y="315" font-size="11" fill="#455a64">不持有领域规则</text>
<rect x="470" y="80" width="205" height="105" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="573" y="115" font-size="15" font-weight="700">Web BFF</text><text x="573" y="142" font-size="12">Web 契约 · Token mediation</text><text x="573" y="164" font-size="12">页面聚合 · 错误适配</text><rect x="470" y="215" width="205" height="105" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="573" y="250" font-size="15" font-weight="700">App BFF</text><text x="573" y="277" font-size="12">版本兼容 · 响应裁剪</text><text x="573" y="299" font-size="12">幂等接入 · 部分结果</text><rect x="470" y="350" width="205" height="105" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="573" y="385" font-size="15" font-weight="700">Admin BFF</text><text x="573" y="412" font-size="12">权限视图 · 批量编排</text><text x="573" y="434" font-size="12">代理上下文 · 接入审计</text>
<rect x="760" y="75" width="175" height="90" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="848" y="108" font-size="14" font-weight="700">订单服务</text><text x="848" y="134" font-size="11">用例 · 不变量 · 授权</text><rect x="760" y="190" width="175" height="90" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="848" y="223" font-size="14" font-weight="700">商品 / 价格服务</text><text x="848" y="249" font-size="11">资源与领域数据所有者</text><rect x="760" y="305" width="175" height="90" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="848" y="338" font-size="14" font-weight="700">用户 / 权限服务</text><text x="848" y="364" font-size="11">对象关系与最终授权</text><rect x="760" y="420" width="175" height="90" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="848" y="453" font-size="14" font-weight="700">专用读模型</text><text x="848" y="479" font-size="11">组合投影 · 新鲜度声明</text><rect x="1010" y="170" width="145" height="245" rx="9" fill="#fff" stroke="#607d8b"/><text x="1083" y="205" font-size="14" font-weight="700">数据边界</text><text x="1083" y="242" font-size="11">每个服务拥有</text><text x="1083" y="264" font-size="11">自己的数据库</text><path d="M1038 285H1128" stroke="#a5b8b2"/><text x="1083" y="315" font-size="11">BFF 不直连</text><text x="1083" y="337" font-size="11">领域数据库</text><text x="1083" y="378" font-size="11" font-weight="700" fill="#9a3345">禁止共享写库</text></g>
