<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc"><title id="title">BFF 错误映射模型</title><desc id="desc">展示协议错误、领域错误、下游故障和未知异常如何经过分类与白名单映射，形成稳定的 HTTP 状态、错误码和安全响应。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="560" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">内部原因不能直接成为客户端契约</text>
<g text-anchor="middle"><rect x="35" y="90" width="205" height="82" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="138" y="121" font-size="14" font-weight="700">协议与字段校验</text><text x="138" y="147" font-size="12">解析失败 · 格式 · 范围</text><rect x="35" y="192" width="205" height="82" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="138" y="223" font-size="14" font-weight="700">用例 / 领域结果</text><text x="138" y="249" font-size="12">冲突 · 不允许 · 不存在</text><rect x="35" y="294" width="205" height="82" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="138" y="325" font-size="14" font-weight="700">下游调用故障</text><text x="138" y="351" font-size="12">超时 · 限流 · 连接失败</text><rect x="35" y="396" width="205" height="82" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="138" y="427" font-size="14" font-weight="700">未知异常</text><text x="138" y="453" font-size="12">内部保留指纹与 Trace</text>
<rect x="345" y="120" width="255" height="330" rx="10" fill="#fff" stroke="#2f7d68" stroke-width="2"/><text x="473" y="157" font-size="17" font-weight="700">API Error Mapper</text><text x="473" y="200" font-size="13">1. 按来源与可重试性分类</text><text x="473" y="232" font-size="13">2. 选择公开 HTTP 语义</text><text x="473" y="264" font-size="13">3. 映射稳定业务错误码</text><text x="473" y="296" font-size="13">4. 白名单 details / fieldErrors</text><text x="473" y="328" font-size="13">5. 清除栈、SQL、内部服务名</text><text x="473" y="360" font-size="13">6. 记录 request ID 与遥测</text><rect x="375" y="390" width="195" height="38" rx="6" fill="#fbecef"/><text x="473" y="415" font-size="12" font-weight="700" fill="#9a3345">禁止透传下游错误 Body</text>
<rect x="700" y="90" width="430" height="360" rx="10" fill="#e8f5f0" stroke="#2f7d68"/><text x="915" y="127" font-size="17" font-weight="700">公开错误契约</text><rect x="735" y="157" width="150" height="86" rx="7" fill="#fff" stroke="#a5b8b2"/><text x="810" y="188" font-size="14" font-weight="700">HTTP 状态</text><text x="810" y="214" font-size="12">401 / 409 / 429 / 503</text><rect x="945" y="157" width="150" height="86" rx="7" fill="#fff" stroke="#a5b8b2"/><text x="1020" y="188" font-size="14" font-weight="700">稳定 code</text><text x="1020" y="214" font-size="12">程序分支依据</text><rect x="735" y="273" width="150" height="86" rx="7" fill="#fff" stroke="#a5b8b2"/><text x="810" y="304" font-size="14" font-weight="700">安全 message</text><text x="810" y="330" font-size="12">展示 / 本地化</text><rect x="945" y="273" width="150" height="86" rx="7" fill="#fff" stroke="#a5b8b2"/><text x="1020" y="304" font-size="14" font-weight="700">结构化细节</text><text x="1020" y="330" font-size="12">字段 path / request ID</text><text x="915" y="407" font-size="12" font-weight="700">客户端据此：修正 · 登录 · 刷新 · 退避 · 查状态</text></g>
<g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M240 131H338"/><path d="M240 233H338"/><path d="M240 335H338"/><path d="M240 437H338"/><path d="M600 285H693"/></g><text x="590" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#455a64">写请求超时代表结果可能未知 · 只有满足幂等和总预算时才能重试 · 监控同时记录 HTTP 状态与稳定错误码</text></g></svg>
