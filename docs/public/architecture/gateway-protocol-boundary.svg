<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc"><title id="title">网关多协议边界</title><desc id="desc">对比普通 HTTP、gRPC、WebSocket 和 SSE 经过网关时的调度单位、超时、配额和状态观测差异</desc><rect width="1160" height="590" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">同一个网关入口，不能共用一套协议参数</text>
  <g text-anchor="middle"><rect x="40" y="90" width="250" height="390" rx="10" fill="#fff" stroke="#4f7cac"/><text x="165" y="128" font-size="18" font-weight="700" fill="#315f8c">HTTP JSON</text><text x="165" y="158" font-size="12">请求 / 响应</text><line x1="70" y1="180" x2="260" y2="180" stroke="#d5e2de"/><text x="165" y="213" font-size="13" font-weight="700">调度与配额</text><text x="165" y="238" font-size="11">RPS + Body bytes</text><text x="165" y="275" font-size="13" font-weight="700">超时</text><text x="165" y="300" font-size="11">connect / TTFB / total</text><text x="165" y="337" font-size="13" font-weight="700">错误</text><text x="165" y="362" font-size="11">HTTP status + error code</text><text x="165" y="399" font-size="13" font-weight="700">关键风险</text><text x="165" y="424" font-size="11">大 Body 缓冲、请求重放</text><text x="165" y="448" font-size="11">CORS 与缓存变体</text>
  <rect x="315" y="90" width="250" height="390" rx="10" fill="#fff" stroke="#8064a2"/><text x="440" y="128" font-size="18" font-weight="700" fill="#654b87">gRPC</text><text x="440" y="158" font-size="12">unary / streaming</text><line x1="345" y1="180" x2="535" y2="180" stroke="#d5e2de"/><text x="440" y="213" font-size="13" font-weight="700">调度与配额</text><text x="440" y="238" font-size="11">method + message + stream</text><text x="440" y="275" font-size="13" font-weight="700">超时</text><text x="440" y="300" font-size="11">grpc-timeout / deadline 传播</text><text x="440" y="337" font-size="13" font-weight="700">错误</text><text x="440" y="362" font-size="11">grpc-status 在 Trailers</text><text x="440" y="399" font-size="13" font-weight="700">关键风险</text><text x="440" y="424" font-size="11">HTTP 200 不代表 gRPC 成功</text><text x="440" y="448" font-size="11">流控、message 大小</text>
  <rect x="590" y="90" width="250" height="390" rx="10" fill="#fff" stroke="#b44c5b"/><text x="715" y="128" font-size="18" font-weight="700" fill="#8e3442">WebSocket</text><text x="715" y="158" font-size="12">双向长连接</text><line x1="620" y1="180" x2="810" y2="180" stroke="#d5e2de"/><text x="715" y="213" font-size="13" font-weight="700">调度与配额</text><text x="715" y="238" font-size="11">并发连接 + 消息率</text><text x="715" y="275" font-size="13" font-weight="700">超时</text><text x="715" y="300" font-size="11">握手 + 心跳 + idle</text><text x="715" y="337" font-size="13" font-weight="700">错误</text><text x="715" y="362" font-size="11">Upgrade 状态 + close code</text><text x="715" y="399" font-size="13" font-weight="700">关键风险</text><text x="715" y="424" font-size="11">发布断连、单机粘性</text><text x="715" y="448" font-size="11">广播扇出和慢消费者</text>
  <rect x="865" y="90" width="250" height="390" rx="10" fill="#fff" stroke="#2f7d68"/><text x="990" y="128" font-size="18" font-weight="700" fill="#1e6654">SSE</text><text x="990" y="158" font-size="12">服务端单向长响应</text><line x1="895" y1="180" x2="1085" y2="180" stroke="#d5e2de"/><text x="990" y="213" font-size="13" font-weight="700">调度与配额</text><text x="990" y="238" font-size="11">并发流 + event bytes</text><text x="990" y="275" font-size="13" font-weight="700">超时</text><text x="990" y="300" font-size="11">建连 + 心跳 + idle</text><text x="990" y="337" font-size="13" font-weight="700">恢复</text><text x="990" y="362" font-size="11">Last-Event-ID 断线续传</text><text x="990" y="399" font-size="13" font-weight="700">关键风险</text><text x="990" y="424" font-size="11">代理缓冲、空闲超时</text><text x="990" y="448" font-size="11">重连风暴</text></g>
  <rect x="110" y="520" width="940" height="42" rx="7" fill="#fff8e6" stroke="#c69a32"/><text x="580" y="547" text-anchor="middle" font-size="12" font-weight="700" fill="#7a571d">路由配置必须声明协议 profile：消息大小、连接、并发、心跳、空闲超时和错误观测都不同</text>
  </g></svg>
