<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">BFF 请求处理管线</title><desc id="d">展示 BFF 从契约解析、校验、规范化、上下文、映射到用例调用、响应转换与错误映射的处理顺序</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17342c">BFF 管线：协议模型与业务模型不混用</text><g text-anchor="middle"><rect x="30" y="95" width="130" height="95" rx="8" fill="#fff" stroke="#607d8b"/><text x="95" y="130" font-size="14" font-weight="700">外部请求</text><text x="95" y="156" font-size="11">DTO + Header</text><rect x="190" y="95" width="145" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="262" y="126" font-size="14" font-weight="700">契约解析</text><text x="262" y="150" font-size="11">Content-Type / 大小</text><text x="262" y="171" font-size="11">JSON / Schema</text><rect x="365" y="95" width="145" height="95" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="437" y="126" font-size="14" font-weight="700">校验规范化</text><text x="437" y="150" font-size="11">格式 / 边界 / 三态</text><text x="437" y="171" font-size="11">不做领域查询</text><rect x="540" y="95" width="145" height="95" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="612" y="126" font-size="14" font-weight="700">可信上下文</text><text x="612" y="150" font-size="11">subject / tenant</text><text x="612" y="171" font-size="11">locale / deadline</text><rect x="715" y="95" width="145" height="95" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="787" y="126" font-size="14" font-weight="700">白名单映射</text><text x="787" y="150" font-size="11">DTO → Command/Query</text><text x="787" y="171" font-size="11">服务端字段不可控</text><rect x="890" y="95" width="145" height="95" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="962" y="126" font-size="14" font-weight="700">用例 / 聚合</text><text x="962" y="150" font-size="11">命令或有界查询</text><text x="962" y="171" font-size="11">传播 deadline</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M160 142H185"/><path d="M335 142H360"/><path d="M510 142H535"/><path d="M685 142H710"/><path d="M860 142H885"/><path d="M962 190V260H850"/></g><g text-anchor="middle"><rect x="650" y="260" width="200" height="100" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="750" y="294" font-size="15" font-weight="700">结果转换</text><text x="750" y="320" font-size="11">Domain/Projection → Response</text><text x="750" y="342" font-size="11">字段裁剪 / 版本兼容</text><rect x="400" y="260" width="200" height="100" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="500" y="294" font-size="15" font-weight="700">错误契约</text><text x="500" y="320" font-size="11">HTTP + code + request ID</text><text x="500" y="342" font-size="11">不泄露内部异常</text><rect x="150" y="260" width="200" height="100" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="250" y="294" font-size="15" font-weight="700">遥测与响应</text><text x="250" y="320" font-size="11">complete / partial / stale</text><text x="250" y="342" font-size="11">扇出 / 耗时 / 大小</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M650 310H605"/><path d="M400 310H355"/></g><rect x="130" y="410" width="920" height="55" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="444" text-anchor="middle" font-size="12" font-weight="700" fill="#455a64">协议校验失败早返回 · 领域校验进用例 · 任何线程/调度切换都不丢失上下文与 deadline</text></g></svg>
