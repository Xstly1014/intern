<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc"><title id="title">BFF 入口、下游调用和用户结果的观测关联</title><desc id="desc">以同一 trace 和 request ID 关联入口请求、并行下游尝试、聚合完整性、日志指标和真实用户体验。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="570" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">从一次用户请求，看清它制造的全部内部工作</text>
<rect x="45" y="100" width="210" height="130" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="150" y="135" text-anchor="middle" font-size="16" font-weight="700">入口 Server Span</text><text x="70" y="165" font-size="12">API / channel / version</text><text x="70" y="190" font-size="12">状态 · error code · bytes</text><text x="70" y="214" font-size="12">trace ID + request ID</text>
<rect x="345" y="80" width="360" height="340" rx="10" fill="#fff" stroke="#2f7d68" stroke-width="2"/><text x="525" y="115" text-anchor="middle" font-size="16" font-weight="700">BFF 聚合范围</text><g text-anchor="middle"><rect x="385" y="145" width="280" height="62" rx="7" fill="#e8f5f0"/><text x="525" y="172" font-size="13" font-weight="700">本地解析 / 映射 / 组装</text><text x="525" y="192" font-size="11">队列时间、CPU、序列化</text><rect x="385" y="230" width="125" height="100" rx="7" fill="#fff8e6" stroke="#c69a32"/><text x="448" y="260" font-size="13" font-weight="700">下游 A</text><text x="448" y="283" font-size="11">client span × 尝试</text><text x="448" y="306" font-size="11">连接 / TTFB / 总耗时</text><rect x="540" y="230" width="125" height="100" rx="7" fill="#f3eff8" stroke="#8064a2"/><text x="603" y="260" font-size="13" font-weight="700">下游 B</text><text x="603" y="283" font-size="11">重试 / 取消 / 降级</text><text x="603" y="306" font-size="11">连接池 / bulkhead</text><rect x="385" y="353" width="280" height="45" rx="7" fill="#fbecef"/><text x="525" y="381" font-size="12" font-weight="700">结果：complete / partial / stale / failed</text></g>
<rect x="800" y="90" width="330" height="145" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="965" y="124" text-anchor="middle" font-size="16" font-weight="700">三类遥测信号</text><text x="830" y="154" font-size="12">指标：RED、扇出、队列、池、partial</text><text x="830" y="181" font-size="12">日志：结构化事实，Body/Token 脱敏</text><text x="830" y="208" font-size="12">Trace：每次尝试独立 span，保留因果</text>
<rect x="800" y="285" width="330" height="135" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="965" y="319" text-anchor="middle" font-size="16" font-weight="700">用户与业务结果</text><text x="830" y="349" font-size="12">RUM：页面可交互、弱网、客户端错误</text><text x="830" y="376" font-size="12">业务：订单是否最终成功，由用例所有者定义</text><text x="830" y="403" font-size="12">关联键受控，不将 user ID 做高基数标签</text>
<g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M255 165H338"/><path d="M705 165H793"/><path d="M705 353H793"/></g><rect x="90" y="470" width="1000" height="55" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="493" text-anchor="middle" font-size="12" font-weight="700">HTTP 200 不等于完整成功：主资源成功但可选区块缺失，必须在响应语义、指标和 Trace 中同时可见</text><text x="590" y="514" text-anchor="middle" font-size="11">限制 route、version、downstream 等标签基数；用户、订单、完整 URI 放日志或 Trace 并按数据政策治理</text></g></svg>
