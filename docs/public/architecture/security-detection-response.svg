<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">安全信号检测与事件响应闭环</title><desc id="d">安全信号经规范化、关联、告警富化和分级，进入隔离、取证、恢复、通知与复盘闭环。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">从信号到恢复的安全响应闭环</text><g text-anchor="middle"><rect x="30" y="110" width="170" height="105" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="115" y="142" font-size="14" font-weight="700">1 信号采集</text><text x="115" y="170" font-size="11">身份 · 应用 · 数据</text><text x="115" y="192" font-size="11">云 / WAF / 终端</text><rect x="230" y="110" width="170" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="315" y="142" font-size="14" font-weight="700">2 规范化关联</text><text x="315" y="170" font-size="11">actor · tenant · 资源</text><text x="315" y="192" font-size="11">trace · 时间线</text><rect x="430" y="110" width="170" height="105" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="515" y="142" font-size="14" font-weight="700">3 检测 / 富化</text><text x="515" y="170" font-size="11">规则 · 基线 · 情报</text><text x="515" y="192" font-size="11">资产价值 / 暴露面</text><rect x="630" y="110" width="170" height="105" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="715" y="142" font-size="14" font-weight="700">4 分级处置</text><text x="715" y="170" font-size="11">负责人 · SLA</text><text x="715" y="192" font-size="11">Playbook / 指挥</text><rect x="830" y="110" width="170" height="105" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="915" y="142" font-size="14" font-weight="700">5 控制 / 取证</text><text x="915" y="170" font-size="11">撤销 · 隔离 · 阻断</text><text x="915" y="192" font-size="11">证据与影响范围</text><rect x="1030" y="110" width="125" height="105" rx="8" fill="#fff" stroke="#607d8b"/><text x="1093" y="142" font-size="14" font-weight="700">6 恢复</text><text x="1093" y="170" font-size="11">轮换 · 修复</text><text x="1093" y="192" font-size="11">通知 · 复盘</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M200 162H223"/><path d="M400 162H423"/><path d="M600 162H623"/><path d="M800 162H823"/><path d="M1000 162H1023"/><path d="M1093 215C1093 360 180 390 115 222"/></g><rect x="145" y="300" width="890" height="70" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="328" text-anchor="middle" font-size="13" font-weight="700">控制动作：撤销 Token family · 禁用身份/证书 · 隔离 workload · 封锁出站 · 暂停导出</text><text x="590" y="353" text-anchor="middle" font-size="11">每次自动操作可审计、限制影响、支持人工升级和回滚</text><text x="590" y="455" text-anchor="middle" font-size="12" font-weight="700">恢复不仅是服务上线：还要验证数据/制品完整性、清除持久入口并监控攻击者回归</text></g></svg>
