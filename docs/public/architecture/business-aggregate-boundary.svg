<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">聚合边界与跨聚合协作</title><desc id="d">订单聚合在本地事务保护订单项、金额和状态，通过标识及事件与库存、支付协作。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">聚合只容纳必须立刻一致的状态</text><rect x="330" y="85" width="520" height="280" rx="16" fill="#fff8e6" stroke="#c69a32" stroke-width="2"/><text x="590" y="120" font-size="18" font-weight="700">Order Aggregate / 单本地事务</text><rect x="390" y="160" width="170" height="100" rx="8" fill="#fff" stroke="#607d8b"/><text x="475" y="195" font-size="14" font-weight="700">Order Root</text><text x="475" y="224" font-size="11">状态 · 金额 · version</text><rect x="620" y="160" width="170" height="100" rx="8" fill="#fff" stroke="#607d8b"/><text x="705" y="195" font-size="14" font-weight="700">Order Items</text><text x="705" y="224" font-size="11">商品 / 价格快照</text><text x="590" y="312" font-size="12">不变量：金额求和 · 合法状态转换 · 订单项非空</text><rect x="45" y="150" width="200" height="120" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="145" y="185" font-size="15" font-weight="700">库存上下文</text><text x="145" y="215" font-size="11">拥有可用量 / 预留</text><text x="145" y="240" font-size="11">ReservationId</text><rect x="935" y="150" width="200" height="120" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="1035" y="185" font-size="15" font-weight="700">支付上下文</text><text x="1035" y="215" font-size="11">拥有支付尝试 / 退款</text><text x="1035" y="240" font-size="11">PaymentId</text><g stroke="#607d8b" stroke-width="2" stroke-dasharray="6 5"><path d="M245 210H323"/><path d="M850 210H928"/></g><rect x="190" y="410" width="800" height="45" rx="7" fill="#fbecef"/><text x="590" y="438" font-size="12" font-weight="700" fill="#9a3345">跨聚合只保存 ID 并通过流程/事件最终一致，不把远程对象装进巨大聚合</text></g></svg>
