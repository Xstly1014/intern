<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">不同终端通过各自 BFF 接入领域服务</title><desc id="d">App、Web 和管理后台分别通过对应 BFF 访问商品、订单和用户服务</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="960" height="500" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="480" y="42" font-size="23" font-weight="700" fill="#17342c">面向终端的 BFF 接入边界</text><g fill="#fff" stroke="#607d8b" stroke-width="2"><rect x="45" y="105" width="150" height="64" rx="12"/><rect x="45" y="220" width="150" height="64" rx="12"/><rect x="45" y="335" width="150" height="64" rx="12"/></g><g font-size="16" font-weight="700"><text x="120" y="144">App</text><text x="120" y="259">Web</text><text x="120" y="374">运营后台</text></g><g stroke="#8b6fb3" fill="#f3eff8" stroke-width="2"><rect x="300" y="105" width="190" height="64" rx="12"/><rect x="300" y="220" width="190" height="64" rx="12"/><rect x="300" y="335" width="190" height="64" rx="12"/></g><g font-size="16" font-weight="700"><text x="395" y="144">App BFF</text><text x="395" y="259">Web BFF</text><text x="395" y="374">Admin BFF</text></g><g stroke="#3c8772" fill="#e8f5f0" stroke-width="2"><rect x="665" y="90" width="210" height="70" rx="12"/><rect x="665" y="215" width="210" height="70" rx="12"/><rect x="665" y="340" width="210" height="70" rx="12"/></g><g font-size="16" font-weight="700"><text x="770" y="131">商品服务</text><text x="770" y="256">订单服务</text><text x="770" y="381">用户服务</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M195 137H294"/><path d="M195 252H294"/><path d="M195 367H294"/><path d="M490 137H600V125H659"/><path d="M490 137H580V250H659"/><path d="M490 252H659"/><path d="M490 252H580V375H659"/><path d="M490 367H600V375H659"/></g><text x="480" y="462" font-size="12" fill="#607d8b">BFF 适配终端协议和展示模型；核心业务规则仍由领域服务拥有</text></g></svg>
