<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" role="img" aria-labelledby="t d"><title id="t">文件上传扫描与授权下载</title><desc id="d">客户端使用短时签名上传隔离区，扫描通过后发布，下载时重新授权并签发短时 URL。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="490" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">对象内容与业务元数据分别拥有明确状态</text><g><rect x="25" y="120" width="170" height="95" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="110" y="155" font-size="14" font-weight="700">客户端</text><text x="110" y="185" font-size="11">申请上传</text><rect x="235" y="105" width="190" height="125" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="330" y="140" font-size="14" font-weight="700">业务服务</text><text x="330" y="170" font-size="11">授权 · 随机 Key</text><text x="330" y="195" font-size="11">元数据 PENDING</text><rect x="465" y="105" width="190" height="125" rx="8" fill="#fff" stroke="#607d8b"/><text x="560" y="140" font-size="14" font-weight="700">隔离 Bucket</text><text x="560" y="170" font-size="11">短时签名直传</text><text x="560" y="195" font-size="11">默认不可下载</text><rect x="695" y="105" width="190" height="125" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="790" y="140" font-size="14" font-weight="700">扫描 / 转码</text><text x="790" y="170" font-size="11">magic bytes · 病毒</text><text x="790" y="195" font-size="11">大小 / 沙箱</text><rect x="925" y="105" width="220" height="125" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="1035" y="140" font-size="14" font-weight="700">可用对象</text><text x="1035" y="170" font-size="11">元数据 AVAILABLE</text><text x="1035" y="195" font-size="11">下载重新授权 + 短时 URL</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M195 167H228"/><path d="M425 167H458"/><path d="M655 167H688"/><path d="M885 167H918"/></g><rect x="150" y="320" width="880" height="75" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="350" font-size="12" font-weight="700">定期对账：无元数据对象、无对象元数据、未完成上传、旧版本和 CDN 缓存</text><text x="590" y="377" font-size="11" fill="#9a3345">Bucket 私有；文件名、扩展名与客户端 Content-Type 都不可信</text><text x="590" y="445" font-size="12">删除和保留策略覆盖对象版本、缩略图、转码产物和 CDN</text></g></svg>
