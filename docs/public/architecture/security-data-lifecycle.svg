<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">敏感数据安全生命周期</title><desc id="d">数据从分类和最少采集开始，经过加密存储、受控使用、共享、保留，最终可验证删除。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">数据从采集前到删除后的完整生命周期</text><g text-anchor="middle"><rect x="30" y="120" width="160" height="105" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="110" y="152" font-size="14" font-weight="700">1 分类 / 最少采集</text><text x="110" y="180" font-size="11">用途 · 敏感级别</text><text x="110" y="201" font-size="11">责任所有者</text><rect x="220" y="120" width="160" height="105" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="300" y="152" font-size="14" font-weight="700">2 传输 / 存储</text><text x="300" y="180" font-size="11">TLS · KMS · 信封加密</text><text x="300" y="201" font-size="11">key version</text><rect x="410" y="120" width="160" height="105" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="490" y="152" font-size="14" font-weight="700">3 受控使用</text><text x="490" y="180" font-size="11">目的 / 字段 / 行权限</text><text x="490" y="201" font-size="11">解密最小化</text><rect x="600" y="120" width="160" height="105" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="680" y="152" font-size="14" font-weight="700">4 共享 / 派生</text><text x="680" y="180" font-size="11">第三方 · 地域 · 合同</text><text x="680" y="201" font-size="11">分析防重识别</text><rect x="790" y="120" width="160" height="105" rx="8" fill="#fff" stroke="#607d8b"/><text x="870" y="152" font-size="14" font-weight="700">5 保留 / 归档</text><text x="870" y="180" font-size="11">法规与业务 TTL</text><text x="870" y="201" font-size="11">备份加密</text><rect x="980" y="120" width="170" height="105" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1065" y="152" font-size="14" font-weight="700">6 删除 / 证明</text><text x="1065" y="180" font-size="11">主库 / 索引 / 派生</text><text x="1065" y="201" font-size="11">备份到期不复活</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M190 172H213"/><path d="M380 172H403"/><path d="M570 172H593"/><path d="M760 172H783"/><path d="M950 172H973"/></g><rect x="150" y="310" width="880" height="85" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="342" text-anchor="middle" font-size="13" font-weight="700">所有阶段共同控制：tenant 隔离 · 最小权限 · 脱敏审计 · 数据驻留 · 访问复核</text><text x="590" y="371" text-anchor="middle" font-size="11" fill="#9a3345">日志、Trace、测试数据、导出和备份不是安全生命周期之外的例外</text><text x="590" y="448" text-anchor="middle" font-size="12" font-weight="700">没有明确用途、保留期和删除责任的数据，不应被采集</text></g></svg>
