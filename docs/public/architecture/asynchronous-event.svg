<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">异步事件分发</title><desc id="d">订单服务在本地事务写订单和 Outbox，消息队列分发给通知、积分和分析消费者</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="500" y="42" font-size="23" font-weight="700" fill="#17342c">异步事件：发送方不等待所有消费者完成</text><rect x="45" y="180" width="180" height="84" rx="13" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="135" y="215" font-size="16" font-weight="700">订单服务</text><text x="135" y="241" font-size="11" fill="#607d8b">产生 OrderCreated</text><rect x="285" y="165" width="200" height="114" rx="13" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="385" y="200" font-size="16" font-weight="700">本地事务</text><text x="385" y="229" font-size="12" fill="#607d8b">订单 + Outbox</text><text x="385" y="251" font-size="10" fill="#607d8b">可靠发布</text><rect x="545" y="165" width="170" height="114" rx="13" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="630" y="205" font-size="17" font-weight="700">MQ</text><text x="630" y="234" font-size="11" fill="#607d8b">持久化 · 重放</text><text x="630" y="255" font-size="10" fill="#607d8b">至少一次投递</text><g><rect x="790" y="75" width="165" height="70" rx="11" fill="#e8f5f0" stroke="#3c8772"/><text x="872" y="117" font-size="14">通知服务</text><rect x="790" y="187" width="165" height="70" rx="11" fill="#e8f5f0" stroke="#3c8772"/><text x="872" y="229" font-size="14">积分服务</text><rect x="790" y="299" width="165" height="70" rx="11" fill="#e8f5f0" stroke="#3c8772"/><text x="872" y="341" font-size="14">数据分析</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M225 222H279"/><path d="M485 222H539"/><path d="M715 200H750V110H784"/><path d="M715 222H784"/><path d="M715 244H750V334H784"/></g><text x="500" y="440" font-size="12" fill="#607d8b">事件链路换来解耦与削峰，同时必须处理重复、乱序、积压、重试和最终一致性</text></g></svg>
