<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">数据库与 Broker 双写失败窗口</title><desc id="d">先写库或先发消息都存在进程崩溃导致事实与消息不一致的窗口。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="430" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">数据库与 Broker 双写失败窗口</text><rect x="30" y="120" width="266" height="120" rx="8" fill="#edf3fa" stroke="#607d8b"/><text x="163" y="158" text-anchor="middle" font-size="14" font-weight="700">先写 DB</text><text x="163" y="186" text-anchor="middle" font-size="11" font-weight="400">提交后崩溃</text><rect x="314" y="120" width="266" height="120" rx="8" fill="#e8f5f0" stroke="#607d8b"/><text x="447" y="158" text-anchor="middle" font-size="14" font-weight="700">消息未发</text><text x="447" y="186" text-anchor="middle" font-size="11" font-weight="400">静默丢通知</text><rect x="598" y="120" width="266" height="120" rx="8" fill="#fff8e6" stroke="#607d8b"/><text x="731" y="158" text-anchor="middle" font-size="14" font-weight="700">先发消息</text><text x="731" y="186" text-anchor="middle" font-size="11" font-weight="400">发送后崩溃</text><rect x="882" y="120" width="266" height="120" rx="8" fill="#f3eff8" stroke="#607d8b"/><text x="1015" y="158" text-anchor="middle" font-size="14" font-weight="700">DB 未提交</text><text x="1015" y="186" text-anchor="middle" font-size="11" font-weight="400">幽灵事件</text><path d="M296 180H307" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M580 180H591" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M864 180H875" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="310" width="980" height="62" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="348" text-anchor="middle" font-size="12" font-weight="700">普通双写无法用 try/catch 消除进程故障窗口</text></g></svg>
