<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">命令 Repository 与查询 Projection</title><desc id="d">命令侧按聚合和版本访问权威库，查询侧按场景生成受授权投影。</desc><rect width="1180" height="480" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">写模型保护不变量，读模型匹配访问形状</text><rect x="45" y="95" width="500" height="270" rx="10" fill="#fff8e6" stroke="#c69a32"/><text x="295" y="132" font-size="18" font-weight="700">Command Repository</text><text x="295" y="180" font-size="13">按 aggregate ID + tenant 加载</text><text x="295" y="215" font-size="13">保存 Root + version / lock</text><text x="295" y="250" font-size="13">一个本地事务维护不变量</text><text x="295" y="300" font-size="11" fill="#9a3345">不向外暴露任意 ORM 查询器</text><rect x="635" y="95" width="500" height="270" rx="10" fill="#edf3fa" stroke="#4f7cac"/><text x="885" y="132" font-size="18" font-weight="700">Query Projection</text><text x="885" y="180" font-size="13">按页面/报表直接选择字段</text><text x="885" y="215" font-size="13">SQL / MyBatis / JdbcClient / jOOQ</text><text x="885" y="250" font-size="13">行字段授权 + 分页 + 结果上限</text><text x="885" y="300" font-size="11" fill="#9a3345">只读优化不获得写入所有权</text><text x="590" y="425" font-size="12" font-weight="700">两条路径可共享事务与连接基础设施，但模型、性能目标和返回类型不同</text></g></svg>
