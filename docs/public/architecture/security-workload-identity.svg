<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="t d"><title id="t">工作负载身份与服务间信任链</title><desc id="d">平台身份控制面向每个工作负载签发短期身份，服务通过 mTLS 验证直接调用方并按最小权限访问下游。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="520" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c"><text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700">工作负载拥有独立、短期、可验证身份</text><rect x="390" y="80" width="400" height="95" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="590" y="113" text-anchor="middle" font-size="16" font-weight="700">工作负载 CA / 云 IAM / 身份控制面</text><text x="590" y="140" text-anchor="middle" font-size="12">验证部署身份 → 签发短期证书/Token → 自动续期与撤销</text><g text-anchor="middle"><rect x="70" y="260" width="250" height="125" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="195" y="295" font-size="15" font-weight="700">订单服务身份</text><text x="195" y="324" font-size="12">spiffe://prod/order</text><text x="195" y="348" font-size="11">专属 ServiceAccount</text><rect x="465" y="260" width="250" height="125" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="590" y="295" font-size="15" font-weight="700">库存服务身份</text><text x="590" y="324" font-size="12">验证 mTLS SAN / 信任域</text><text x="590" y="348" font-size="11">授权 order 调 reserve API</text><rect x="860" y="260" width="250" height="125" rx="9" fill="#f3eff8" stroke="#8064a2"/><text x="985" y="295" font-size="15" font-weight="700">数据库 / 云 API</text><text x="985" y="324" font-size="12">面向 workload 的最小权限</text><text x="985" y="348" font-size="11">无共享永久 Access Key</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M470 175L260 253"/><path d="M590 175V253"/><path d="M710 175L920 253"/><path d="M320 322H458"/><path d="M715 322H853"/></g><text x="590" y="452" text-anchor="middle" font-size="12" font-weight="700">mTLS 证明直接调用 workload；用户资源权限仍由受约束委托 + 资源事实决定</text></g></svg>
