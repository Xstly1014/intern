<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" role="img" aria-labelledby="t d"><title id="t">创建订单经过边缘系统的完整链路</title><desc id="d">订单 POST 从 App 经 DNS、DDoS、TLS、Bot WAF、CDN、区域 LB、网关到订单服务</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1020" height="720" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="510" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17342c">创建订单在边缘链路中的逐层处理</text><g><rect x="100" y="80" width="820" height="64" rx="12" fill="#fff" stroke="#607d8b"/><text x="130" y="107" font-size="15" font-weight="700">App</text><text x="230" y="107" font-size="12" fill="#607d8b">POST /orders · Access Token · Idempotency-Key</text><rect x="100" y="168" width="820" height="64" rx="12" fill="#edf3fa" stroke="#4f7cac"/><text x="130" y="195" font-size="15" font-weight="700">DNS / GSLB</text><text x="280" y="195" font-size="12" fill="#607d8b">选择健康、合规且有容量的最近边缘</text><rect x="100" y="256" width="820" height="64" rx="12" fill="#fbecef" stroke="#b44c5b"/><text x="130" y="283" font-size="15" font-weight="700">Anti-DDoS</text><text x="280" y="283" font-size="12" fill="#607d8b">清洗 L3 / L4 攻击</text><rect x="100" y="344" width="820" height="64" rx="12" fill="#e8f5f0" stroke="#3c8772"/><text x="130" y="371" font-size="15" font-weight="700">TLS Edge</text><text x="255" y="371" font-size="12" fill="#607d8b">TLS 1.3 / h2 · 清洗外部 Forwarded Header</text><rect x="100" y="432" width="820" height="64" rx="12" fill="#fff8e6" stroke="#cc9a2e"/><text x="130" y="459" font-size="15" font-weight="700">Bot / WAF</text><text x="260" y="459" font-size="12" fill="#607d8b">设备风险 · Schema · Body · 速率；不判断库存业务</text><rect x="100" y="520" width="820" height="64" rx="12" fill="#f3eff8" stroke="#8b6fb3"/><text x="130" y="547" font-size="15" font-weight="700">LB / Gateway</text><text x="285" y="547" font-size="12" fill="#607d8b">POST bypass 缓存 · 安全回源 · Token 初检 · 租户限流</text><rect x="100" y="608" width="820" height="64" rx="12" fill="#fbecef" stroke="#b44c5b"/><text x="130" y="635" font-size="15" font-weight="700">BFF / Order</text><text x="275" y="635" font-size="12" fill="#607d8b">协议转换、资源授权与订单业务规则</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M510 144V162"/><path d="M510 232V250"/><path d="M510 320V338"/><path d="M510 408V426"/><path d="M510 496V514"/><path d="M510 584V602"/></g></g></svg>
