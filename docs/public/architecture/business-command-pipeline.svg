<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="t d"><title id="t">业务命令处理管线</title><desc id="d">命令依次经过上下文校验、聚合加载、授权、领域行为、并发保存、Outbox 与提交。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="470" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">一个命令，一条可证明的状态变化路径</text><g font-size="12"><rect x="25" y="110" width="130" height="85" rx="8" fill="#fff" stroke="#607d8b"/><text x="90" y="140" font-weight="700">业务意图</text><text x="90" y="166">Command + context</text><rect x="180" y="110" width="130" height="85" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="245" y="140" font-weight="700">用例校验</text><text x="245" y="166">tenant · 幂等</text><rect x="335" y="110" width="130" height="85" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="400" y="140" font-weight="700">加载聚合</text><text x="400" y="166">ID + tenant + version</text><rect x="490" y="110" width="130" height="85" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="555" y="140" font-weight="700">资源授权</text><text x="555" y="166">最新业务事实</text><rect x="645" y="110" width="130" height="85" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="710" y="140" font-weight="700">领域行为</text><text x="710" y="166">状态机 / 不变量</text><rect x="800" y="110" width="130" height="85" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="865" y="140" font-weight="700">并发保存</text><text x="865" y="166">约束 / 版本</text><rect x="955" y="110" width="200" height="85" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="1055" y="140" font-weight="700">Outbox + 审计</text><text x="1055" y="166">同事务提交</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M155 152H173"/><path d="M310 152H328"/><path d="M465 152H483"/><path d="M620 152H638"/><path d="M775 152H793"/><path d="M930 152H948"/></g><rect x="125" y="275" width="930" height="70" rx="8" fill="#fff" stroke="#a5b8b2"/><text x="590" y="305" font-size="13" font-weight="700">数据库事务：加载 → 授权 → 领域变化 → 保存 → 幂等 / Outbox / 审计</text><text x="590" y="330" font-size="11" fill="#9a3345">事务外：远程 HTTP · Broker 确认 · 大文件 · 邮件 · 不受控计算</text><text x="590" y="410" font-size="12" font-weight="700">提交后发布事实；外部响应由用例 Result 映射，不泄露持久化模型</text></g></svg>
