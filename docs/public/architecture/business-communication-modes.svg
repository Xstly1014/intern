<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 510" role="img" aria-labelledby="t d"><title id="t">同步查询、异步事实与流程命令选择</title><desc id="d">根据当前决策是否必须等待、事实是否已发生和流程是否长期运行选择通信方式。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="510" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">通信方式表达业务时序与失败语义</text><rect x="425" y="90" width="330" height="80" rx="8" fill="#fff" stroke="#607d8b"/><text x="590" y="122" font-size="15" font-weight="700">当前业务决策必须等待结果吗？</text><text x="590" y="148" font-size="11">例如提交订单必须知道价格/库存是否可接受</text><rect x="55" y="250" width="300" height="140" rx="9" fill="#edf3fa" stroke="#4f7cac"/><text x="205" y="285" font-size="16" font-weight="700">是：同步 HTTP / gRPC</text><text x="205" y="315" font-size="12">deadline · 错误契约 · 幂等</text><text x="205" y="342" font-size="11">控制链深、重试与舱壁</text><rect x="440" y="250" width="300" height="140" rx="9" fill="#e8f5f0" stroke="#2f7d68"/><text x="590" y="285" font-size="16" font-weight="700">事实已发生：集成事件</text><text x="590" y="315" font-size="12">过去式 · 多消费者 · 最终一致</text><text x="590" y="342" font-size="11">重复、乱序、Schema、滞后</text><rect x="825" y="250" width="300" height="140" rx="9" fill="#fff8e6" stroke="#c69a32"/><text x="975" y="285" font-size="16" font-weight="700">异步动作：命令 / Saga</text><text x="975" y="315" font-size="12">削峰 · 长流程 · 状态查询</text><text x="975" y="342" font-size="11">过期、重试、补偿、所有者</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M500 170L260 243"/><path d="M590 170V243"/><path d="M680 170L920 243"/></g><text x="330" y="215" font-size="11">必须</text><text x="590" y="215" font-size="11">通知事实</text><text x="850" y="215" font-size="11">可延迟执行</text><text x="590" y="455" font-size="12" font-weight="700">“使用 MQ”不自动解耦；消费者仍依赖事件语义、顺序、数据和发布者生命周期</text></g></svg>
