<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="title desc"><title id="title">小型系统 API 网关部署拓扑</title><desc id="desc">展示云 DNS、WAF 与负载均衡后部署跨故障域的两个网关实例，再调用 BFF、模块化单体或少量服务</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="980" height="410" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="490" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#17342c">小型系统：保持简单，但不牺牲入口冗余</text><g text-anchor="middle"><rect x="45" y="115" width="200" height="120" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="145" y="150" font-size="16" font-weight="700">云入口</text><text x="145" y="177" font-size="12">DNS / WAF / L7 LB</text><text x="145" y="201" font-size="11">托管 TLS、防护与健康调度</text><rect x="325" y="80" width="260" height="95" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="455" y="114" font-size="16" font-weight="700">Gateway 实例 A</text><text x="455" y="141" font-size="11">故障域 A · 最后有效路由快照</text><rect x="325" y="205" width="260" height="95" rx="8" fill="#e8f5f0" stroke="#2f7d68"/><text x="455" y="239" font-size="16" font-weight="700">Gateway 实例 B</text><text x="455" y="266" font-size="11">故障域 B · 可独立接管流量</text><rect x="665" y="115" width="270" height="120" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="800" y="150" font-size="16" font-weight="700">上游应用</text><text x="800" y="177" font-size="12">BFF / 模块化单体 / 少量服务</text><text x="800" y="201" font-size="11">资源授权、业务规则与数据事实</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M245 165L320 127"/><path d="M245 185L320 252"/><path d="M585 127L660 165"/><path d="M585 252L660 185"/></g><rect x="120" y="335" width="740" height="42" rx="7" fill="#fff" stroke="#a5b8b2"/><text x="490" y="362" text-anchor="middle" font-size="12" fill="#455a64">两个实例必须实际跨故障域，并经过 readiness、摘流、容量余量和回滚演练</text></g></svg>
