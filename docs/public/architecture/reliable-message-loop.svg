<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" role="img" aria-labelledby="t d"><title id="t">可靠消息闭环</title><desc id="d">业务事务保存 Outbox，经 Relay 投递 Broker，由幂等消费者处理并在失败时重试和死信</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1050" height="560" rx="20" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="525" y="42" font-size="23" font-weight="700" fill="#17342c">从业务事务到消费确认的可靠消息闭环</text><g><rect x="45" y="120" width="210" height="110" rx="14" fill="#fbecef" stroke="#b44c5b" stroke-width="2"/><text x="150" y="154" font-size="16" font-weight="700">本地数据库事务</text><text x="150" y="183" font-size="12" fill="#607d8b">业务数据 + Outbox</text><text x="150" y="205" font-size="10" fill="#607d8b">同一事务提交</text><rect x="305" y="120" width="160" height="110" rx="14" fill="#edf3fa" stroke="#4f7cac" stroke-width="2"/><text x="385" y="154" font-size="16" font-weight="700">Outbox Relay</text><text x="385" y="183" font-size="11" fill="#607d8b">扫描 / CDC</text><text x="385" y="205" font-size="10" fill="#607d8b">确认与重试</text><rect x="515" y="105" width="210" height="140" rx="14" fill="#fff8e6" stroke="#cc9a2e" stroke-width="2"/><text x="620" y="143" font-size="17" font-weight="700">Message Broker</text><text x="620" y="173" font-size="12" fill="#607d8b">持久化 · 副本</text><text x="620" y="196" font-size="12" fill="#607d8b">Producer Confirm</text><text x="620" y="219" font-size="11" fill="#607d8b">分区 / 队列 / Offset</text><rect x="775" y="120" width="230" height="110" rx="14" fill="#e8f5f0" stroke="#3c8772" stroke-width="2"/><text x="890" y="154" font-size="16" font-weight="700">幂等消费者</text><text x="890" y="183" font-size="12" fill="#607d8b">业务提交后 ACK</text><text x="890" y="205" font-size="10" fill="#607d8b">事件 ID / 唯一约束</text></g><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M255 175H299"/><path d="M465 175H509"/><path d="M725 175H769"/></g><rect x="185" y="350" width="680" height="120" rx="15" fill="#fff" stroke="#c07a3d" stroke-width="2"/><text x="525" y="382" font-size="16" font-weight="700">失败恢复支路</text><g><rect x="225" y="405" width="130" height="42" rx="9" fill="#fff4e8" stroke="#c07a3d"/><text x="290" y="431" font-size="12">指数退避重试</text><rect x="460" y="405" width="130" height="42" rx="9" fill="#fbecef" stroke="#b44c5b"/><text x="525" y="431" font-size="12">死信 / 隔离</text><rect x="695" y="405" width="130" height="42" rx="9" fill="#f3eff8" stroke="#8b6fb3"/><text x="760" y="431" font-size="12">重放 / 人工修复</text></g><g stroke="#607d8b" marker-end="url(#a)"><path d="M355 426H454"/><path d="M590 426H689"/><path d="M890 230V310Q890 330 870 330H290Q270 330 270 350"/></g><text x="525" y="520" font-size="12" fill="#607d8b">工程上默认消息至少一次投递：生产者可靠发布 + Broker 持久化 + 消费者幂等 + 可重放修复</text></g></svg>
