<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">业务服务层运行时边界</title><desc id="d">BFF 将业务命令交给服务，服务拥有用例、规则和事务，通过端口使用数据、消息和外部系统。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker></defs><rect width="1180" height="500" rx="18" fill="#f7faf9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17342c" text-anchor="middle"><text x="590" y="42" font-size="24" font-weight="700">业务服务拥有规则、状态与一致性边界</text><rect x="40" y="110" width="190" height="120" rx="8" fill="#edf3fa" stroke="#4f7cac"/><text x="135" y="145" font-size="15" font-weight="700">网关 / BFF</text><text x="135" y="174" font-size="11">Command / Query</text><text x="135" y="198" font-size="11">subject · tenant · deadline</text><rect x="315" y="85" width="550" height="190" rx="10" fill="#e8f5f0" stroke="#2f7d68" stroke-width="2"/><text x="590" y="122" font-size="17" font-weight="700">业务服务</text><text x="590" y="153" font-size="13">应用用例 · 资源授权 · 聚合 / 状态机 · 本地事务</text><text x="590" y="183" font-size="13">幂等 · 并发控制 · 领域事件 · Saga 状态</text><text x="590" y="224" font-size="11" fill="#9a3345">不暴露 Entity · 不写其他服务数据库 · 不把规则放进中间件</text><rect x="950" y="110" width="190" height="120" rx="8" fill="#fff8e6" stroke="#c69a32"/><text x="1045" y="145" font-size="15" font-weight="700">其他业务服务</text><text x="1045" y="174" font-size="11">稳定 API / 集成事件</text><text x="1045" y="198" font-size="11">各自拥有事实</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M230 170H308"/><path d="M865 170H943"/></g><rect x="115" y="340" width="270" height="80" rx="8" fill="#fff" stroke="#607d8b"/><text x="250" y="372" font-size="14" font-weight="700">数据端口</text><text x="250" y="398" font-size="11">Repository · 事务 · 锁</text><rect x="455" y="340" width="270" height="80" rx="8" fill="#f3eff8" stroke="#8064a2"/><text x="590" y="372" font-size="14" font-weight="700">消息端口</text><text x="590" y="398" font-size="11">Outbox · Broker · Scheduler</text><rect x="795" y="340" width="270" height="80" rx="8" fill="#fbecef" stroke="#b44c5b"/><text x="930" y="372" font-size="14" font-weight="700">外部系统端口</text><text x="930" y="398" font-size="11">支付 · 物流 · 风控适配</text><g stroke="#607d8b" stroke-width="2" marker-end="url(#a)"><path d="M470 275L300 333"/><path d="M590 275V333"/><path d="M710 275L880 333"/></g></g></svg>
