<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线上问题排查面试高频100题</title><link rel="stylesheet" href="/intern/interview/interview.css"></head><body><main class="page"><div class="topbar"><a class="back" href="/intern/interview/">← 返回面试专题</a><span>Java 后端面试题库</span></div><header class="hero"><h1>线上问题排查面试高频 100 题</h1><p class="lead">围绕 CPU、内存、线程、网络、数据库、中间件、容器、发布和故障复盘，训练从现象到证据、从定位到止损的完整排障能力。</p><div class="stats"><span class="stat">题目数：<b id="count">0</b></span><span class="stat">10 个专题</span><span class="stat">支持全文筛选</span></div></header><div class="search"><input id="search" placeholder="搜索题目，例如CPU、GC、慢SQL、死锁、连接池"><div id="empty" class="empty">没有匹配题目</div></div><div id="app"></div><footer>线上排障回答建议遵循：先止损，再取证；先确认时间线，再提出假设。</footer></main><script>window.INTERVIEW_DATA={sections:[
{title:'排障方法论',note:'面试官关注你是否能建立证据链，而不是背命令。',answer:'先确认影响范围、开始时间、变更和SLO，再采取可逆止损；通过指标、日志、Trace、线程和系统证据逐层缩小范围，最后验证假设并复盘。',followup:'如果信息不完整，你如何避免误判？',questions:['线上故障排查第一步做什么？','如何判断影响范围？','为什么要先看时间线？','如何区分现象和根因？','止损和根因修复有什么区别？','如何设计排障假设？','如何避免只看单机指标？','证据不足时如何推进？','什么时候应该升级故障等级？','故障复盘应包含哪些内容？']},
{title:'CPU与系统负载',note:'从进程、线程、系统调用和容器配额层层定位。',answer:'先看load、CPU user/system/iowait和容器限额，再定位进程和线程；Java进程使用线程栈、热点采样和火焰图确认是业务循环、锁竞争、GC还是系统调用。',followup:'CPU打满但QPS下降，你会先检查什么？',questions:['load average如何理解？','CPU user和system如何区分？','iowait升高说明什么？','如何定位高CPU进程？','如何定位Java高CPU线程？','线程栈如何映射到业务代码？','火焰图如何阅读？','容器CPU limit会造成什么？','频繁上下文切换如何排查？','CPU低但请求慢可能是什么？']},
{title:'内存与OOM',note:'区分堆、非堆、直接内存和系统内存。',answer:'先确认是Java heap OOM、Metaspace、Direct Buffer、线程栈还是容器被OOM Killer杀掉；结合堆曲线、GC日志、dump、对象统计和分配热点判断泄漏、突增或配置不足。',followup:'堆使用率不高但进程仍被杀，原因可能是什么？',questions:['Java OOM有哪些常见类型？','如何确认是容器OOM Killer？','堆内存曲线怎么看？','如何生成和分析heap dump？','内存泄漏与内存溢出区别？','Metaspace增长如何排查？','直接内存泄漏如何定位？','线程过多会造成什么内存问题？','大对象分配如何发现？','线上dump会带来哪些风险？']},
{title:'GC与停顿',note:'围绕分配、回收、晋升、停顿和业务指标。',answer:'结合GC日志和JVM指标看Young GC频率、Old GC、晋升失败、堆外分配和暂停时间；优化前先确认分配速率、存活对象和延迟目标，不能只盲目调大堆。',followup:'Full GC频繁但回收后仍高，下一步怎么做？',questions:['Young GC频繁说明什么？','Full GC常见原因有哪些？','如何查看GC暂停时间？','对象为什么会晋升老年代？','大对象如何影响GC？','如何选择G1或其他收集器？','堆大小如何与容器内存匹配？','GC日志如何关联请求延迟？','Safepoint时间过长怎么排查？','调GC参数前需要哪些基线？']},
{title:'线程、锁与死锁',note:'把线程状态、锁竞争和业务调用链结合起来。',answer:'通过线程dump查看BLOCKED、WAITING和RUNNABLE线程，锁定持有者和等待者；死锁要形成锁依赖图，先止损恢复服务，再修复锁顺序、锁粒度或超时策略。',followup:'线程都在WAITING，如何判断是正常还是故障？',questions:['如何获取线程dump？','BLOCKED和WAITING区别？','如何识别死锁？','锁竞争如何量化？','线程池耗尽如何排查？','大量TIMED_WAITING可能是什么？','如何分析线程栈重复模式？','锁顺序为什么能避免死锁？','如何设计可超时锁？','线程中断在排障中有什么作用？']},
{title:'网络与连接池',note:'从DNS、连接、TLS、请求和响应逐段测量。',answer:'先区分客户端连接失败、连接池耗尽、服务端处理慢和响应读取慢；使用连接池活跃数、等待数、超时、重试和TCP指标，避免把所有网络问题归为“对方慢”。',followup:'连接池满但服务端QPS不高，可能是什么？',questions:['DNS慢如何定位？','TCP连接建立慢怎么看？','连接池耗尽的常见原因？','HTTP连接复用有什么条件？','TLS握手慢如何排查？','读超时和连接超时区别？','重试风暴如何形成？','TIME_WAIT过多如何处理？','网络丢包和延迟如何测量？','如何给调用链分配超时预算？']},
{title:'数据库与慢SQL',note:'慢SQL排查必须结合执行计划、锁和资源。',answer:'先确认慢查询时间、调用来源和数据库负载，再看执行计划、索引选择、扫描行数、锁等待、连接池和主从延迟；修改SQL或索引前要评估写放大和线上发布风险。',followup:'有索引但仍慢，你会检查哪些因素？',questions:['慢SQL如何定位来源？','EXPLAIN重点看哪些字段？','索引为什么可能不生效？','回表是什么？','锁等待如何排查？','数据库连接池耗尽怎么办？','主从延迟如何影响业务？','事务未提交如何发现？','大事务会带来哪些问题？','线上加索引如何降低风险？']},
{title:'缓存与消息中间件',note:'区分缓存命中、数据一致性、消息可靠性和堆积。',answer:'缓存问题从命中率、热点key、穿透/击穿/雪崩和淘汰策略排查；消息问题看生产成功、消费延迟、重试、死信、分区热点和消费者负载，不能只看队列总长度。',followup:'消息堆积时如何决定扩容还是降级？',questions:['缓存命中率下降如何排查？','缓存穿透如何确认？','热点key如何定位？','缓存雪崩如何止损？','消息生产失败如何处理？','消费延迟和堆积区别？','如何定位分区热点？','重复消费如何证明和修复？','死信消息如何处置？','消息系统故障如何降级？']},
{title:'容器、发布与配置',note:'很多线上问题来自资源、镜像、配置和变更。',answer:'对比故障前后版本、镜像、配置、资源限制和节点状态；优先回滚或关闭开关止损，再确认启动探针、环境变量、挂载、时区和依赖服务差异。',followup:'发布后只有部分实例异常，如何判断原因？',questions:['容器重启原因如何确认？','OOMKilled和CrashLoopBackOff区别？','探针失败如何排查？','配置变更如何审计？','灰度实例异常看哪些差异？','镜像层和启动慢如何分析？','节点资源不足如何确认？','滚动发布为何可能扩大故障？','如何设计快速回滚？','配置中心不可用如何降级？']},
{title:'可观测、应急与复盘',note:'排障闭环最终要沉淀为指标、告警和Runbook。',answer:'指标回答是否异常，日志回答发生了什么，Trace回答在哪里慢，profile回答为什么耗资源；应急结束后要补充触发器、时间线、影响、检测缺口、修复项和负责人。',followup:'哪些告警属于高质量告警？',questions:['日志、指标、Trace如何配合？','如何设计RED和USE指标？','告警为什么会疲劳？','如何设置P99告警？','Trace采样如何权衡成本？','如何保护日志中的敏感数据？','应急指挥中如何分工？','什么是Runbook？','如何验证修复真的生效？','如何把一次故障转成长期改进？']}]};</script><script src="/intern/interview/interview.js"></script></body></html>
